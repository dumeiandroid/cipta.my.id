const DEFAULT_MASTER_TOGGLES = {
  analisis_utama: true, naskah_utama: true, artikel: true,
  surat_proposal: true, deskripsi_gambar: true, caption_tagar: true
};

function status(msg, type='info'){
  const el = document.getElementById('status');
  el.textContent = msg; el.className = 'status show ' + type;
}
function getHeaders(table){
  return { 'Content-Type':'application/json', 'X-Custom-Auth': SECRET, 'X-Table-Name': table, 'X-Role': 'admin' };
}

async function checkCurrent(){
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value.trim();
  if(!u || !p){ status('❌ Isi username & password dulu', 'err'); return; }
  const btn = document.getElementById('btnCheck');
  btn.disabled = true; btn.textContent = 'Memeriksa...';
  status('⏳ Memeriksa user...', 'info');
  try{
    const r = await fetch(`${API_URL}?table=${USERS_TABLE}`, { headers: getHeaders(USERS_TABLE) });
    const res = await r.json();
    if(!res.success || !res.data){ status('❌ Gagal ambil data user', 'err'); return; }
    const user = res.data.find(x => x.x_01 === u && x.x_02 === p);
    if(!user){ status('❌ Username atau password salah', 'err'); return; }
    if(u !== 'admin'){ status('❌ Hanya admin yang bisa seed', 'err'); return; }

    status('✅ Login OK. Mengambil config...', 'ok');
    document.getElementById('btnSeed').disabled = false;
    document.getElementById('btnDelete').disabled = false;

    const r2 = await fetch(`${API_URL}?table=${KONTROL_TABLE}`, { headers: getHeaders(KONTROL_TABLE) });
    const res2 = await r2.json();
    if(res2.success && res2.data){
      const row = res2.data.find(x => x.id_x == KONTROL_ID);
      if(row){
        status(`✅ Row id_x=${KONTROL_ID} sudah ada. Klik "Seed" untuk MENGGANTI.`, 'ok');
      } else {
        status(`ℹ️ Row id_x=${KONTROL_ID} belum ada. Klik "Seed".`, 'info');
      }
    }
  } catch(e){ status('❌ Error: ' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '🔍 Cek Config'; }
}

async function doSeed(){
  if(!confirm(`⚠️ Seed akan MENGGANTI seluruh config di id_x=${KONTROL_ID}. Lanjut?`)) return;
  const btn = document.getElementById('btnSeed');
  btn.disabled = true; btn.textContent = '⏳ Menyimpan...';
  status('⏳ Menyimpan config ke DB...', 'info');
  try{
    const payload = {
      x_01: JSON.stringify({ categories: DEFAULT_CATEGORIES, outputModules: DEFAULT_MODULES }),
      x_02: new Date().toISOString(),
      x_03: document.getElementById('u').value.trim() || 'seeder',
      x_04: '1.0',
      x_05: '1', x_06: '1', x_07: '1', x_08: '1', x_09: '1', x_10: '1'
    };
    const r = await fetch(`${API_URL}?table=${KONTROL_TABLE}`, { headers: getHeaders(KONTROL_TABLE) });
    const res = await r.json();
    const exists = res.success && res.data && res.data.some(x => x.id_x == KONTROL_ID);
    const method = exists ? 'PUT' : 'POST';
    const endpoint = exists ? `&id_x=${KONTROL_ID}` : '';
    
    const r2 = await fetch(`${API_URL}?table=${KONTROL_TABLE}${endpoint}`, {
      method, headers: getHeaders(KONTROL_TABLE), body: JSON.stringify(payload)
    });
    const res2 = await r2.json();
    if(!res2.success && !res2.id_x) throw new Error(res2.error || res2.message || 'Gagal simpan');
    status(`✅ BERHASIL! Config ter-${exists ? 'update' : 'buat'} di id_x=${KONTROL_ID}.\n\nSilakan buka index_simple.html (hard refresh Ctrl+Shift+R).`, 'ok');
  } catch(e){ status('❌ Gagal seed: ' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '🌱 Seed ke id_x=9'; }
}

async function doDelete(){
  if(!confirm(`⚠️ Hapus row id_x=${KONTROL_ID}?`)) return;
  const btn = document.getElementById('btnDelete');
  btn.disabled = true; btn.textContent = '⏳ Menghapus...';
  try{
    const r = await fetch(`${API_URL}?table=${KONTROL_TABLE}&id_x=${KONTROL_ID}`, { method: 'DELETE', headers: getHeaders(KONTROL_TABLE) });
    const res = await r.json();
    if(res.success || res.deleted) status('✅ Row terhapus', 'ok');
    else throw new Error(res.error || res.message || 'Gagal hapus');
  } catch(e){ status('❌ Gagal hapus: ' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '🗑️ Hapus Row id_x=9'; }
}
