  .search-box { position: relative; max-width: 600px; margin: 0 auto 20px; }
  .search-box input {
    width: 100%;

    pointer-events: none;
  }

  .stats { text-align: center; color: white; margin-bottom: 20px; font-size: 0.95rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
    border-left: 5px solid #11998e;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #11998e, #38ef7d);
    transform: scaleX(0);
    transition: transform 0.3s;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 12px 28px rgba(0,0,0,0.2); }
  .card:hover::before { transform: scaleX(1); }

  .card .number {
    display: inline-block;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: white;
    font-size: 0.75rem;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .card h3 { font-size: 1.1rem; color: #2d3748; margin-bottom: 8px; }
  .card .pelajaran { font-size: 0.9rem; color: #718096; font-style: italic; line-height: 1.5; }

  .no-result {
    grid-column: 1 / -1;
    text-align: center;
    color: white;
    padding: 60px 20px;
    font-size: 1.1rem;
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    backdrop-filter: blur(10px);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    animation: fadeIn 0.3s;
  }
  .modal-overlay.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal {
    background: white;
    border-radius: 20px;
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 35px;
    position: relative;
    animation: slideUp 0.4s;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .modal-close {
    position: absolute;
    top: 15px; right: 15px;
    background: #f1f5f9;
    border: none;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    transition: 0.2s;
    color: #64748b;
  }
  .modal-close:hover { background: #e2e8f0; transform: rotate(90deg); }

  .modal .badge {
    display: inline-block;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: white;
    font-size: 0.8rem;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 15px;
  }

  .modal h2 { font-size: 1.6rem; color: #1a202c; margin-bottom: 20px; }

  .modal .section { margin-bottom: 22px; }
  .modal .section h4 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #11998e;
    margin-bottom: 10px;
    font-weight: 700;
  }
  .modal .section p { font-size: 1rem; line-height: 1.75; color: #4a5568; }

  .modal .section.pelajaran-box {
    background: #f0fdf9;
    border-left: 4px solid #11998e;
    padding: 18px 20px;
    border-radius: 0 12px 12px 0;

    line-height: 1.7;
    color: #4a5568;

    position: absolute;
    left: 0;
    color: #11998e;
    font-weight: bold;
  }
  .modal ul li strong { color: #2d3748; }

/* =========================================================
   RENDER & LOGIKA
   ========================================================= */
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const stats = document.getElementById('stats');
const modalOverlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');

function renderCards(data) {
  grid.innerHTML = '';

  if (data.length === 0) {
    grid.innerHTML = `<div class="no-result">😕 Tidak ada cerita yang cocok dengan pencarianmu.<br><small>Coba kata kunci lain.</small></div>`;
    stats.textContent = `Menampilkan 0 dari ${ceritaData.length} cerita`;
    return;
  }

  data.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="number">Cerita #${c.id}</span>
      <h3>${c.judul}</h3>
      <p class="pelajaran">"${c.pelajaran}"</p>
    `;
    card.addEventListener('click', () => openModal(c));
    grid.appendChild(card);
  });

  stats.textContent = `Menampilkan ${data.length} dari ${ceritaData.length} cerita`;
}

function openModal(c) {
  const tambahan = (c.pelajaranTambahan || [])
    .map(p => `<li>${p}</li>`)
    .join('');

  modalContent.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <span class="badge">Seri 3 · Cerita #${c.id}</span>
    <h2>${c.judul}</h2>

    <div class="section">
      <h4>📖 Ringkasan Cerita</h4>
      <p>${c.ringkasan}</p>
    </div>

    <div class="section pelajaran-box">
      <h4>💡 Pelajaran Utama</h4>
      <p>${c.pelajaran}</p>
    </div>

    ${tambahan ? `
    <div class="section">
      <h4>✨ Pelajaran Tambahan</h4>
      <ul>${tambahan}</ul>
    </div>` : ''}
  `;

  modalOverlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalOverlay.classList.remove('active');
  document.body.style.overflow = '';
}

modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();

  if (!q) {
    renderCards(ceritaData);
    return;
  }

  const filtered = ceritaData.filter(c => {
    const gabungan = [
      c.judul,
      c.ringkasan,
      c.pelajaran,
      ...(c.pelajaranTambahan || [])
    ].join(' ').toLowerCase();

    return gabungan.includes(q);
  });

  renderCards(filtered);
});

renderCards(ceritaData);
</script>
