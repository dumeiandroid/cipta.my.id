<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Klasik — Lidan</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   ROOT & RESET
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --line-height: 32px;
  --paper-bg: #fdf8f0;
  --paper-bg2: #faf5ea;
  --line-color: #b8d4e8;
  --line-color2: #d4b896;
  --leather-dark: #2c1a0e;
  --leather-mid: #5c3a1e;
  --leather-light: #8b5e3c;
  --leather-accent: #c4855a;
  --gold: #c9a84c;
  --gold-dark: #8b6914;
  --ink: #1a1008;
  --ink-light: #3d2b1f;
  --ink-muted: #7a5c42;
  --red-accent: #8b2020;
  --cover-bg: linear-gradient(160deg,#3d1f0a 0%,#6b3520 40%,#4a2210 70%,#2c1208 100%);
  --shadow-paper: 4px 4px 20px rgba(0,0,0,0.35), -2px -2px 8px rgba(0,0,0,0.1);
  --shadow-book: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.1);
  --font-display: 'Special Elite', cursive;
  --font-hand: 'Caveat', cursive;
  --font-serif: 'Libre Baskerville', serif;
}

body {
  font-family: var(--font-serif);
  background: #1a0f06;
  background-image:
    radial-gradient(ellipse at 30% 20%, #2d1a08 0%, transparent 60%),
    radial-gradient(ellipse at 70% 80%, #1f0f04 0%, transparent 60%);
  min-height: 100vh;
  overflow: hidden;
  color: var(--ink);
}

/* ═══════════════════════════════════════════════
   APP SHELL & VIEWS
═══════════════════════════════════════════════ */
#app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

.view {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease;
}
.view.active { opacity: 1; pointer-events: all; }

/* ═══════════════════════════════════════════════
   COVER PAGE
═══════════════════════════════════════════════ */
#view-cover {
  background: var(--cover-bg);
  flex-direction: column;
  gap: 0;
}

.cover-book {
  width: min(380px, 88vw);
  background: var(--cover-bg);
  border-radius: 4px 16px 16px 4px;
  box-shadow:
    var(--shadow-book),
    inset -4px 0 12px rgba(0,0,0,0.4),
    inset 4px 0 8px rgba(255,200,120,0.05);
  position: relative;
  padding: 40px 36px;
  min-height: 480px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer;
  border-left: 18px solid #1a0a02;
  overflow: hidden;
}

.cover-book::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 3px,
      rgba(255,200,100,0.02) 3px,
      rgba(255,200,100,0.02) 4px
    );
  pointer-events: none;
}

.cover-book::after {
  content: '';
  position: absolute;
  top: 0; left: 18px; bottom: 0; width: 6px;
  background: linear-gradient(90deg, rgba(255,180,80,0.15), transparent);
  pointer-events: none;
}

.cover-spine-line {
  position: absolute;
  left: 26px; top: 20px; bottom: 20px;
  width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.4) 20%, rgba(201,168,76,0.4) 80%, transparent);
}

.cover-ornament {
  width: 140px; height: 4px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 10px 0;
}

.cover-ornament-double {
  width: 140px; height: 8px;
  display: flex; flex-direction: column; gap: 3px;
  margin: 8px 0;
}
.cover-ornament-double span {
  display: block; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.cover-ornament-double span:last-child {
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), transparent);
}

.cover-monogram {
  font-family: var(--font-display);
  font-size: 72px;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(201,168,76,0.3), 2px 2px 4px rgba(0,0,0,0.8);
  line-height: 1;
  margin: 12px 0;
}

.cover-title {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--gold);
  letter-spacing: 6px;
  text-align: center;
  text-shadow: 0 0 20px rgba(201,168,76,0.2);
  margin: 4px 0;
}

.cover-subtitle {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 11px;
  color: rgba(201,168,76,0.6);
  letter-spacing: 3px;
  text-align: center;
  margin: 2px 0;
}

.cover-year {
  font-family: var(--font-hand);
  font-size: 18px;
  color: rgba(201,168,76,0.5);
  margin-top: 16px;
}

.cover-corner {
  position: absolute;
  width: 28px; height: 28px;
  border-color: var(--gold);
  border-style: solid;
  opacity: 0.4;
}
.cover-corner.tl { top: 16px; left: 36px; border-width: 2px 0 0 2px; }
.cover-corner.tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
.cover-corner.bl { bottom: 16px; left: 36px; border-width: 0 0 2px 2px; }
.cover-corner.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

.cover-tap-hint {
  font-family: var(--font-hand);
  font-size: 14px;
  color: rgba(201,168,76,0.5);
  margin-top: 28px;
  animation: breathe 2.5s ease-in-out infinite;
}
@keyframes breathe { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

/* ═══════════════════════════════════════════════
   INDEX / DAFTAR ISI
═══════════════════════════════════════════════ */
#view-index { padding: 20px; }

.index-book {
  width: min(760px, 96vw);
  max-height: 90vh;
  background: var(--paper-bg);
  border-radius: 2px 8px 8px 2px;
  box-shadow: var(--shadow-paper);
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
}

.index-header {
  background: linear-gradient(135deg, #3d1f0a, #6b3520);
  padding: 18px 24px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 3px solid var(--gold);
}

.index-header-title {
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--gold);
  letter-spacing: 3px;
}

.index-header-controls {
  display: flex; gap: 10px; align-items: center;
}

.btn-retro {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 1px;
  background: transparent;
  border: 1.5px solid var(--gold);
  color: var(--gold);
  padding: 6px 14px;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-retro:hover { background: var(--gold); color: var(--leather-dark); }

.index-search-bar {
  padding: 12px 20px;
  border-bottom: 1px solid rgba(180,150,100,0.3);
  background: rgba(253,248,240,0.8);
  display: flex; gap: 10px; align-items: center;
}

.search-input-wrap {
  flex: 1; position: relative;
}
.search-input-wrap input {
  width: 100%;
  font-family: var(--font-hand);
  font-size: 16px;
  background: transparent;
  border: none;
  border-bottom: 1.5px solid var(--leather-light);
  padding: 4px 8px 4px 24px;
  color: var(--ink);
  outline: none;
}
.search-input-wrap input::placeholder { color: var(--ink-muted); font-style: italic; }
.search-icon {
  position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
  font-size: 13px; color: var(--ink-muted);
}

.sort-select {
  font-family: var(--font-serif);
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--leather-light);
  color: var(--ink);
  padding: 4px 8px;
  border-radius: 2px;
  cursor: pointer;
}

.index-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.index-body::-webkit-scrollbar { width: 6px; }
.index-body::-webkit-scrollbar-track { background: rgba(180,150,100,0.1); }
.index-body::-webkit-scrollbar-thumb { background: var(--leather-light); border-radius: 2px; }

.index-entry {
  display: flex; align-items: baseline;
  padding: 10px 24px;
  border-bottom: 1px dashed rgba(180,150,100,0.2);
  cursor: pointer;
  transition: background 0.15s;
  gap: 12px;
}
.index-entry:hover { background: rgba(180,150,100,0.08); }

.entry-num {
  font-family: var(--font-hand);
  font-size: 13px;
  color: var(--ink-muted);
  min-width: 28px;
}
.entry-title {
  font-family: var(--font-hand);
  font-size: 17px;
  color: var(--ink);
  flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.entry-type {
  font-family: var(--font-serif);
  font-size: 10px;
  letter-spacing: 1px;
  padding: 2px 7px;
  border-radius: 2px;
  border: 1px solid;
}
.entry-type.text { color: var(--leather-mid); border-color: var(--leather-light); }
.entry-type.audio { color: var(--red-accent); border-color: var(--red-accent); }

.entry-date {
  font-family: var(--font-serif);
  font-size: 10px;
  color: var(--ink-muted);
  white-space: nowrap;
  font-style: italic;
}

.entry-dots {
  flex: 1;
  border-bottom: 1px dotted rgba(180,150,100,0.4);
  margin: 0 4px;
  height: 1px;
  align-self: center;
  min-width: 20px;
}

.index-empty {
  padding: 40px 24px;
  text-align: center;
  font-family: var(--font-hand);
  font-size: 18px;
  color: var(--ink-muted);
  font-style: italic;
}

.index-footer {
  padding: 12px 24px;
  border-top: 2px solid rgba(180,150,100,0.3);
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(253,248,240,0.9);
}
.index-footer-hint {
  font-family: var(--font-serif);
  font-size: 10px;
  color: var(--ink-muted);
  font-style: italic;
}

/* ═══════════════════════════════════════════════
   BOOK / NOTE VIEW
═══════════════════════════════════════════════ */
#view-book { padding: 20px 10px; }

.book-container {
  position: relative;
  display: flex;
  align-items: stretch;
  gap: 0;
  max-height: 88vh;
}

/* DESKTOP: two pages side-by-side */
.page-spread {
  display: flex;
  gap: 0;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.page {
  width: 380px;
  height: min(560px, 82vh);
  background: var(--paper-bg);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}

.page.left-page {
  border-radius: 8px 0 0 8px;
  background: var(--paper-bg2);
  box-shadow: inset -4px 0 16px rgba(0,0,0,0.15), inset 0 0 2px rgba(0,0,0,0.05);
}
.page.right-page {
  border-radius: 0 8px 8px 0;
  box-shadow: inset 4px 0 8px rgba(0,0,0,0.08);
}

/* Binding shadow in the middle */
.page-spread::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: 50%; width: 20px;
  transform: translateX(-50%);
  background: linear-gradient(90deg,
    rgba(0,0,0,0.2) 0%,
    rgba(0,0,0,0.05) 30%,
    transparent 50%,
    rgba(0,0,0,0.05) 70%,
    rgba(0,0,0,0.15) 100%
  );
  pointer-events: none;
  z-index: 5;
}

/* LINES on paper */
.page-lines {
  position: absolute; inset: 0;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent calc(var(--line-height) - 1px),
      var(--line-color) calc(var(--line-height) - 1px),
      var(--line-color) var(--line-height)
    );
  background-position: 0 64px;
}

.page-margin-line {
  position: absolute;
  top: 0; bottom: 0;
  left: 52px;
  width: 1px;
  background: rgba(220,100,100,0.3);
  pointer-events: none;
}

/* Page header */
.page-header {
  height: 56px;
  padding: 10px 16px 4px;
  border-bottom: 1.5px solid var(--gold-dark);
  display: flex; align-items: flex-end; justify-content: space-between;
  position: relative; z-index: 2;
  flex-shrink: 0;
}

.page-num {
  font-family: var(--font-hand);
  font-size: 13px;
  color: var(--ink-muted);
}

.page-title-input {
  font-family: var(--font-hand);
  font-size: 17px;
  color: var(--ink);
  border: none;
  background: transparent;
  outline: none;
  text-align: center;
  flex: 1;
  padding: 0 8px;
}
.page-title-input::placeholder { color: var(--ink-muted); font-style: italic; }

.page-date-stamp {
  font-family: var(--font-serif);
  font-size: 10px;
  color: var(--ink-muted);
  font-style: italic;
  white-space: nowrap;
}

/* Content area */
.page-content {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* The editable paper area */
.paper-editor {
  position: absolute; inset: 0;
  min-height: 100%;
  flex: 1;
  padding: 8px 16px 8px 58px;
  font-family: var(--font-hand);
  font-size: 17px;
  line-height: var(--line-height);
  color: var(--ink);
  outline: none;
  overflow: hidden;
  word-break: break-word;
  white-space: pre-wrap;
  z-index: 3;
}
.paper-editor[contenteditable="true"] { cursor: text; }
.paper-editor[contenteditable="true"]:empty::before {
  content: attr(data-placeholder);
  color: var(--ink-muted);
  font-style: italic;
  pointer-events: none;
}

/* Audio player (cassette style) */
.cassette-player {
  background: linear-gradient(135deg, #1a1a2e, #2d2d44);
  border-radius: 8px;
  padding: 12px 16px;
  margin: 8px 0;
  border: 1px solid rgba(201,168,76,0.3);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
}
.cassette-reels {
  display: flex; gap: 24px; justify-content: center; margin-bottom: 8px;
}
.cassette-reel {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 3px solid #c9a84c;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  animation: none;
}
.cassette-reel.spinning { animation: spin 1.5s linear infinite; }
.cassette-reel::before {
  content: ''; width: 8px; height: 8px;
  background: #c9a84c; border-radius: 50%;
}
@keyframes spin { to { transform: rotate(360deg); } }
.cassette-label {
  font-family: var(--font-hand);
  font-size: 11px;
  color: rgba(201,168,76,0.7);
  text-align: center;
  margin-bottom: 6px;
}
.cassette-controls {
  display: flex; align-items: center; gap: 8px;
}
.cassette-btn {
  background: transparent;
  border: 1px solid rgba(201,168,76,0.5);
  color: var(--gold);
  width: 28px; height: 28px;
  border-radius: 3px;
  cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  font-family: monospace;
}
.cassette-btn:hover { background: rgba(201,168,76,0.15); }
.cassette-progress {
  flex: 1; height: 3px;
  background: rgba(201,168,76,0.2);
  border-radius: 2px; cursor: pointer;
}
.cassette-progress-fill {
  height: 100%; background: var(--gold);
  border-radius: 2px; width: 0%;
  transition: width 0.3s;
}
.cassette-time {
  font-family: var(--font-hand);
  font-size: 10px; color: rgba(201,168,76,0.6);
}

/* Navigation arrows */
.nav-btn {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  background: rgba(44,26,14,0.8);
  border: 1.5px solid var(--gold);
  color: var(--gold);
  width: 36px; height: 60px;
  border-radius: 4px;
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  z-index: 10;
}
.nav-btn:hover { background: rgba(201,168,76,0.2); }
.nav-btn.left { left: -48px; }
.nav-btn.right { right: -48px; }

/* Toolbar (WYSIWYG) */
.toolbar {
  position: absolute;
  bottom: 8px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, var(--leather-dark), var(--leather-mid));
  border: 1.5px solid var(--gold);
  border-radius: 4px;
  padding: 6px 10px;
  display: flex; gap: 4px; align-items: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  z-index: 20;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
  white-space: nowrap;
}
.toolbar.visible { opacity: 1; pointer-events: all; }

.tool-btn {
  background: transparent;
  border: 1px solid rgba(201,168,76,0.3);
  color: var(--gold);
  width: 28px; height: 28px;
  border-radius: 2px;
  cursor: pointer;
  font-family: var(--font-serif);
  font-size: 12px;
  font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.tool-btn:hover { background: rgba(201,168,76,0.2); }
.tool-btn.active { background: var(--gold); color: var(--leather-dark); }

.tool-sep { width: 1px; height: 20px; background: rgba(201,168,76,0.3); margin: 0 2px; }

.tool-btn-text {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.5px;
  padding: 0 6px;
  width: auto;
}
.tool-btn-text.recording { animation: rec-pulse 1s ease-in-out infinite; }
@keyframes rec-pulse { 0%,100%{background:rgba(139,32,32,0.3);color:#ff6666} 50%{background:rgba(139,32,32,0.7);color:#fff} }

/* Save indicator */
.save-stamp {
  position: fixed;
  top: 20px; right: 20px;
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--red-accent);
  border: 2px solid var(--red-accent);
  padding: 4px 12px;
  border-radius: 3px;
  transform: rotate(-8deg);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 100;
}
.save-stamp.show { opacity: 0.85; }

/* Page nav back btn */
.btn-back {
  position: fixed;
  top: 14px; left: 14px;
  background: rgba(44,26,14,0.9);
  border: 1.5px solid var(--gold);
  color: var(--gold);
  font-family: var(--font-display);
  font-size: 11px; letter-spacing: 1px;
  padding: 6px 14px;
  border-radius: 3px;
  cursor: pointer;
  z-index: 50;
  display: none;
  transition: all 0.2s;
}
.btn-back:hover { background: rgba(201,168,76,0.15); }
.btn-back.show { display: block; }

.btn-new-note {
  position: fixed;
  top: 14px; right: 14px;
  background: rgba(44,26,14,0.9);
  border: 1.5px solid var(--gold);
  color: var(--gold);
  font-family: var(--font-display);
  font-size: 11px; letter-spacing: 1px;
  padding: 6px 14px;
  border-radius: 3px;
  cursor: pointer;
  z-index: 50;
  display: none;
  transition: all 0.2s;
}
.btn-new-note:hover { background: rgba(201,168,76,0.15); }
.btn-new-note.show { display: block; }

/* ═══════════════════════════════════════════════
   PAGE INDICATOR (dots)
═══════════════════════════════════════════════ */
.page-dots {
  position: fixed;
  bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; align-items: center;
  z-index: 20;
}
.page-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.page-dot.active { background: var(--gold); }

/* ═══════════════════════════════════════════════
   MOBILE RESPONSIVE
═══════════════════════════════════════════════ */
@media (max-width: 820px) {
  .page-spread { position: relative; }
  .page.left-page { display: none !important; }
  .page.right-page {
    width: min(380px, 92vw) !important;
    height: min(560px, 80vh) !important;
    border-radius: 6px !important;
    box-shadow: var(--shadow-paper) !important;
  }
  .nav-btn.left { left: -42px; }
  .nav-btn.right { right: -42px; }
}

/* ═══════════════════════════════════════════════
   LOADING OVERLAY
═══════════════════════════════════════════════ */
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(26,15,6,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.loading-overlay.show { opacity: 1; pointer-events: all; }
.loading-text {
  font-family: var(--font-display);
  font-size: 16px; letter-spacing: 3px;
  color: var(--gold);
  animation: breathe 1.5s ease-in-out infinite;
}

<script>
/* ════════════════════════════════════════════════
   CONFIG API
════════════════════════════════════════════════ */
window.API   = 'https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6';
window.R2    = 'https://lidan.co.id/api/upload_r2_lidan';
window.TABLE = 'agenda';
window.AUTH  = 'admin';

/* ════════════════════════════════════════════════
   STATE — semua pakai window.* agar global
════════════════════════════════════════════════ */
window.notes          = [];
window.currentNote    = null;
window.pages          = [''];
window.currentPageIdx = 0;
window.autoSaveTimer  = null;
window.mediaRecorder  = null;
window.audioChunks    = [];
window.recordingBlob  = null;
window.speechRec      = null;
window.isRecording    = false;
window.isSpeaking     = false;
window.isEditorActive = false;
window.isDesktop      = window.innerWidth > 820;

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('cover-year').textContent = '— ' + new Date().getFullYear() + ' —';
  setupSwipe();
  window.addEventListener('resize', () => {
    window.isDesktop = window.innerWidth > 820;
    if (document.getElementById('view-book').classList.contains('active')) {
      renderPages();
    }
  });
});

function setLoading(v) {
  document.getElementById('loading').classList.toggle('show', v);
}

/* ════════════════════════════════════════════════
   VIEW NAVIGATION
════════════════════════════════════════════════ */
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const inBook = id === 'view-book';
  const btnBack = document.getElementById('btn-back');
  const btnNew  = document.getElementById('btn-new-note-global');
  const dots    = document.getElementById('page-dots');
  if (btnBack) btnBack.classList.toggle('show', inBook);
  if (btnNew)  btnNew.classList.toggle('show', inBook);
  if (dots)    dots.style.display = inBook ? 'flex' : 'none';
}

function showCover() { showView('view-cover'); }

async function showIndex() {
  showView('view-index');
  await loadNotes();
}

function goBackToIndex() {
  deactivateEditor();
  stopRecord();
  stopVoice();
  showIndex();
}

/* ════════════════════════════════════════════════
   API — FETCH HELPERS
════════════════════════════════════════════════ */
async function apiGet(params = {}) {
  const url = new URL(API);
  url.searchParams.set('table', TABLE);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const r = await fetch(url, { headers: { 'X-Custom-Auth': AUTH } });
  return r.json();
}

async function apiPost(data) {
  const r = await fetch(API + '?table=' + TABLE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Custom-Auth': AUTH },
    body: JSON.stringify(data)
  });
  return r.json();
}

async function apiPut(id, data) {
  const r = await fetch(API + '?table=' + TABLE + '&id_x=' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Custom-Auth': AUTH },
    body: JSON.stringify(data)
  });
  return r.json();
}

async function apiDelete(id) {
  const r = await fetch(API + '?table=' + TABLE + '&id_x=' + id, {
    method: 'DELETE',
    headers: { 'X-Custom-Auth': AUTH }
  });
  return r.json();
}

async function uploadR2(blob, filename) {
  const fd = new FormData();
  fd.append('file', blob, filename);
  fd.append('customName', 'agenda-audio/' + filename);
  const r = await fetch(R2, {
    method: 'POST',
    headers: { 'X-Custom-Auth': AUTH },
    body: fd
  });
  const j = await r.json();
  /* URL dari upload_r2 pakai domain assets.lidan.co.id */
  return j.url || ('https://assets.lidan.co.id/' + j.key);
}

/* ════════════════════════════════════════════════
   NOTES CRUD
════════════════════════════════════════════════ */
async function loadNotes() {
  setLoading(true);
  try {
    const res = await apiGet({ limit: 200 });
    window.notes = (res.data || []).map(r => ({
      id:       r.id_x,
      title:    r.x_01 || 'Tanpa Judul',
      content:  r.x_02 || '',
      audioUrl: r.x_03 || '',
      date:     r.x_04 || '',
      type:     r.x_05 || 'text'
    }));
    renderIndex(window.notes);
  } catch(e) {
    console.error('loadNotes error:', e);
    renderIndexError();
  }
  setLoading(false);
}

function renderIndex(list) {
  const el  = document.getElementById('index-list');
  const cnt = document.getElementById('index-count');
  if (!list || !list.length) {
    el.innerHTML = '<div class="index-empty">Belum ada catatan.<br>Tekan "+ BARU" untuk mulai menulis.</div>';
    cnt.textContent = '0 catatan';
    return;
  }
  cnt.textContent = list.length + ' catatan';
  el.innerHTML = list.map((n, i) => `
    <div class="index-entry" onclick="openNote(${n.id})">
      <span class="entry-num">${String(i+1).padStart(2,'0')}</span>
      <span class="entry-title">${escHtml(n.title)}</span>
      <span class="entry-dots"></span>
      <span class="entry-type ${n.type}">${n.type === 'audio' ? 'AUDIO' : 'TEKS'}</span>
      <span class="entry-date">${formatDate(n.date)}</span>
    </div>
  `).join('');
}

function renderIndexError() {
  document.getElementById('index-list').innerHTML =
    '<div class="index-empty">Gagal memuat catatan.<br>Periksa koneksi & konfigurasi API.</div>';
}

function filterIndex() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = window.notes.filter(n =>
    n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)
  );
  renderIndex(filtered);
}

function sortIndex() {
  const s = document.getElementById('sort-select').value;
  let sorted = [...window.notes];
  if      (s === 'newest') sorted.sort((a,b) => b.id - a.id);
  else if (s === 'oldest') sorted.sort((a,b) => a.id - b.id);
  else if (s === 'az')     sorted.sort((a,b) => a.title.localeCompare(b.title));
  else if (s === 'za')     sorted.sort((a,b) => b.title.localeCompare(a.title));
  else if (s === 'audio')  sorted = sorted.filter(n => n.type === 'audio');
  else if (s === 'text')   sorted = sorted.filter(n => n.type === 'text');
  renderIndex(sorted);
}

async function openNote(id) {
  const note = window.notes.find(n => n.id === id);
  if (!note) return;
  window.currentNote = { ...note };
  showView('view-book');
  document.getElementById('note-title').value = note.title;
  document.getElementById('right-date').textContent = formatDate(note.date);
  document.getElementById('left-date').textContent  = formatDate(note.date);
  const oldCass = document.querySelector('.cassette-player');
  if (oldCass) oldCass.remove();
  const plainText = stripHtml(note.content);
  paginateText(plainText);
  renderPages();
  if (note.audioUrl) renderCassette(note.audioUrl);
}

function newNote() {
  window.currentNote    = { id: null, title: '', content: '', audioUrl: '', date: nowISO(), type: 'text' };
  window.pages          = [''];
  window.currentPageIdx = 0;
  showView('view-book');
  const titleEl = document.getElementById('note-title');
  const dateEl  = document.getElementById('right-date');
  const leftDate= document.getElementById('left-date');
  const editor  = document.getElementById('main-editor');
  if (titleEl)  titleEl.value = '';
  if (dateEl)   dateEl.textContent  = formatDate(nowISO());
  if (leftDate) leftDate.textContent = '';
  if (editor)   editor.innerHTML    = '';
  const oldCass = document.querySelector('.cassette-player');
  if (oldCass) oldCass.remove();
  renderPages();
  setTimeout(() => activateEditor(), 150);
}

async function saveNote() {
  const titleEl  = document.getElementById('note-title');
  const editorEl = document.getElementById('main-editor');
  if (!titleEl || !editorEl || !window.currentNote) return;
  const title   = titleEl.value.trim() || 'Tanpa Judul';
  const content = editorEl.innerHTML;
  const now     = nowISO();
  const data = {
    x_01: title,
    x_02: content,
    x_03: window.currentNote.audioUrl || '',
    x_04: now,
    x_05: window.currentNote.audioUrl ? 'audio' : 'text'
  };
  setLoading(true);
  try {
    let res;
    if (window.currentNote.id) {
      res = await apiPut(window.currentNote.id, data);
    } else {
      res = await apiPost(data);
      if (res.id_x) window.currentNote.id = res.id_x;
    }
    window.currentNote.title   = title;
    window.currentNote.content = content;
    window.currentNote.date    = now;
    showStamp();
  } catch(e) {
    console.error('saveNote error:', e);
    alert('Gagal menyimpan: ' + e.message);
  }
  setLoading(false);
}

function scheduleAutoSave() {
  clearTimeout(window.autoSaveTimer);
  window.autoSaveTimer = setTimeout(saveNote, 3000);
}

/* ════════════════════════════════════════════════
   PAGINATION — Auto-paging teks
════════════════════════════════════════════════ */
function paginateText(fullText) {
  const pageEl   = document.getElementById('right-page');
  const headerH  = 56;
  const pageH    = pageEl ? (pageEl.offsetHeight || 560) : 560;
  const usableH  = pageH - headerH - 20;
  const lh       = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--line-height')) || 32;
  const linesPerPage = Math.max(1, Math.floor(usableH / lh));
  const charsPerLine = 42;

  if (!fullText || !fullText.trim()) { window.pages = ['']; window.currentPageIdx = 0; return; }

  const words = fullText.split(/\s+/);
  window.pages = [];
  let currentPage = '';
  let lineCount   = 0;
  let currentLine = '';

  for (const word of words) {
    if ((currentLine + ' ' + word).trim().length > charsPerLine) {
      lineCount++;
      currentLine = word;
    } else {
      currentLine = (currentLine + ' ' + word).trim();
    }
    currentPage += (currentPage ? ' ' : '') + word;
    if (lineCount >= linesPerPage) {
      window.pages.push(currentPage.trim());
      currentPage = '';
      lineCount   = 0;
      currentLine = '';
    }
  }
  if (currentPage.trim() || window.pages.length === 0) window.pages.push(currentPage.trim());
  window.currentPageIdx = 0; /* buka dari halaman pertama */
}

function renderPages() {
  const mainEditor = document.getElementById('main-editor');
  const leftEditor = document.getElementById('left-editor');
  const rightNum   = document.getElementById('right-page-num');
  const leftNum    = document.getElementById('left-page-num');
  if (!mainEditor) return;

  const pg  = window.pages;
  const idx = window.currentPageIdx;

  if (!window.isEditorActive) mainEditor.innerHTML = pg[idx] || '';
  if (rightNum) rightNum.textContent = idx + 1;

  if (leftEditor) {
    if (window.isDesktop && idx > 0) {
      leftEditor.innerHTML       = pg[idx - 1] || '';
      leftEditor.style.color     = 'var(--ink)';
      leftEditor.style.fontStyle = 'normal';
      leftEditor.style.fontSize  = '17px';
      if (leftNum) leftNum.textContent = idx;
    } else {
      leftEditor.innerHTML       = '<em style="font-size:13px;color:var(--ink-muted);">≺ halaman pertama ≻</em>';
      leftEditor.style.color     = 'var(--ink-muted)';
      leftEditor.style.fontStyle = 'italic';
      if (leftNum) leftNum.textContent = '–';
    }
  }
  renderDots();
}

function renderDots() {
  const dots = document.getElementById('page-dots');
  if (!dots) return;
  if (window.pages.length <= 1) { dots.innerHTML = ''; return; }
  dots.innerHTML = window.pages.map((_, i) =>
    `<div class="page-dot ${i === window.currentPageIdx ? 'active' : ''}" onclick="goToPage(${i})"></div>`
  ).join('');
}

function goToPage(i) {
  window.currentPageIdx = Math.max(0, Math.min(window.pages.length - 1, i));
  renderPages();
}
function prevPage() { goToPage(window.currentPageIdx - 1); }
function nextPage() {
  if (window.currentPageIdx === window.pages.length - 1) {
    const txt = document.getElementById('main-editor').innerText;
    if (!window.pages[window.currentPageIdx]) window.pages[window.currentPageIdx] = txt;
    else if (txt !== window.pages[window.currentPageIdx]) {
      window.pages[window.currentPageIdx] = txt;
    }
  }
  goToPage(window.currentPageIdx + 1);
}

/* ════════════════════════════════════════════════
   EDITOR
════════════════════════════════════════════════ */
function activateEditor() {
  if (window.isEditorActive) return;
  window.isEditorActive = true;
  const ed = document.getElementById('main-editor');
  ed.contentEditable = 'true';
  ed.focus();
  /* Pindahkan kursor ke akhir */
  const range = document.createRange();
  const sel   = window.getSelection();
  range.selectNodeContents(ed);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
  document.getElementById('toolbar').classList.add('visible');
  ed.addEventListener('input', onEditorInput);
}

function deactivateEditor() {
  window.isEditorActive = false;
  const ed = document.getElementById('main-editor');
  if (ed) {
    ed.contentEditable = 'false';
    ed.removeEventListener('input', onEditorInput);
  }
  const tb = document.getElementById('toolbar');
  if (tb) tb.classList.remove('visible');
}

function onEditorInput() {
  const ed = document.getElementById('main-editor');
  if (ed.scrollHeight > ed.clientHeight + 4) {
    const txt    = ed.innerText;
    const words  = txt.trim().split(/\s+/);
    const overflow  = words.splice(Math.floor(words.length * 0.85)).join(' ');
    const thisPage  = words.join(' ');
    window.pages[window.currentPageIdx] = thisPage;
    ed.innerText = thisPage;
    /* Pindahkan kursor ke akhir setelah set innerText */
    const range = document.createRange();
    const sel   = window.getSelection();
    range.selectNodeContents(ed);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
    if (!window.pages[window.currentPageIdx + 1]) {
      window.pages.push(overflow);
    } else {
      window.pages[window.currentPageIdx + 1] = overflow + ' ' + window.pages[window.currentPageIdx + 1];
    }
    renderDots();
  }
  scheduleAutoSave();
}

function fmt(cmd) {
  if (cmd === 'h2') {
    document.execCommand('formatBlock', false, 'h3');
  } else if (cmd === 'quote') {
    document.execCommand('formatBlock', false, 'blockquote');
  } else {
    document.execCommand(cmd, false, null);
  }
  document.getElementById('main-editor').focus();
}

/* ════════════════════════════════════════════════
   VOICE TO TEXT (Speech Recognition)
════════════════════════════════════════════════ */
function toggleVoice() {
  if (window.isSpeaking) stopVoice();
  else startVoice();
}

function startVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('Browser tidak mendukung Speech Recognition.\nGunakan Chrome/Edge terbaru.');
    return;
  }
  window.speechRec = new SpeechRecognition();
  window.speechRec.lang = 'id-ID';
  window.speechRec.continuous = true;
  window.speechRec.interimResults = true;

  window.speechRec.onresult = (e) => {
    const ed = document.getElementById('main-editor');
    let finalText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
    }
    if (finalText) {
      ed.innerText = (ed.innerText || '') + finalText + ' ';
      onEditorInput();
    }
  };

  window.speechRec.onerror = () => { stopVoice(); };
  window.speechRec.onend = () => { if (window.isSpeaking) window.speechRec.start(); };

  window.speechRec.start();
  window.isSpeaking = true;
  activateEditor();
  const btn = document.getElementById('btn-voice');
  if (btn) { btn.textContent = '🎙 STOP'; btn.classList.add('recording'); }
}

function stopVoice() {
  if (window.speechRec) { try { window.speechRec.stop(); } catch(e){} window.speechRec = null; }
  window.isSpeaking = false;
  const btn = document.getElementById('btn-voice');
  if (btn) { btn.textContent = '🎙 STT'; btn.classList.remove('recording'); }
}

/* ════════════════════════════════════════════════
   AUDIO RECORDER (MediaRecorder → R2)
════════════════════════════════════════════════ */
function toggleRecord() {
  if (window.isRecording) stopRecord();
  else startRecord();
}

async function startRecord() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = handleRecordStop;
    mediaRecorder.start(200);
    isRecording = true;
    const btn = document.getElementById('btn-record');
    btn.textContent = '⏹ STOP';
    btn.classList.add('recording');
  } catch(e) {
    alert('Tidak dapat mengakses mikrofon: ' + e.message);
  }
}

function stopRecord() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  isRecording = false;
  const btn = document.getElementById('btn-record');
  if (btn) { btn.textContent = '⏺ REC'; btn.classList.remove('recording'); }
}

async function handleRecordStop() {
  recordingBlob = new Blob(audioChunks, { type: 'audio/webm' });
  const filename = 'rec-' + Date.now() + '.webm';
  setLoading(true);
  try {
    const url = await uploadR2(recordingBlob, filename);
    currentNote.audioUrl = url;
    renderCassette(url);
    await saveNote();
  } catch(e) {
    alert('Gagal mengunggah audio: ' + e.message);
  }
  setLoading(false);
}

/* ════════════════════════════════════════════════
   CASSETTE PLAYER RENDERER
════════════════════════════════════════════════ */
function renderCassette(url) {
  const content = document.getElementById('main-page-content');
  const existingCassette = content.querySelector('.cassette-player');
  if (existingCassette) existingCassette.remove();

  const id = 'audio-' + Date.now();
  const div = document.createElement('div');
  div.className = 'cassette-player';
  div.innerHTML = `
    <audio id="${id}" src="${escHtml(url)}" preload="metadata"></audio>
    <div class="cassette-label">♫ Rekaman Audio</div>
    <div class="cassette-reels">
      <div class="cassette-reel" id="reel-l-${id}"></div>
      <div class="cassette-reel" id="reel-r-${id}"></div>
    </div>
    <div class="cassette-controls">
      <button class="cassette-btn" id="play-btn-${id}" onclick="togglePlay('${id}')">▶</button>
      <div class="cassette-progress" onclick="seekAudio('${id}', event)">
        <div class="cassette-progress-fill" id="prog-${id}"></div>
      </div>
      <span class="cassette-time" id="time-${id}">0:00</span>
    </div>
  `;
  content.insertBefore(div, content.querySelector('.paper-editor'));

  const audio = document.getElementById(id);
  audio.addEventListener('timeupdate', () => updateCassetteProgress(id));
  audio.addEventListener('ended', () => {
    document.getElementById('play-btn-' + id).textContent = '▶';
    document.getElementById('reel-l-' + id).classList.remove('spinning');
    document.getElementById('reel-r-' + id).classList.remove('spinning');
  });
}

function togglePlay(id) {
  const audio = document.getElementById(id);
  const btn = document.getElementById('play-btn-' + id);
  const rl = document.getElementById('reel-l-' + id);
  const rr = document.getElementById('reel-r-' + id);
  if (audio.paused) {
    audio.play();
    btn.textContent = '⏸';
    rl.classList.add('spinning');
    rr.classList.add('spinning');
  } else {
    audio.pause();
    btn.textContent = '▶';
    rl.classList.remove('spinning');
    rr.classList.remove('spinning');
  }
}

function updateCassetteProgress(id) {
  const audio = document.getElementById(id);
  if (!audio || !audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  const prog = document.getElementById('prog-' + id);
  const timeEl = document.getElementById('time-' + id);
  if (prog) prog.style.width = pct + '%';
  if (timeEl) timeEl.textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
}

function seekAudio(id, e) {
  const audio = document.getElementById(id);
  const bar = e.currentTarget;
  const pct = e.offsetX / bar.offsetWidth;
  audio.currentTime = pct * audio.duration;
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

/* ════════════════════════════════════════════════
   SWIPE (Mobile)
════════════════════════════════════════════════ */
function setupSwipe() {
  let startX = 0;
  const el = document.getElementById('page-spread');
  el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) nextPage();
      else prevPage();
    }
  });
}

/* ════════════════════════════════════════════════
   UTILS
════════════════════════════════════════════════ */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stripHtml(html) {
  const d = document.createElement('div'); d.innerHTML = html; return d.innerText || '';
}
function nowISO() { return new Date().toISOString(); }
function formatDate(iso) {
  if (!iso) return '';
  try {
    return new Intl.DateTimeFormat('id-ID', { day:'numeric', month:'short', year:'numeric' }).format(new Date(iso));
  } catch(e) { return iso.slice(0,10); }
}
function showStamp() {
  const s = document.getElementById('save-stamp');
  s.classList.add('show');
  setTimeout(() => s.classList.remove('show'), 2000);
}
</script>
