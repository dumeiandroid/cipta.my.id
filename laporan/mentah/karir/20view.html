<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mau Tahu Minat Karier Kamu?</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="karir_engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #2980b9; --bg: #f0f2f5; --text-dark: #2c3e50; --text-light: #7f8c8d; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
            display: flex; justify-content: center; align-items: center;
        }
        .container { background: white; width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #2980b9, #3498db); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 30px; }

        .profile-section { background: var(--bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .profile-item { display: flex; align-items: center; gap: 10px; }
        .profile-item strong { color: var(--text-dark); font-size: 13px; }
        .profile-item span { color: var(--text-light); font-size: 14px; }

        .code-display { text-align: center; margin: 30px 0; padding: 30px; background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); border-radius: 15px; }
        .code-label { font-size: 14px; color: var(--text-light); margin-bottom: 10px; }
        .code-text { font-size: 48px; font-weight: bold; background: linear-gradient(135deg, #2980b9, #3498db); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 8px; }

        .chart-section { margin: 30px 0; }
        .chart-wrapper { max-width: 550px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        .result-card { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); padding: 30px; border-radius: 15px; border-left: 6px solid var(--primary); margin: 25px 0; }
        .result-card h2 { font-size: 26px; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .result-card .description { color: var(--text-dark); line-height: 1.8; font-size: 15px; margin-bottom: 20px; }

        .type-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 25px 0; }
        .type-card { background: white; padding: 25px; border-radius: 12px; border-top: 4px solid; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .type-card h3 { font-size: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .type-card .score { font-size: 14px; color: var(--text-light); margin-bottom: 12px; }
        .type-card .desc { font-size: 14px; color: var(--text-dark); line-height: 1.6; margin-bottom: 15px; }
        .type-card .careers { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .type-card .careers strong { font-size: 13px; color: var(--text-dark); display: block; margin-bottom: 8px; }
        .type-card .careers ul { list-style: none; padding: 0; }
        .type-card .careers li { padding: 5px 0 5px 20px; position: relative; font-size: 13px; color: var(--text-light); }
        .type-card .careers li:before { content: "•"; position: absolute; left: 5px; font-weight: bold; }

        .suggestions { background: #e8f5e9; border-left: 4px solid #4caf50; padding: 25px; border-radius: 12px; margin: 20px 0; }
        .suggestions h3 { color: #2e7d32; font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .suggestions ul { list-style: none; padding: 0; }
        .suggestions li { padding: 10px 0 10px 25px; position: relative; color: #2e7d32; line-height: 1.6; }
        .suggestions li:before { content: "💡"; position: absolute; left: 0; }

        .action-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, #2980b9, #3498db); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(41,128,185,0.4); }
        .btn-secondary { background: white; color: #2980b9; border: 2px solid #2980b9; }
        .btn-secondary:hover { background: #2980b9; color: white; }

        .loading, .error { text-align: center; padding: 50px; color: var(--text-light); }
        .error { color: #e74c3c; }
        @media print { body { background: white; } .action-buttons { display: none; } }
        @media (max-width: 768px) { .header h1 { font-size: 22px; } .code-text { font-size: 36px; letter-spacing: 4px; } .content { padding: 20px; } .type-cards { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading"><h2>⏳ Menganalisis profil karier Anda...</h2><p>Mohon tunggu sebentar</p></div>
</div>
<script>
    KarirEngine.load('20')
        .then(result => renderUI(result))
        .catch(err => showError(err.message));

    function showError(msg) {
        document.getElementById('app').innerHTML = `<div class="error"><h2>❌ Oops!</h2><p>${msg}</p></div>`;
    }

    function renderUI(r) {
        const { dataDiri, tanggal, categories, top3, careerCode, suggestions } = r;

        document.getElementById('app').innerHTML = `
            <div class="header">
                <h1>🎯 Mau Tahu Minat Karier Kamu?</h1>
                <p>Analisis Profil Karier Berdasarkan Teori RIASEC Holland</p>
            </div>
            <div class="content" id="downloadContent">
                <div class="profile-section">
                    <div class="profile-item"><strong>👤 Nama:</strong><span>${dataDiri.nama}</span></div>
                    <div class="profile-item"><strong>🎂 Usia:</strong><span>${dataDiri.usia} Tahun</span></div>
                    <div class="profile-item"><strong>🎓 Pendidikan:</strong><span>${dataDiri.pendidikan}</span></div>
                    <div class="profile-item"><strong>📅 Tanggal Tes:</strong><span>${tanggal}</span></div>
                </div>

                <div class="code-display">
                    <div class="code-label">Kode Karier Anda</div>
                    <div class="code-text">${careerCode}</div>
                </div>

                <div class="chart-section">
                    <div class="chart-wrapper"><canvas id="riasecChart"></canvas></div>
                </div>

                <div class="result-card">
                    <h2>🏆 Tipe Dominan: ${top3[0].name}</h2>
                    <div class="description">${top3[0].desc}</div>
                </div>

                <div class="type-cards">
                    ${top3.map((type, idx) => `
                        <div class="type-card" style="border-color: ${type.color}">
                            <h3 style="color: ${type.color}">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉'} ${type.name}</h3>
                            <div class="score">Skor: ${type.score}/18</div>
                            <div class="desc">${type.desc}</div>
                            <div class="careers">
                                <strong>💼 Contoh Karier:</strong>
                                <ul>${type.careers.map(c => `<li>${c}</li>`).join('')}</ul>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="suggestions">
                    <h3>💡 Saran Pengembangan Karier</h3>
                    <ul>${suggestions.map(s => `<li>${s.replace('kode RIASEC Anda', `kode ${careerCode} Anda`).replace('tipe dominan Anda', `tipe dominan Anda (${top3[0].name})`)}</li>`).join('')}</ul>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="downloadAsImage()">📥 Download Hasil (JPG)</button>
                    <button class="btn btn-secondary" onclick="window.print()">🖨️ Cetak Laporan</button>
                </div>
            </div>`;

        drawRadarChart(categories);
    }

    function drawRadarChart(categories) {
        const ctx = document.getElementById('riasecChart').getContext('2d');
        new Chart(ctx, {
            type: 'radar',
            data: {
                labels: categories.map(c => c.name),
                datasets: [{
                    label: 'Skor Minat',
                    data: categories.map(c => c.score),
                    backgroundColor: 'rgba(41, 128, 185, 0.2)',
                    borderColor: 'rgba(41, 128, 185, 1)',
                    borderWidth: 3,
                    pointBackgroundColor: categories.map(c => c.color),
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: categories.map(c => c.color),
                    pointRadius: 6, pointHoverRadius: 8, pointBorderWidth: 2
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: true,
                scales: { r: { beginAtZero: true, min: 0, max: 18, ticks: { stepSize: 3, font: { size: 12 } }, pointLabels: { font: { size: 14, weight: '600' } }, grid: { color: 'rgba(0,0,0,0.1)' } } },
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `Skor: ${ctx.parsed.r}/18` } } }
            }
        });
    }

    async function downloadAsImage() {
        const btn = event.target; btn.disabled = true; btn.textContent = '⏳ Memproses...';
        try {
            const canvas = await html2canvas(document.getElementById('downloadContent'), { scale: 2, backgroundColor: '#ffffff', logging: false });
            canvas.toBlob(blob => {
                const a = document.createElement('a');
                a.download = `Hasil-Tes-Karier-RIASEC-${new Date().toISOString().split('T')[0]}.jpg`;
                a.href = URL.createObjectURL(blob); a.click();
                btn.disabled = false; btn.innerHTML = '📥 Download Hasil (JPG)';
            }, 'image/jpeg', 0.95);
        } catch(e) { btn.disabled = false; btn.textContent = '❌ Gagal. Coba Lagi'; }
    }
</script>
</body>
</html>
