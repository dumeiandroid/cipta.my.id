<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saya Termasuk Pemimpin yang Seperti Apa?</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="karir_engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #f0f2f5; --text-dark: #2c3e50; --text-light: #7f8c8d; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh; padding: 20px;
            display: flex; justify-content: center; align-items: center;
        }
        .container { background: white; width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #e84393, #f5576c); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 26px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 30px; }

        .profile-section { background: var(--bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .profile-item { display: flex; align-items: center; gap: 10px; }
        .profile-item strong { color: var(--text-dark); font-size: 13px; }
        .profile-item span { color: var(--text-light); font-size: 14px; }

        .dominant-display { text-align: center; padding: 30px; background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 15px; margin: 25px 0; }
        .dominant-label { font-size: 14px; color: var(--text-light); margin-bottom: 12px; }
        .dominant-text { font-size: 42px; font-weight: bold; }

        .chart-section { margin: 30px 0; }
        .chart-wrapper { max-width: 550px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }

        .result-card { background: linear-gradient(135deg, #f8f9fa, #e9ecef); padding: 30px; border-radius: 15px; border-left: 6px solid; margin: 25px 0; }
        .result-card h2 { font-size: 24px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .result-card .description { color: var(--text-dark); line-height: 1.8; font-size: 15px; }
        .score-detail { font-size: 13px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }

        .style-details { margin: 25px 0; }
        .style-card { background: white; padding: 25px; border-radius: 12px; border-left: 4px solid; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .style-card h3 { font-size: 18px; margin-bottom: 10px; }
        .score-info { font-size: 13px; color: var(--text-light); margin-bottom: 15px; }
        .style-card ul { list-style: none; padding: 0; }
        .style-card li { padding: 8px 0 8px 25px; position: relative; color: var(--text-dark); font-size: 14px; border-bottom: 1px solid #f5f5f5; }
        .style-card li:before { content: "✓"; position: absolute; left: 5px; font-weight: bold; }

        .strengths-weaknesses { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 25px 0; }
        .sw-card { padding: 25px; border-radius: 12px; }
        .sw-card.strengths { background: #e8f5e9; border-left: 4px solid #4caf50; }
        .sw-card.weaknesses { background: #fff3e0; border-left: 4px solid #ff9800; }
        .sw-card h3 { font-size: 16px; margin-bottom: 12px; }
        .sw-card.strengths h3 { color: #2e7d32; }
        .sw-card.weaknesses h3 { color: #e65100; }
        .sw-card ul { list-style: none; padding: 0; }
        .sw-card li { padding: 7px 0 7px 20px; position: relative; font-size: 13px; line-height: 1.5; }
        .sw-card.strengths li { color: #2e7d32; }
        .sw-card.weaknesses li { color: #e65100; }
        .sw-card.strengths li:before { content: "✅"; position: absolute; left: 0; font-size: 11px; }
        .sw-card.weaknesses li:before { content: "⚠️"; position: absolute; left: 0; font-size: 11px; }

        .suggestions { background: #e3f2fd; border-left: 4px solid #2196f3; padding: 25px; border-radius: 12px; margin: 20px 0; }
        .suggestions h3 { color: #0d47a1; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .suggestions ul { list-style: none; padding: 0; }
        .suggestions li { padding: 8px 0 8px 25px; position: relative; color: #0d47a1; font-size: 14px; line-height: 1.6; }
        .suggestions li:before { content: "💡"; position: absolute; left: 0; }

        .note-box { background: #fff8e1; border: 1px solid #ffc107; padding: 20px; border-radius: 10px; margin: 20px 0; }
        .note-box p { font-size: 14px; color: #6d4c41; line-height: 1.7; }

        .action-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, #e84393, #f5576c); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(232,67,147,0.4); }
        .btn-secondary { background: white; color: #e84393; border: 2px solid #e84393; }
        .btn-secondary:hover { background: #e84393; color: white; }

        .loading, .error { text-align: center; padding: 50px; color: var(--text-light); }
        .error { color: #e74c3c; }
        @media print { body { background: white; } .action-buttons { display: none; } }
        @media (max-width: 768px) { .header h1 { font-size: 20px; } .content { padding: 20px; } .strengths-weaknesses { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading"><h2>⏳ Menganalisis gaya kepemimpinan Anda...</h2><p>Mohon tunggu sebentar</p></div>
</div>
<script>
    const SUGGESTIONS_22 = {
        'demo': [
            'Pertahankan inklusivitas dalam pengambilan keputusan, tetapi tetapkan batasan waktu untuk menghindari analysis paralysis',
            'Kembangkan skill fasilitasi untuk mengelola diskusi tim yang produktif',
            'Latih kemampuan untuk membuat keputusan cepat saat situasi mendesak',
            'Pastikan ada follow-through yang jelas setelah keputusan dibuat bersama',
            'Bangun sistem feedback yang konstruktif untuk terus meningkatkan proses kolaborasi'
        ],
        'oto': [
            'Praktikkan mendengarkan aktif - beri kesempatan tim untuk berbicara',
            'Mulai delegasi tugas-tugas tertentu untuk mengembangkan tim',
            'Coba libatkan tim dalam keputusan yang tidak kritis untuk membangun kepercayaan',
            'Kembangkan empati dan emotional intelligence untuk memahami kebutuhan tim',
            'Balance antara kontrol dan memberi ruang untuk pertumbuhan tim'
        ],
        'lais': [
            'Tetapkan ekspektasi dan guidelines yang jelas meski memberikan kebebasan',
            'Lakukan check-in rutin untuk memastikan tim tidak kehilangan arah',
            'Berikan feedback lebih sering, jangan hanya saat ada masalah',
            'Kenali kapan tim membutuhkan arahan lebih dari Anda',
            'Bangun struktur minimal untuk mencegah chaos sambil tetap memberi kebebasan'
        ],
        'pat': [
            'Dorong kemandirian tim dengan memberikan tantangan yang terukur',
            'Pisahkan hubungan personal dan profesional dalam pengambilan keputusan',
            'Praktikkan empowerment - biarkan tim membuat keputusan sendiri kadang-kadang',
            'Fokus pada pengembangan jangka panjang, bukan hanya proteksi jangka pendek',
            'Terima bahwa tim perlu belajar dari kesalahan mereka sendiri'
        ]
    };

    KarirEngine.load('22')
        .then(result => renderUI(result))
        .catch(err => showError(err.message));

    function showError(msg) {
        document.getElementById('app').innerHTML = `<div class="error"><h2>❌ Oops!</h2><p>${msg}</p></div>`;
    }

    function renderUI(r) {
        const { dataDiri, tanggal, styles, dominan } = r;
        const scores = styles.map(s => s.score);
        const suggestions = SUGGESTIONS_22[dominan.id] || [];

        document.getElementById('app').innerHTML = `
            <div class="header">
                <h1>🎭 Saya Termasuk Pemimpin yang Seperti Apa?</h1>
                <p>Analisis Gaya Kepemimpinan Berdasarkan 4 Tipe Utama</p>
            </div>
            <div class="content" id="downloadContent">
                <div class="profile-section">
                    <div class="profile-item"><strong>👤 Nama:</strong><span>${dataDiri.nama}</span></div>
                    <div class="profile-item"><strong>🎂 Usia:</strong><span>${dataDiri.usia} Tahun</span></div>
                    <div class="profile-item"><strong>💼 Jabatan:</strong><span>${dataDiri.jabatan || '-'}</span></div>
                    <div class="profile-item"><strong>📅 Tanggal Tes:</strong><span>${tanggal}</span></div>
                </div>

                <div class="dominant-display">
                    <div class="dominant-label">Gaya Kepemimpinan Dominan Anda</div>
                    <div class="dominant-text" style="color: ${dominan.color}">${dominan.icon} ${dominan.name}</div>
                </div>

                <div class="chart-section">
                    <div class="chart-wrapper"><canvas id="styleChart"></canvas></div>
                </div>

                <div class="result-card" style="border-color: ${dominan.color}">
                    <h2 style="color: ${dominan.color}">${dominan.icon} Tipe Kepemimpinan: ${dominan.name}</h2>
                    <div class="description">${dominan.desc}</div>
                    <div class="score-detail" style="color: ${dominan.color}">
                        <strong>Rincian Skor:</strong>
                        ${styles.map(s => `${s.name}: ${s.score}/7`).join(' | ')}
                    </div>
                </div>

                <div class="style-details">
                    <div class="style-card" style="border-color: ${dominan.color}">
                        <h3 style="color: ${dominan.color}">📋 Karakteristik Utama</h3>
                        <div class="score-info">Skor Anda: ${dominan.score}/7</div>
                        <ul>${dominan.characteristics.map(c => `<li>${c}</li>`).join('')}</ul>
                    </div>
                </div>

                <div class="strengths-weaknesses">
                    <div class="sw-card strengths">
                        <h3>💪 Kekuatan Gaya Ini</h3>
                        <ul>${dominan.strengths.map(s => `<li>${s}</li>`).join('')}</ul>
                    </div>
                    <div class="sw-card weaknesses">
                        <h3>⚠️ Kelemahan yang Perlu Diwaspadai</h3>
                        <ul>${dominan.weaknesses.map(w => `<li>${w}</li>`).join('')}</ul>
                    </div>
                </div>

                <div class="suggestions">
                    <h3>💡 Saran Pengembangan Kepemimpinan</h3>
                    <ul>${suggestions.map(s => `<li>${s}</li>`).join('')}</ul>
                </div>

                <div class="note-box">
                    <p><strong>Catatan Penting:</strong> Tidak ada gaya kepemimpinan yang mutlak benar atau salah. Efektivitas kepemimpinan sangat bergantung pada situasi, konteks organisasi, dan karakteristik tim yang Anda pimpin. Pemimpin terbaik adalah yang adaptif - mampu menyesuaikan gaya kepemimpinan sesuai kebutuhan. Pertimbangkan untuk mengembangkan fleksibilitas dalam gaya kepemimpinan Anda.</p>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="downloadAsImage()">📥 Download Hasil (JPG)</button>
                    <button class="btn btn-secondary" onclick="window.print()">🖨️ Cetak Laporan</button>
                </div>
            </div>`;

        drawChart(styles);
    }

    function drawChart(styles) {
        const ctx = document.getElementById('styleChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: styles.map(s => s.name),
                datasets: [{ label: 'Skor', data: styles.map(s => s.score), backgroundColor: styles.map(s => s.color), borderRadius: 8, barThickness: 60 }]
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: true,
                scales: { x: { beginAtZero: true, max: 7, ticks: { stepSize: 1 }, grid: { display: false } }, y: { grid: { display: false } } },
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `Skor: ${ctx.parsed.x}/7` } } }
            }
        });
    }

    async function downloadAsImage() {
        const btn = event.target; btn.disabled = true; btn.textContent = '⏳ Memproses...';
        try {
            const canvas = await html2canvas(document.getElementById('downloadContent'), { scale: 2, backgroundColor: '#ffffff', logging: false });
            canvas.toBlob(blob => {
                const a = document.createElement('a');
                a.download = `Hasil-Gaya-Kepemimpinan-${new Date().toISOString().split('T')[0]}.jpg`;
                a.href = URL.createObjectURL(blob); a.click();
                btn.disabled = false; btn.innerHTML = '📥 Download Hasil (JPG)';
            }, 'image/jpeg', 0.95);
        } catch(e) { btn.disabled = false; btn.textContent = '❌ Gagal. Coba Lagi'; }
    }
</script>
</body>
</html>
