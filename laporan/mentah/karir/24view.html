<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Manajemen Waktu</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="karir_engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #f0f2f5; --text-dark: #2c3e50; --text-light: #7f8c8d; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh; padding: 20px;
            display: flex; justify-content: center; align-items: center;
        }
        .container { background: white; width: 100%; max-width: 850px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #2980b9, #16a085); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 30px; }

        .profile-section { background: var(--bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .profile-item { display: flex; align-items: center; gap: 10px; }
        .profile-item strong { color: var(--text-dark); font-size: 13px; }
        .profile-item span { color: var(--text-light); font-size: 14px; }

        .score-display { text-align: center; margin: 30px 0; padding: 30px; background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 15px; }
        .score-number { font-size: 56px; font-weight: bold; }
        .score-label { color: var(--text-light); font-size: 14px; margin-top: 5px; }

        .chart-section { margin: 30px 0; }
        .chart-wrapper { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }

        .result-card { background: linear-gradient(135deg, #f8f9fa, #e9ecef); padding: 30px; border-radius: 15px; border-left: 6px solid; margin: 25px 0; }
        .result-card h2 { font-size: 24px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .result-card .description { color: var(--text-dark); line-height: 1.8; font-size: 15px; }

        .warning-box { background: #fff3cd; border: 1px solid #ffc107; padding: 20px; border-radius: 10px; margin: 20px 0; }
        .warning-box h4 { color: #856404; margin-bottom: 8px; font-size: 15px; }
        .warning-box p { color: #856404; font-size: 14px; line-height: 1.6; }

        .time-management-tips { margin-top: 25px; padding-top: 20px; border-top: 2px solid #eee; }
        .time-management-tips h3 { color: var(--text-dark); font-size: 16px; margin-bottom: 15px; }
        .tips-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
        .tip-card { display: flex; align-items: flex-start; gap: 10px; padding: 14px; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); border-left: 3px solid; }
        .tip-icon { font-size: 22px; flex-shrink: 0; }
        .tip-text { font-size: 13px; color: var(--text-dark); line-height: 1.5; }

        .suggestions { background: #e8f5e9; border-left: 4px solid #4caf50; padding: 25px; border-radius: 12px; margin: 20px 0; }
        .suggestions h3 { color: #2e7d32; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .suggestions ul { list-style: none; padding: 0; }
        .suggestions li { padding: 8px 0 8px 25px; position: relative; color: #2e7d32; font-size: 14px; line-height: 1.6; }
        .suggestions li:before { content: "💡"; position: absolute; left: 0; }

        .action-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, #2980b9, #16a085); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(41,128,185,0.4); }
        .btn-secondary { background: white; color: #2980b9; border: 2px solid #2980b9; }
        .btn-secondary:hover { background: #2980b9; color: white; }

        .loading, .error { text-align: center; padding: 50px; color: var(--text-light); }
        .error { color: #e74c3c; }
        @media print { body { background: white; } .action-buttons { display: none; } }
        @media (max-width: 768px) { .header h1 { font-size: 22px; } .content { padding: 20px; } .tips-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading"><h2>⏳ Menganalisis manajemen waktu Anda...</h2><p>Mohon tunggu sebentar</p></div>
</div>
<script>
    KarirEngine.load('24')
        .then(result => renderUI(result))
        .catch(err => showError(err.message));

    function showError(msg) {
        document.getElementById('app').innerHTML = `<div class="error"><h2>❌ Oops!</h2><p>${msg}</p></div>`;
    }

    function renderUI(r) {
        const { dataDiri, tanggal, skor, maxSkor, result } = r;

        document.getElementById('app').innerHTML = `
            <div class="header">
                <h1>⏰ Profil Manajemen Waktu</h1>
                <p>Evaluasi Kemampuan Mengelola dan Menggunakan Waktu Secara Efektif</p>
            </div>
            <div class="content" id="downloadContent">
                <div class="profile-section">
                    <div class="profile-item"><strong>👤 Nama:</strong><span>${dataDiri.nama}</span></div>
                    <div class="profile-item"><strong>🎂 Usia:</strong><span>${dataDiri.usia} Tahun</span></div>
                    <div class="profile-item"><strong>🎓 Pendidikan:</strong><span>${dataDiri.pendidikan}</span></div>
                    <div class="profile-item"><strong>📅 Tanggal Tes:</strong><span>${tanggal}</span></div>
                </div>

                <div class="score-display">
                    <div class="score-number" style="color: ${result.color}">${skor}</div>
                    <div class="score-label">dari ${maxSkor} poin maksimal</div>
                </div>

                <div class="chart-section">
                    <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
                </div>

                <div class="result-card" style="border-color: ${result.color}">
                    <h2 style="color: ${result.color}">${result.icon} ${result.title}</h2>
                    <div class="description">${result.description}</div>

                    ${result.warning ? `
                        <div class="warning-box">
                            <h4>⚠️ Perhatian</h4>
                            <p>${result.warning}</p>
                        </div>` : ''}

                    <div class="time-management-tips">
                        <h3>⏱️ Aspek Manajemen Waktu</h3>
                        <div class="tips-grid">
                            ${result.aspects.map(a => `
                                <div class="tip-card" style="border-color: ${result.color}">
                                    <span class="tip-icon">${a.icon}</span>
                                    <span class="tip-text">${a.text}</span>
                                </div>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="suggestions">
                    <h3>💡 Rekomendasi Peningkatan</h3>
                    <ul>${result.suggestions.map(s => `<li>${s}</li>`).join('')}</ul>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="downloadAsImage()">📥 Download Hasil (JPG)</button>
                    <button class="btn btn-secondary" onclick="window.print()">🖨️ Cetak Laporan</button>
                </div>
            </div>`;

        drawChart(skor, maxSkor, result.color);
    }

    function drawChart(skor, maxSkor, color) {
        const ctx = document.getElementById('barChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Skor Anda'],
                datasets: [{ label: 'Skor Manajemen Waktu', data: [skor], backgroundColor: color, borderRadius: 10, barThickness: 60 }]
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: true,
                scales: {
                    x: { beginAtZero: true, max: maxSkor, ticks: { stepSize: 5 }, grid: { color: 'rgba(0,0,0,0.1)' } },
                    y: { display: false }
                },
                plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `Skor: ${ctx.parsed.x}/${maxSkor}` } } }
            }
        });
    }

    async function downloadAsImage() {
        const btn = event.target; btn.disabled = true; btn.textContent = '⏳ Memproses...';
        try {
            const canvas = await html2canvas(document.getElementById('downloadContent'), { scale: 2, backgroundColor: '#ffffff', logging: false });
            canvas.toBlob(blob => {
                const a = document.createElement('a');
                a.download = `Hasil-Manajemen-Waktu-${new Date().toISOString().split('T')[0]}.jpg`;
                a.href = URL.createObjectURL(blob); a.click();
                btn.disabled = false; btn.innerHTML = '📥 Download Hasil (JPG)';
            }, 'image/jpeg', 0.95);
        } catch(e) { btn.disabled = false; btn.textContent = '❌ Gagal. Coba Lagi'; }
    }
</script>
</body>
</html>
