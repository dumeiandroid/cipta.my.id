<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivasi Kepemimpinan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="karir_engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #f0f2f5; --text-dark: #2c3e50; --text-light: #7f8c8d; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            min-height: 100vh; padding: 20px;
            display: flex; justify-content: center; align-items: center;
        }
        .container { background: white; width: 100%; max-width: 850px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 30px; }

        .profile-section { background: var(--bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .profile-item { display: flex; align-items: center; gap: 10px; }
        .profile-item strong { color: var(--text-dark); font-size: 13px; }
        .profile-item span { color: var(--text-light); font-size: 14px; }

        .score-display { text-align: center; margin: 30px 0; padding: 30px; background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 15px; }
        .score-number { font-size: 56px; font-weight: bold; }
        .score-label { color: var(--text-light); font-size: 14px; margin-top: 5px; }
        .score-bar { height: 12px; background: #eee; border-radius: 6px; margin-top: 15px; overflow: hidden; }
        .score-bar-fill { height: 100%; border-radius: 6px; transition: width 1s ease; }

        .chart-section { margin: 30px 0; }
        .chart-wrapper { max-width: 350px; margin: 0 auto; position: relative; }
        .chart-center-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -20%); text-align: center; }
        .big-number { font-size: 40px; font-weight: bold; }
        .small-text { font-size: 14px; color: var(--text-light); }

        .result-card { background: linear-gradient(135deg, #f8f9fa, #e9ecef); padding: 30px; border-radius: 15px; border-left: 6px solid; margin: 25px 0; }
        .result-card h2 { font-size: 24px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .result-card .description { color: var(--text-dark); line-height: 1.8; font-size: 15px; }

        .factors-section { margin-top: 25px; padding-top: 20px; border-top: 2px solid #eee; }
        .factors-section h3 { font-size: 16px; color: var(--text-dark); margin-bottom: 15px; }
        .factors-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
        .factor-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .factor-icon { font-size: 20px; flex-shrink: 0; }
        .factor-text { font-size: 13px; color: var(--text-dark); line-height: 1.5; }

        .suggestions { background: #fff8e1; border-left: 4px solid #ffc107; padding: 25px; border-radius: 12px; margin: 20px 0; }
        .suggestions h3 { color: #e65100; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .suggestions ul { list-style: none; padding: 0; }
        .suggestions li { padding: 8px 0 8px 25px; position: relative; color: var(--text-dark); font-size: 14px; line-height: 1.6; }
        .suggestions li:before { content: "💡"; position: absolute; left: 0; }

        .action-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(243,156,18,0.4); }
        .btn-secondary { background: white; color: #f39c12; border: 2px solid #f39c12; }
        .btn-secondary:hover { background: #f39c12; color: white; }

        .loading, .error { text-align: center; padding: 50px; color: var(--text-light); }
        .error { color: #e74c3c; }
        @media print { body { background: white; } .action-buttons { display: none; } }
        @media (max-width: 768px) { .header h1 { font-size: 22px; } .content { padding: 20px; } .factors-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="loading"><h2>⏳ Menganalisis motivasi kepemimpinan Anda...</h2><p>Mohon tunggu sebentar</p></div>
</div>
<script>
    KarirEngine.load('23')
        .then(result => renderUI(result))
        .catch(err => showError(err.message));

    function showError(msg) {
        document.getElementById('app').innerHTML = `<div class="error"><h2>❌ Oops!</h2><p>${msg}</p></div>`;
    }

    function renderUI(r) {
        const { dataDiri, tanggal, skor, maxSkor, percentage, result } = r;

        document.getElementById('app').innerHTML = `
            <div class="header">
                <h1>🔥 Motivasi Kepemimpinan</h1>
                <p>Mengukur Keinginan dan Dorongan untuk Memimpin</p>
            </div>
            <div class="content" id="downloadContent">
                <div class="profile-section">
                    <div class="profile-item"><strong>👤 Nama:</strong><span>${dataDiri.nama}</span></div>
                    <div class="profile-item"><strong>🎂 Usia:</strong><span>${dataDiri.usia} Tahun</span></div>
                    <div class="profile-item"><strong>🎓 Pendidikan:</strong><span>${dataDiri.pendidikan}</span></div>
                    <div class="profile-item"><strong>📅 Tanggal Tes:</strong><span>${tanggal}</span></div>
                </div>

                <div class="score-display">
                    <div class="score-number" style="color: ${result.color}">${skor}</div>
                    <div class="score-label">dari ${maxSkor} poin (${percentage}%)</div>
                    <div class="score-bar">
                        <div class="score-bar-fill" style="width: ${percentage}%; background: ${result.color}"></div>
                    </div>
                </div>

                <div class="chart-section">
                    <div class="chart-wrapper">
                        <canvas id="gaugeChart"></canvas>
                        <div class="chart-center-text">
                            <div class="big-number" style="color: ${result.color}">${skor}</div>
                            <div class="small-text">dari ${maxSkor}</div>
                        </div>
                    </div>
                </div>

                <div class="result-card" style="border-color: ${result.color}">
                    <h2 style="color: ${result.color}">${result.icon} ${result.title}</h2>
                    <div class="description">${result.description}</div>
                    <div class="factors-section">
                        <h3>🔍 Faktor-Faktor yang Teridentifikasi</h3>
                        <div class="factors-grid">
                            ${result.factors.map(f => `
                                <div class="factor-item">
                                    <span class="factor-icon">${f.icon}</span>
                                    <span class="factor-text">${f.text}</span>
                                </div>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="suggestions">
                    <h3>💡 Saran Pengembangan</h3>
                    <ul>${result.suggestions.map(s => `<li>${s}</li>`).join('')}</ul>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="downloadAsImage()">📥 Download Hasil (JPG)</button>
                    <button class="btn btn-secondary" onclick="window.print()">🖨️ Cetak Laporan</button>
                </div>
            </div>`;

        drawGauge(skor, maxSkor, result.color);
    }

    function drawGauge(skor, maxSkor, color) {
        const ctx = document.getElementById('gaugeChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: { datasets: [{ data: [skor, maxSkor - skor], backgroundColor: [color, '#eee'], borderWidth: 0, circumference: 180, rotation: 270, cutout: '85%' }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false }, tooltip: { enabled: false } } }
        });
    }

    async function downloadAsImage() {
        const btn = event.target; btn.disabled = true; btn.textContent = '⏳ Memproses...';
        try {
            const canvas = await html2canvas(document.getElementById('downloadContent'), { scale: 2, backgroundColor: '#ffffff', logging: false });
            canvas.toBlob(blob => {
                const a = document.createElement('a');
                a.download = `Hasil-Motivasi-Kepemimpinan-${new Date().toISOString().split('T')[0]}.jpg`;
                a.href = URL.createObjectURL(blob); a.click();
                btn.disabled = false; btn.innerHTML = '📥 Download Hasil (JPG)';
            }, 'image/jpeg', 0.95);
        } catch(e) { btn.disabled = false; btn.textContent = '❌ Gagal. Coba Lagi'; }
    }
</script>
</body>
</html>
