<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Tes Tipe Cinta</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="asmara_engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .header { background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); color: white; padding: 40px; text-align: center; }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .content { padding: 40px; }
        .profile-section { background: #f8f9fa; padding: 25px; border-radius: 15px; margin-bottom: 30px; border-left: 5px solid #ff6b9d; }
        .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .profile-item { display: flex; flex-direction: column; }
        .profile-label { font-size: 0.85em; color: #ff6b9d; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .profile-value { font-size: 1.1em; color: #2c3e50; }
        .result-card { background: linear-gradient(135deg, #fff5f8 0%, #ffe9f0 100%); padding: 30px; border-radius: 15px; margin: 30px 0; border-left: 8px solid; }
        .result-card h2 { font-size: 2.5em; margin-bottom: 15px; }
        .chart-container { position: relative; height: 320px; margin: 30px 0; }
        .score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin: 30px 0; }
        .score-card { background: white; padding: 20px; border-radius: 12px; border: 3px solid; text-align: center; transition: transform 0.3s; }
        .score-card.dominant { transform: scale(1.07); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .score-icon { font-size: 2.5em; margin-bottom: 8px; }
        .score-name { font-size: 1.1em; font-weight: bold; margin-bottom: 8px; }
        .score-value { font-size: 1.8em; font-weight: bold; margin: 8px 0; }
        .info-section { background: white; padding: 25px; border-radius: 15px; margin: 20px 0; border: 2px solid #e9ecef; }
        .info-section h3 { color: #2c3e50; margin-bottom: 15px; font-size: 1.3em; }
        .info-section ul { list-style: none; }
        .info-section li { padding: 10px 0 10px 30px; position: relative; line-height: 1.6; color: #555; }
        .info-section li:before { content: "✓"; position: absolute; left: 0; color: #ff6b9d; font-weight: bold; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        button { padding: 15px 30px; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-download { background: #ff6b9d; color: white; }
        .btn-print { background: #2c3e50; color: white; }
        .error-msg, .loading { text-align: center; padding: 60px 40px; }
        .error-msg { color: #e74c3c; }
        @media print { body { background: white; } .button-group { display: none; } .container { box-shadow: none; } }
        @media (max-width: 600px) { .header h1 { font-size: 1.5em; } .button-group { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container" id="mainContainer">
    <div class="loading"><div style="font-size:3em;margin-bottom:20px">⏳</div><h3>Memuat Hasil Analisis...</h3></div>
</div>
<script>
AsmaraEngine.load('12').then(r => {
    const { dataDiri, tanggal, config, scores, dominant, persen, typeInfo } = r;
    const total = config.totalSoal;
    const types = config.types;
    const keys = config.opsi;

    document.getElementById('mainContainer').innerHTML = `
        <div class="header">
            <h1>💖 Hasil Tes Tipe Cinta</h1>
            <p>Bagaimana Anda Mengekspresikan dan Menerima Cinta?</p>
        </div>
        <div class="content">
            <div class="profile-section">
                <h3 style="color:#2c3e50;margin-bottom:15px">📋 Informasi Peserta</h3>
                <div class="profile-grid">
                    <div class="profile-item"><span class="profile-label">Nama Lengkap</span><span class="profile-value">${dataDiri.nama||'-'}</span></div>
                    <div class="profile-item"><span class="profile-label">Usia</span><span class="profile-value">${dataDiri.usia||'-'} Tahun</span></div>
                    <div class="profile-item"><span class="profile-label">Pendidikan</span><span class="profile-value">${dataDiri.pendidikan||'-'}</span></div>
                    <div class="profile-item"><span class="profile-label">Tanggal Tes</span><span class="profile-value">${tanggal}</span></div>
                </div>
            </div>
            <div class="result-card" style="border-color:${typeInfo.color}">
                <h2 style="color:${typeInfo.color}">${typeInfo.icon} TIPE ${typeInfo.name}</h2>
                <p style="font-size:1.1em;color:#555">${typeInfo.description}</p>
            </div>
            <div class="score-grid">
                ${keys.map(k=>`
                <div class="score-card ${dominant===k?'dominant':''}" style="border-color:${types[k].color}">
                    <div class="score-icon">${types[k].icon}</div>
                    <div class="score-name" style="color:${types[k].color}">${types[k].name}</div>
                    <div class="score-value" style="color:${types[k].color}">${scores[k]}/${total}</div>
                    <div style="color:#666">${persen[k]}%</div>
                </div>`).join('')}
            </div>
            <div class="chart-container"><canvas id="myChart"></canvas></div>
            <div class="info-section">
                <h3>💝 Karakteristik Tipe Cinta Anda</h3>
                <ul>${typeInfo.characteristics.map(c=>`<li>${c}</li>`).join('')}</ul>
            </div>
            <div class="info-section">
                <h3>💪 Kekuatan Anda dalam Hubungan</h3>
                <ul>${typeInfo.strengths.map(c=>`<li>${c}</li>`).join('')}</ul>
            </div>
            <div class="info-section">
                <h3>💑 Pasangan yang Cocok untuk Anda</h3>
                <ul>${typeInfo.ideal_partner.map(c=>`<li>${c}</li>`).join('')}</ul>
            </div>
            <div class="info-section">
                <h3>💡 Tips untuk Hubungan yang Lebih Baik</h3>
                <ul>${typeInfo.tips.map(c=>`<li>${c}</li>`).join('')}</ul>
            </div>
            <div class="button-group">
                <button class="btn-download" onclick="downloadAsImage()">📥 Download JPG</button>
                <button class="btn-print" onclick="window.print()">🖨️ Cetak PDF</button>
            </div>
        </div>`;

    const ctx = document.getElementById('myChart').getContext('2d');
    new Chart(ctx, {
        type: 'radar',
        data: {
            labels: keys.map(k=>types[k].name),
            datasets: [{ label:'Skor Tipe Cinta', data: keys.map(k=>scores[k]),
                backgroundColor:'rgba(255,107,157,0.2)', borderColor:'#ff6b9d', borderWidth:3,
                pointBackgroundColor: keys.map(k=>types[k].color), pointBorderColor:'#fff', pointRadius:6 }]
        },
        options: { responsive:true, maintainAspectRatio:false,
            scales:{ r:{ beginAtZero:true, max:10, ticks:{ stepSize:2 } } },
            plugins:{ legend:{ display:false } } }
    });
}).catch(err => {
    document.getElementById('mainContainer').innerHTML = `<div class="error-msg" style="padding:60px"><h2>❌ Error</h2><p>${err.message}</p></div>`;
});

async function downloadAsImage() {
    const btn = event.target; btn.disabled=true; btn.textContent='⏳ Memproses...';
    try {
        const canvas = await html2canvas(document.getElementById('mainContainer'), { scale:2, backgroundColor:'#ffffff', logging:false });
        const link = document.createElement('a'); link.download=`Hasil-Tipe-Cinta-${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg',0.95); link.click();
        btn.disabled=false; btn.textContent='✅ Berhasil!'; setTimeout(()=>{ btn.textContent='📥 Download JPG'; },2000);
    } catch(e){ btn.disabled=false; btn.textContent='❌ Gagal'; setTimeout(()=>{ btn.textContent='📥 Download JPG'; },2000); }
}
</script>
</body>
</html>
