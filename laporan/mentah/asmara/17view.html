<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apakah Kamu Sahabat yang Baik?</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="asmara_engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --sahabat: #6c5ce7; --dekat: #00cec9; --biasa: #fab1a0; --bg: #f9f9fb; --text-dark: #2c3e50; --text-light: #7f8c8d; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { background: white; width: 100%; max-width: 800px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, var(--sahabat), #a29bfe); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content { padding: 30px; }
        .profile-section { background: var(--bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .profile-item { display: flex; align-items: center; gap: 10px; }
        .profile-item strong { color: var(--text-dark); font-size: 13px; }
        .profile-item span { color: var(--text-light); font-size: 14px; }
        .score-display { text-align: center; margin: 20px 0; }
        .score-number { font-size: 48px; font-weight: bold; background: linear-gradient(135deg, var(--sahabat), #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .score-label { color: var(--text-light); font-size: 14px; margin-top: 5px; }
        .chart-section { margin: 30px 0; text-align: center; }
        .chart-wrapper { max-width: 400px; margin: 0 auto 30px; }
        .result-card { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); padding: 30px; border-radius: 15px; border-left: 6px solid; margin: 25px 0; }
        .result-card h2 { font-size: 24px; margin-bottom: 15px; }
        .result-card .description { color: var(--text-dark); line-height: 1.8; margin-bottom: 20px; font-size: 15px; }
        .dimension-scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin: 20px 0; }
        .dimension-item { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .dimension-item .dim-label { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
        .dimension-item .dim-score { font-size: 22px; font-weight: bold; color: var(--sahabat); }
        .dimension-item .dim-max { font-size: 13px; color: var(--text-light); }
        .characteristics { background: white; padding: 20px; border-radius: 10px; margin: 20px 0; }
        .characteristics h3 { color: var(--text-dark); font-size: 18px; margin-bottom: 15px; }
        .characteristics ul { list-style: none; padding: 0; }
        .characteristics li { padding: 10px 0 10px 25px; position: relative; color: var(--text-dark); line-height: 1.6; }
        .characteristics li:before { content: "✓"; position: absolute; left: 0; color: var(--sahabat); font-weight: bold; }
        .suggestions { background: #fff3cd; border-left: 4px solid #ffc107; padding: 20px; border-radius: 10px; margin: 20px 0; }
        .suggestions h3 { color: #856404; font-size: 18px; margin-bottom: 15px; }
        .suggestions ul { list-style: none; padding: 0; }
        .suggestions li { padding: 8px 0 8px 25px; position: relative; color: #856404; line-height: 1.6; }
        .suggestions li:before { content: "→"; position: absolute; left: 0; font-weight: bold; }
        .action-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: linear-gradient(135deg, var(--sahabat), #a29bfe); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(108,92,231,0.4); }
        .btn-secondary { background: white; color: var(--sahabat); border: 2px solid var(--sahabat); }
        .btn-secondary:hover { background: var(--sahabat); color: white; }
        .loading { text-align: center; padding: 50px; color: var(--text-light); }
        .error { text-align: center; padding: 50px; color: #e74c3c; }
        @media print { body { background: white; } .action-buttons { display: none; } }
        @media (max-width: 768px) { .header h1 { font-size: 22px; } .content { padding: 20px; } }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading"><h2>⏳ Menganalisis profil persahabatan Anda...</h2><p>Mohon tunggu sebentar</p></div>
    </div>
    <script>
AsmaraEngine.load('17').then(r => {
    const { dataDiri, tanggal, total, typeInfo, skorList, config } = r;
    const maxSkor = config.maxSkor;
    const dimLabels = config.dimensionLabels;

    document.getElementById('app').innerHTML = `
        <div class="header">
            <h1>🤝 Apakah Kamu Sahabat yang Baik?</h1>
            <p>Analisis Kualitas Persahabatan Berdasarkan 10 Dimensi</p>
        </div>
        <div class="content" id="downloadContent">
            <div class="profile-section">
                <div class="profile-item"><strong>👤 Nama:</strong><span>${dataDiri.nama||'-'}</span></div>
                <div class="profile-item"><strong>🎂 Usia:</strong><span>${dataDiri.usia||'-'} Tahun</span></div>
                <div class="profile-item"><strong>🎓 Pendidikan:</strong><span>${dataDiri.pendidikan||'-'}</span></div>
                <div class="profile-item"><strong>📅 Tanggal Tes:</strong><span>${tanggal}</span></div>
            </div>
            <div class="score-display">
                <div class="score-number">${total}</div>
                <div class="score-label">dari ${maxSkor} poin maksimal</div>
            </div>
            <div class="chart-section">
                <div class="chart-wrapper"><canvas id="radarChart"></canvas></div>
            </div>
            <div class="dimension-scores">
                ${skorList.map((s,i)=>`
                <div class="dimension-item">
                    <div class="dim-label">${dimLabels[i]}</div>
                    <div class="dim-score">${s}<span class="dim-max">/3</span></div>
                </div>`).join('')}
            </div>
            <div class="result-card" style="border-color:${typeInfo.color}">
                <h2 style="color:${typeInfo.color}">${typeInfo.icon} ${typeInfo.title}</h2>
                <div class="description">${typeInfo.description}</div>
                <div class="characteristics">
                    <h3>💫 Karakteristik Anda</h3>
                    <ul>${typeInfo.characteristics.map(c=>`<li>${c}</li>`).join('')}</ul>
                </div>
                <div class="suggestions">
                    <h3>💡 Saran Pengembangan</h3>
                    <ul>${typeInfo.suggestions.map(s=>`<li>${s}</li>`).join('')}</ul>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="downloadAsImage()">📥 Download Hasil (JPG)</button>
                <button class="btn btn-secondary" onclick="window.print()">🖨️ Cetak Laporan</button>
            </div>
        </div>`;

    const ctx = document.getElementById('radarChart').getContext('2d');
    new Chart(ctx, {
        type: 'radar',
        data: {
            labels: dimLabels,
            datasets: [{ label:'Skor Anda', data: skorList,
                backgroundColor:'rgba(108,92,231,0.2)', borderColor:'rgba(108,92,231,1)', borderWidth:3,
                pointBackgroundColor:'rgba(108,92,231,1)', pointBorderColor:'#fff', pointRadius:5 }]
        },
        options: {
            responsive: true, maintainAspectRatio: true,
            scales: { r: { beginAtZero:true, min:0, max:3, ticks:{ stepSize:1 }, pointLabels:{ font:{ size:13, weight:'600' } } } },
            plugins: { legend:{ display:false } }
        }
    });
}).catch(err => {
    document.getElementById('app').innerHTML = `<div class="error"><h2>❌ Oops!</h2><p>${err.message}</p></div>`;
});

async function downloadAsImage() {
    const btn = event.target; btn.disabled=true; btn.textContent='⏳ Memproses...';
    try {
        const content = document.getElementById('downloadContent');
        const canvas = await html2canvas(content, { scale:2, backgroundColor:'#ffffff', logging:false,
            windowWidth: content.scrollWidth, windowHeight: content.scrollHeight });
        canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = `Hasil-Tes-Sahabat-${new Date().toISOString().split('T')[0]}.jpg`;
            link.href = url; link.click(); URL.revokeObjectURL(url);
            btn.disabled=false; btn.textContent='✅ Berhasil!';
            setTimeout(()=>{ btn.innerHTML='📥 Download Hasil (JPG)'; },3000);
        }, 'image/jpeg', 0.95);
    } catch(e) {
        btn.disabled=false; btn.textContent='❌ Gagal. Coba Lagi';
        setTimeout(()=>{ btn.innerHTML='📥 Download Hasil (JPG)'; },3000);
    }
}
    </script>
</body>
</html>
