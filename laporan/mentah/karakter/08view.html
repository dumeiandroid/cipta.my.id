<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Tes Judging vs Perceiving</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="karakter_engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p  { opacity: 0.9; font-size: 1.1em; }
        .content { padding: 40px; }

        /* Profile */
        .profile-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .profile-item { display: flex; flex-direction: column; }
        .profile-label { font-size: 0.85em; color: #667eea; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .profile-value { font-size: 1.1em; color: #2c3e50; }

        /* Result card */
        .result-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 40px;
            border-radius: 15px;
            margin: 30px 0;
            border-left: 8px solid;
            text-align: center;
        }
        .result-card h2 { font-size: 3em; margin-bottom: 15px; }
        .result-tagline { font-size: 1.4em; font-weight: bold; margin-bottom: 10px; }

        /* Spectrum */
        .spectrum {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }
        .spectrum-side { flex: 1; text-align: center; }
        .spectrum-icon { font-size: 4em; margin-bottom: 10px; }
        .spectrum-name { font-size: 1.5em; font-weight: bold; margin-bottom: 5px; }
        .spectrum-score { font-size: 2.5em; font-weight: bold; margin: 10px 0; }
        .spectrum-bar { flex: 2; position: relative; }
        .bar-container {
            height: 40px;
            background: linear-gradient(to right, #27ae60, #e67e22);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        .bar-label {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-weight: bold; font-size: 0.9em;
        }
        .bar-marker { position: absolute; top: -30px; transform: translateX(-50%); font-size: 2em; }
        .bar-legend { display: flex; justify-content: space-between; margin-top: 10px; color: #666; font-size: 0.9em; }

        /* Chart */
        .chart-container { position: relative; height: 300px; margin: 30px 0; }

        /* Info sections */
        .info-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid #e9ecef;
        }
        .info-section h3 { color: #2c3e50; margin-bottom: 15px; font-size: 1.3em; display: flex; align-items: center; gap: 10px; }
        .info-section ul { list-style: none; padding-left: 0; }
        .info-section li { padding: 10px 0; padding-left: 30px; position: relative; line-height: 1.6; color: #555; }
        .info-section li:before { content: "✓"; position: absolute; left: 0; color: #667eea; font-weight: bold; font-size: 1.2em; }

        /* Comparison table */
        .comparison-table { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .table-column { background: #f8f9fa; padding: 20px; border-radius: 10px; }
        .table-column h4 { text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 3px solid; font-size: 1.2em; }
        .table-column ul { list-style: none; padding: 0; }
        .table-column li { padding: 8px 0; padding-left: 25px; position: relative; color: #444; }
        .table-column li:before { content: "•"; position: absolute; left: 5px; font-size: 1.5em; }

        /* Buttons */
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        button { padding: 15px 30px; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-download { background: #667eea; color: white; }
        .btn-download:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-print { background: #2c3e50; color: white; }
        .btn-print:hover { background: #1a252f; transform: translateY(-2px); }

        /* States */
        .error-msg { text-align: center; padding: 60px 40px; color: #e74c3c; }
        .loading    { text-align: center; padding: 60px 40px; color: #7f8c8d; }

        @media print {
            body { background: white; padding: 0; }
            .button-group { display: none; }
            .container { box-shadow: none; }
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.5em; }
            .result-card h2 { font-size: 2em; }
            .button-group { grid-template-columns: 1fr; }
            .comparison-table { grid-template-columns: 1fr; }
            .spectrum { flex-direction: column; }
            .content { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="loading">
        <div style="font-size:3em;margin-bottom:20px">⏳</div>
        <h3>Memuat Hasil Tes...</h3>
    </div>
</div>

<script>
KarakterEngine.load('08').then(result => {
    const { dataDiri, dominan, config, skor, persen, total, markerPosition } = result;

    document.getElementById('mainContainer').innerHTML = `
        <div class="header">
            <h1>🎯 Hasil Tes Gaya Hidup</h1>
            <p>Saya Termasuk Tipe Penilai atau Pengamat?</p>
        </div>
        <div class="content">

            <div class="profile-section">
                <h3 style="color:#2c3e50;margin-bottom:15px">📋 Informasi Peserta</h3>
                <div class="profile-grid">
                    <div class="profile-item"><span class="profile-label">Nama Lengkap</span><span class="profile-value">${dataDiri.nama || '-'}</span></div>
                    <div class="profile-item"><span class="profile-label">Usia</span><span class="profile-value">${dataDiri.usia || '-'} Tahun</span></div>
                    <div class="profile-item"><span class="profile-label">Pendidikan</span><span class="profile-value">${dataDiri.pendidikan || '-'}</span></div>
                    <div class="profile-item"><span class="profile-label">Tanggal Tes</span><span class="profile-value">${dataDiri.tgl_tes || '-'}</span></div>
                </div>
            </div>

            <div class="result-card" style="border-color:${config.color}">
                <h2 style="color:${config.color}">${config.icon} ${config.name}</h2>
                <div class="result-tagline" style="color:${config.color}">${config.tagline}</div>
                <p style="font-size:1.1em;color:#555">${config.description}</p>
            </div>

            <div class="spectrum">
                <div class="spectrum-side">
                    <div class="spectrum-icon">📋</div>
                    <div class="spectrum-name" style="color:#27ae60">Judging</div>
                    <div class="spectrum-score" style="color:#27ae60">${persen.A}%</div>
                    <div style="color:#666">${skor.A}/${total}</div>
                </div>
                <div class="spectrum-bar">
                    <div class="bar-marker" style="left:${markerPosition}%">👤</div>
                    <div class="bar-container"><div class="bar-label">Spektrum Gaya Hidup</div></div>
                    <div class="bar-legend">
                        <span>Terstruktur</span><span>Seimbang</span><span>Fleksibel</span>
                    </div>
                </div>
                <div class="spectrum-side">
                    <div class="spectrum-icon">🎈</div>
                    <div class="spectrum-name" style="color:#e67e22">Perceiving</div>
                    <div class="spectrum-score" style="color:#e67e22">${persen.B}%</div>
                    <div style="color:#666">${skor.B}/${total}</div>
                </div>
            </div>

            <div class="chart-container"><canvas id="myChart"></canvas></div>

            <div class="info-section">
                <h3>🎯 Karakteristik Anda</h3>
                <ul>${config.characteristics.map(c => `<li>${c}</li>`).join('')}</ul>
            </div>

            <div class="info-section">
                <h3>💪 Kekuatan Anda</h3>
                <ul>${config.strengths.map(s => `<li>${s}</li>`).join('')}</ul>
            </div>

            <div class="info-section">
                <h3>⚠️ Area Pengembangan</h3>
                <ul>${config.weaknesses.map(w => `<li>${w}</li>`).join('')}</ul>
            </div>

            <div class="info-section">
                <h3>💼 Karir yang Cocok</h3>
                <p style="color:#555;line-height:1.8;font-size:1.1em">${config.careers.join(' • ')}</p>
            </div>

            <div class="info-section">
                <h3>💡 Saran Pengembangan Diri</h3>
                <ul>${config.tips.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>

            <div class="info-section">
                <h3>⚖️ Perbandingan Judging vs Perceiving</h3>
                <div class="comparison-table">
                    <div class="table-column">
                        <h4 style="color:#27ae60;border-color:#27ae60">📋 Judging</h4>
                        <ul>
                            <li style="color:#27ae60">Terencana</li>
                            <li style="color:#27ae60">Terorganisir</li>
                            <li style="color:#27ae60">Keputusan Cepat</li>
                            <li style="color:#27ae60">Suka Closure</li>
                            <li style="color:#27ae60">Disiplin</li>
                            <li style="color:#27ae60">Goal-oriented</li>
                        </ul>
                    </div>
                    <div class="table-column">
                        <h4 style="color:#e67e22;border-color:#e67e22">🎈 Perceiving</h4>
                        <ul>
                            <li style="color:#e67e22">Fleksibel</li>
                            <li style="color:#e67e22">Spontan</li>
                            <li style="color:#e67e22">Pilihan Terbuka</li>
                            <li style="color:#e67e22">Eksplorasi</li>
                            <li style="color:#e67e22">Adaptif</li>
                            <li style="color:#e67e22">Process-oriented</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="info-section" style="background:#fff3cd;border-color:#ffc107">
                <h3 style="color:#856404">📚 Dalam Konteks MBTI</h3>
                <p style="color:#856404;line-height:1.8">
                    Dimensi Judging-Perceiving adalah dimensi ke-4 dalam Myers-Briggs Type Indicator (MBTI).
                    Dimensi ini menggambarkan bagaimana Anda berinteraksi dengan dunia luar dan mengatur hidup Anda.
                    Judging lebih suka keputusan dan struktur, sedangkan Perceiving lebih suka fleksibilitas dan spontanitas.
                </p>
            </div>

            <div class="button-group">
                <button class="btn-download" onclick="downloadAsImage()">📥 Download JPG</button>
                <button class="btn-print"    onclick="window.print()">🖨️ Cetak PDF</button>
            </div>
        </div>
    `;

    /* --- Bar chart --- */
    new Chart(document.getElementById('myChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: ['Judging','Perceiving'],
            datasets: [{
                label: 'Skor',
                data: [skor.A, skor.B],
                backgroundColor: ['rgba(39,174,96,0.7)','rgba(230,126,34,0.7)'],
                borderColor: ['#27ae60','#e67e22'],
                borderWidth: 3
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => `Skor: ${ctx.parsed.y}/${total} (${ctx.dataIndex === 0 ? persen.A : persen.B}%)`
                    }
                }
            },
            scales: { y: { beginAtZero: true, max: total, ticks: { stepSize: 2 } } }
        }
    });

}).catch(err => {
    document.getElementById('mainContainer').innerHTML = `
        <div class="error-msg">
            <div style="font-size:3em;margin-bottom:20px">❌</div>
            <h2>${err.error || 'Terjadi kesalahan.'}</h2>
        </div>`;
});

async function downloadAsImage() {
    const btn = event.target;
    btn.disabled = true; btn.textContent = '⏳ Memproses...';
    try {
        const canvas = await html2canvas(document.getElementById('mainContainer'), { scale:2, backgroundColor:'#ffffff', logging:false });
        const link = document.createElement('a');
        link.download = `Hasil-Judging-Perceiving-${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
        btn.disabled = false; btn.textContent = '✅ Berhasil!';
        setTimeout(() => btn.textContent = '📥 Download JPG', 2000);
    } catch {
        btn.disabled = false; btn.textContent = '❌ Gagal';
        setTimeout(() => btn.textContent = '📥 Download JPG', 2000);
    }
}
</script>
</body>
</html>
