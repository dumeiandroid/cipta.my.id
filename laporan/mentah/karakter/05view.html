<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Tes Ekstrovert vs Introvert</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="karakter_engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        .content { padding: 40px; }

        /* Profile */
        .profile-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .profile-item { display: flex; flex-direction: column; }
        .profile-label {
            font-size: 0.85em;
            color: #667eea;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .profile-value { font-size: 1.1em; color: #2c3e50; }

        /* Result card */
        .result-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 40px;
            border-radius: 15px;
            margin: 30px 0;
            border-left: 8px solid;
            text-align: center;
        }
        .result-card h2 { font-size: 3em; margin-bottom: 15px; }
        .result-tagline { font-size: 1.4em; font-weight: bold; margin-bottom: 10px; }

        /* Spectrum */
        .spectrum {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }
        .spectrum-side { flex: 1; text-align: center; }
        .spectrum-icon { font-size: 4em; margin-bottom: 10px; }
        .spectrum-name { font-size: 1.5em; font-weight: bold; margin-bottom: 5px; }
        .spectrum-score { font-size: 2.5em; font-weight: bold; margin: 10px 0; }
        .spectrum-bar { flex: 2; position: relative; }
        .bar-container {
            height: 40px;
            background: linear-gradient(to right, #e74c3c, #34495e);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        .bar-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }
        .bar-marker {
            position: absolute;
            top: -30px;
            transform: translateX(-50%);
            font-size: 2em;
        }
        .bar-legend {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #666;
            font-size: 0.9em;
        }

        /* Chart */
        .chart-container { position: relative; height: 300px; margin: 30px 0; }

        /* Info sections */
        .info-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid #e9ecef;
        }
        .info-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info-section ul { list-style: none; padding-left: 0; }
        .info-section li {
            padding: 10px 0;
            padding-left: 30px;
            position: relative;
            line-height: 1.6;
            color: #555;
        }
        .info-section li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }

        /* Comparison table */
        .comparison-table { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .table-column { background: #f8f9fa; padding: 20px; border-radius: 10px; }
        .table-column h4 { text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 3px solid; font-size: 1.2em; }
        .table-column ul { list-style: none; padding: 0; }
        .table-column li { padding: 8px 0; padding-left: 25px; position: relative; color: #444; }
        .table-column li:before { content: "•"; position: absolute; left: 5px; font-size: 1.5em; }

        /* Myth box */
        .myth-buster {
            background: linear-gradient(135deg, #fff3cd 0%, #fff9e6 100%);
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            border-left: 5px solid #ffc107;
        }
        .myth-buster h3 { color: #856404; margin-bottom: 15px; }
        .myth-buster p { color: #856404; line-height: 1.8; }

        /* Buttons */
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        button { padding: 15px 30px; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-download { background: #667eea; color: white; }
        .btn-download:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-print { background: #2c3e50; color: white; }
        .btn-print:hover { background: #1a252f; transform: translateY(-2px); }

        /* States */
        .error-msg { text-align: center; padding: 60px 40px; color: #e74c3c; }
        .loading    { text-align: center; padding: 60px 40px; color: #7f8c8d; }

        @media print {
            body { background: white; padding: 0; }
            .button-group { display: none; }
            .container { box-shadow: none; }
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.5em; }
            .result-card h2 { font-size: 2em; }
            .button-group { grid-template-columns: 1fr; }
            .comparison-table { grid-template-columns: 1fr; }
            .spectrum { flex-direction: column; }
            .content { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="loading">
        <div style="font-size:3em;margin-bottom:20px">⏳</div>
        <h3>Memuat Hasil Tes Kepribadian...</h3>
    </div>
</div>

<script>
KarakterEngine.load('05').then(result => {
    const { dataDiri, dominan, config, skor, persen, total, markerPosition } = result;

    document.getElementById('mainContainer').innerHTML = `
        <div class="header">
            <h1>🎭 Hasil Tes Kepribadian</h1>
            <p>Saya Termasuk Ekstrovert atau Introvert?</p>
        </div>
        <div class="content">

            <div class="profile-section">
                <h3 style="color:#2c3e50;margin-bottom:15px">📋 Informasi Peserta</h3>
                <div class="profile-grid">
                    <div class="profile-item"><span class="profile-label">Nama Lengkap</span><span class="profile-value">${dataDiri.nama || '-'}</span></div>
                    <div class="profile-item"><span class="profile-label">Usia</span><span class="profile-value">${dataDiri.usia || '-'} Tahun</span></div>
                    <div class="profile-item"><span class="profile-label">Pendidikan</span><span class="profile-value">${dataDiri.pendidikan || '-'}</span></div>
                    <div class="profile-item"><span class="profile-label">Tanggal Tes</span><span class="profile-value">${dataDiri.tgl_tes || '-'}</span></div>
                </div>
            </div>

            <div class="result-card" style="border-color:${config.color}">
                <h2 style="color:${config.color}">${config.icon} ${config.name}</h2>
                <div class="result-tagline" style="color:${config.color}">${config.tagline}</div>
                <p style="font-size:1.1em;color:#555">${config.description}</p>
            </div>

            <div class="spectrum">
                <div class="spectrum-side">
                    <div class="spectrum-icon">🎉</div>
                    <div class="spectrum-name" style="color:#e74c3c">Ekstrovert</div>
                    <div class="spectrum-score" style="color:#e74c3c">${persen.A}%</div>
                    <div style="color:#666">${skor.A}/${total}</div>
                </div>
                <div class="spectrum-bar">
                    <div class="bar-marker" style="left:${markerPosition}%">👤</div>
                    <div class="bar-container">
                        <div class="bar-label">Spektrum Kepribadian</div>
                    </div>
                    <div class="bar-legend">
                        <span>Ekstrovert</span><span>Seimbang</span><span>Introvert</span>
                    </div>
                </div>
                <div class="spectrum-side">
                    <div class="spectrum-icon">📚</div>
                    <div class="spectrum-name" style="color:#34495e">Introvert</div>
                    <div class="spectrum-score" style="color:#34495e">${persen.B}%</div>
                    <div style="color:#666">${skor.B}/${total}</div>
                </div>
            </div>

            <div class="chart-container"><canvas id="myChart"></canvas></div>

            <div class="info-section">
                <h3>🎯 Karakteristik Anda</h3>
                <ul>${config.characteristics.map(c => `<li>${c}</li>`).join('')}</ul>
            </div>

            <div class="info-section">
                <h3>💪 Kekuatan Anda</h3>
                <ul>${config.strengths.map(s => `<li>${s}</li>`).join('')}</ul>
            </div>

            <div class="info-section">
                <h3>💼 Karir yang Cocok</h3>
                <p style="color:#555;line-height:1.8;font-size:1.1em">${config.careers.join(' • ')}</p>
            </div>

            <div class="info-section">
                <h3>💡 Saran Pengembangan Diri</h3>
                <ul>${config.tips.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>

            <div class="myth-buster">
                <h3>🔍 Mitos yang Perlu Diluruskan</h3>
                <p><strong>Mitos:</strong> "Introvert itu pemalu dan ekstrovert selalu percaya diri."</p>
                <p><strong>Fakta:</strong> Introvert vs Ekstrovert adalah tentang sumber energi, bukan tentang rasa percaya diri atau kemampuan sosial. Introvert bisa sangat percaya diri dan pandai berbicara di depan umum, begitu juga ekstrovert bisa mengalami kecemasan sosial.</p>
                <br>
                <p><strong>Mitos:</strong> "Ekstrovert lebih sukses daripada introvert."</p>
                <p><strong>Fakta:</strong> Kesuksesan tidak ditentukan oleh tipe kepribadian. Baik introvert maupun ekstrovert memiliki kekuatan unik yang dapat mengarah pada kesuksesan di bidang masing-masing.</p>
            </div>

            <div class="info-section">
                <h3>⚖️ Perbandingan Ekstrovert vs Introvert</h3>
                <div class="comparison-table">
                    <div class="table-column">
                        <h4 style="color:#e74c3c;border-color:#e74c3c">🎉 Ekstrovert</h4>
                        <ul>
                            <li style="color:#e74c3c">Energi dari luar</li>
                            <li style="color:#e74c3c">Think out loud</li>
                            <li style="color:#e74c3c">Banyak teman</li>
                            <li style="color:#e74c3c">Suka keramaian</li>
                            <li style="color:#e74c3c">Ekspresif</li>
                            <li style="color:#e74c3c">Action-oriented</li>
                        </ul>
                    </div>
                    <div class="table-column">
                        <h4 style="color:#34495e;border-color:#34495e">📚 Introvert</h4>
                        <ul>
                            <li style="color:#34495e">Energi dari dalam</li>
                            <li style="color:#34495e">Think before speak</li>
                            <li style="color:#34495e">Teman dekat</li>
                            <li style="color:#34495e">Suka ketenangan</li>
                            <li style="color:#34495e">Reflektif</li>
                            <li style="color:#34495e">Thought-oriented</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-download" onclick="downloadAsImage()">📥 Download JPG</button>
                <button class="btn-print"    onclick="window.print()">🖨️ Cetak PDF</button>
            </div>
        </div>
    `;

    /* --- Bar chart --- */
    new Chart(document.getElementById('myChart').getContext('2d'), {
        type: 'bar',
        data: {
            labels: ['Ekstrovert','Introvert'],
            datasets: [{
                label: 'Skor',
                data: [skor.A, skor.B],
                backgroundColor: ['rgba(231,76,60,0.7)','rgba(52,73,94,0.7)'],
                borderColor: ['#e74c3c','#34495e'],
                borderWidth: 3
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => `Skor: ${ctx.parsed.y}/${total} (${Math.round(ctx.parsed.y/total*100)}%)` } }
            },
            scales: { y: { beginAtZero: true, max: total, ticks: { stepSize: 2 } } }
        }
    });

}).catch(err => {
    document.getElementById('mainContainer').innerHTML = `
        <div class="error-msg">
            <div style="font-size:3em;margin-bottom:20px">❌</div>
            <h2>${err.error || 'Terjadi kesalahan.'}</h2>
        </div>`;
});

async function downloadAsImage() {
    const btn = event.target;
    btn.disabled = true; btn.textContent = '⏳ Memproses...';
    try {
        const canvas = await html2canvas(document.getElementById('mainContainer'), { scale:2, backgroundColor:'#ffffff', logging:false });
        const link = document.createElement('a');
        link.download = `Hasil-Ekstrovert-Introvert-${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
        btn.disabled = false; btn.textContent = '✅ Berhasil!';
        setTimeout(() => btn.textContent = '📥 Download JPG', 2000);
    } catch {
        btn.disabled = false; btn.textContent = '❌ Gagal';
        setTimeout(() => btn.textContent = '📥 Download JPG', 2000);
    }
}
</script>
</body>
</html>
