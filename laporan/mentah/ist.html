<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lembar Jawaban I.S.T.</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Times New Roman', Times, serif;
    background: #e8e8e4;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 16px;
  }

  /* ── SEARCH PANEL ── */
  .search-panel {
    width: 750px;
    background: #fff;
    border: 2px solid #1a6ab5;
    border-radius: 10px;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    box-shadow: 0 2px 12px rgba(26,106,181,0.10);
    font-family: 'Segoe UI', sans-serif;
  }
  .search-panel label { font-weight: 700; font-size: 13px; white-space: nowrap; color: #0d2a4a; }
  .search-panel input {
    flex: 1; min-width: 160px;
    padding: 9px 13px;
    border: 2px solid #b0c8e8; border-radius: 8px;
    font-size: 14px; font-family: inherit; color: #0d2a4a;
    outline: none; background: #f5f8fc; transition: border 0.2s;
  }
  .search-panel input:focus { border-color: #1a6ab5; background: #fff; }
  .btn {
    padding: 9px 22px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: #1a6ab5; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #1354a0; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-reset { background: #e2e8f0; color: #475569; }
  .btn-reset:hover { background: #cbd5e1; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-box {
    width: 750px;
    background: #fef2f2; border: 1.5px solid #fca5a5;
    border-radius: 8px; padding: 10px 16px;
    color: #dc2626; font-size: 13px; font-weight: 600;
    font-family: 'Segoe UI', sans-serif; display: none;
  }
  .err-box.show { display: block; }

  /* ── PAGE ── */
  .page {
    background: #fff;
    width: 750px;
    padding: 28px 32px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.15);
    border: 1px solid #bbb;
  }

  .page-title {
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }

  /* ── HEADER FIELDS ── */
  .header-area { display: flex; gap: 16px; margin-bottom: 14px; }
  .fields { flex: 1; font-size: 10.5px; }
  .field-row { display: flex; align-items: flex-end; margin-bottom: 4px; gap: 4px; }
  .field-row label { width: 130px; flex-shrink: 0; font-size: 10.5px; }
  .field-row .dots {
    flex: 1; border-bottom: 1px dotted #555; height: 14px;
    font-size: 10px; color: #555;
  }
  .field-row .suffix { white-space: nowrap; font-size: 10.5px; margin-left: 4px; }
  .field-filled {
    flex: 1; border-bottom: 1px dotted #555; height: 14px;
    font-size: 10.5px; font-weight: bold; color: #111;
    display: inline-flex; align-items: flex-end;
  }

  /* ── SCORE TABLE ── */
  .score-table { flex-shrink: 0; border-collapse: collapse; font-size: 10px; height: fit-content; }
  .score-table th, .score-table td {
    border: 1px solid #333; text-align: center;
    padding: 2px 6px; min-width: 28px; height: 18px;
  }
  .score-table th { font-weight: bold; background: #fff; }
  .score-table td.row-label { text-align: left; padding-left: 4px; font-weight: bold; }

  /* ── GRAPH ── */
  .graph-section { margin-bottom: 10px; }
  .graph-container { display: flex; gap: 4px; align-items: stretch; }
  .y-axis-left {
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 9px; text-align: right;
    padding-right: 3px; padding-top: 18px; padding-bottom: 2px;
  }
  .y-axis-right {
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 9px; text-align: left;
    padding-left: 3px; padding-top: 18px; padding-bottom: 2px;
  }
  .graph-grid { flex: 1; border-collapse: collapse; font-size: 9.5px; }
  .graph-grid th {
    border: 1px solid #333; text-align: center;
    padding: 2px 0; font-weight: bold; height: 18px;
  }
  .graph-grid td { border: 1px solid #ccc; height: 14px; min-width: 38px; }

  /* ── DIVIDER ── */
  .divider { border: none; border-top: 1px dotted #888; margin: 14px 0; }

  /* ── ANSWER SECTIONS ── */
  .answer-area {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 0 10px; margin-bottom: 12px;
  }
  .answer-col {}
  .col-header {
    font-size: 10px; font-weight: bold; margin-bottom: 4px;
    display: flex; gap: 6px; align-items: center;
  }
  .col-header .sect-num { font-weight: bold; }
  .col-header .options { display: flex; gap: 8px; font-size: 9.5px; }

  .answer-row {
    display: flex; align-items: center;
    margin-bottom: 2px; font-size: 9.5px; gap: 2px;
  }
  .answer-row .qnum {
    width: 24px; text-align: right; flex-shrink: 0; font-size: 9px;
  }
  .answer-row .opts { display: flex; gap: 8px; font-size: 9.5px; }
  .answer-row .opts span { width: 10px; text-align: center; }
  .answer-row .dot-line {
    flex: 1; border-bottom: 1px dotted #666; height: 12px; min-width: 80px;
  }
  .answer-row .num-opts { display: flex; gap: 5px; font-size: 9px; }
  .answer-row .num-opts span { width: 10px; text-align: center; }

  /* ── SCORE BOXES ── */
  .score-boxes { display: flex; justify-content: space-around; margin-top: 14px; }
  .score-box {
    width: 80px; height: 40px; border: 2px solid #333;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Times New Roman', serif;
  }
  .score-box .box-label {
    font-size: 7.5px; color: #555; font-weight: bold; letter-spacing: 0.3px;
    text-transform: uppercase; line-height: 1;
  }
  .score-box .box-value {
    font-size: 16px; font-weight: 900; color: #111; line-height: 1.2;
  }

  /* ── PAGE 2 ── */
  .answer-grid-3col {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 0 14px; margin-bottom: 10px;
  }
  .answer-grid-4col {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 0 10px; margin-bottom: 10px;
  }

  /* ── JAWABAN TERISI ── */
  .opted-correct { color: #16a34a; font-weight: 900; }
  .opted-wrong   { color: #dc2626; font-weight: 900; text-decoration: line-through; }

  .dot-filled {
    flex: 1; height: 12px; min-width: 80px;
    font-size: 9.5px; font-weight: 700;
    display: inline-flex; align-items: flex-end;
    border-bottom: 1px solid currentColor;
  }
  .dot-filled.correct { color: #16a34a; }
  .dot-filled.wrong   { color: #dc2626; text-decoration: line-through; }

  .ans-mark { font-size: 9.5px; font-weight: 900; margin-left: 3px; flex-shrink: 0; }
  .ans-mark.correct { color: #16a34a; }
  .ans-mark.wrong   { color: #dc2626; }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .search-panel, .err-box { display: none !important; }
    .page { box-shadow: none; border: none; }
  }
</style>

<script>
// ─── API CONFIG ───────────────────────────────────────────────
const API_R = 'https://lidan-co-id.pages.dev/api/contacts_filter_dinamis7';
const TBL   = 'nilai1_json';
const AUTH  = 'admin';

// ─── GRAPH INIT ──────────────────────────────────────────────
const graphBody = document.getElementById('graphBody');
for (let r = 0; r < 7; r++) {
  const tr = document.createElement('tr');
  for (let c = 0; c < 10; c++) tr.appendChild(document.createElement('td'));
  graphBody.appendChild(tr);
}

// ─── PARSERS ─────────────────────────────────────────────────

// ist1/2/3/7/8/9: "1.1Bx✗;2.2Cv✗;..."
function parseAbcde(str) {
  const map = {};
  if (!str) return map;
  str.split(';').map(s => s.replace(/✗/g,'').trim()).filter(Boolean).forEach(token => {
    const m = token.match(/^(\d+)\.(\d+)([A-Ea-e])(v|x)$/i);
    if (!m) return;
    map[parseInt(m[1])] = { pilihan: m[3].toLowerCase(), benar: m[4].toLowerCase() === 'v' };
  });
  return map;
}

// ist4: "1.1|ma|x|s0✗;..."
function parseText(str) {
  const map = {};
  if (!str) return map;
  str.split(';').map(s => s.replace(/✗/g,'').trim()).filter(Boolean).forEach(token => {
    const m = token.match(/^(\d+)\.(\d+)\|([^|]*)\|(v|x)(?:\|(\d+))?$/i);
    if (!m) return;
    const benar = m[4].toLowerCase() === 'v';
    map[parseInt(m[1])] = { teks: m[3].trim(), benar, skor: m[5] !== undefined ? parseInt(m[5]) : (benar ? 1 : 0) };
  });
  return map;
}

// ist5/6: "1.1|345|x✗;..."
function parseAngka(str) {
  const map = {};
  if (!str) return map;
  str.split(';').map(s => s.replace(/✗/g,'').trim()).filter(Boolean).forEach(token => {
    const m = token.match(/^(\d+)\.(\d+)\|([^|]*)\|(v|x)$/i);
    if (!m) return;
    map[parseInt(m[1])] = { angka: m[3].trim(), benar: m[4].toLowerCase() === 'v' };
  });
  return map;
}

// ─── RENDER HELPERS ──────────────────────────────────────────

function makeAbcdeRows(containerId, start, end, dataMap, offset=0) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const opts = ['a','b','c','d','e'];
  for (let n = start; n <= end; n++) {
    const idx = n - start + 1 + offset;
    const d   = dataMap ? dataMap[idx] : null;
    const row = document.createElement('div');
    row.className = 'answer-row';

    const qnum = document.createElement('span');
    qnum.className = 'qnum';
    qnum.textContent = n + ')';
    row.appendChild(qnum);

    const optsDiv = document.createElement('div');
    optsDiv.className = 'opts';
    opts.forEach(opt => {
      const sp = document.createElement('span');
      sp.textContent = opt;
      if (d && d.pilihan === opt) sp.className = d.benar ? 'opted-correct' : 'opted-wrong';
      optsDiv.appendChild(sp);
    });
    row.appendChild(optsDiv);

    if (d) {
      const mark = document.createElement('span');
      mark.className = 'ans-mark ' + (d.benar ? 'correct' : 'wrong');
      mark.textContent = d.benar ? '✓' : '✗';
      row.appendChild(mark);
    }
    container.appendChild(row);
  }
}

function makeNumRows(containerId, start, end, dataMap) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const digits = ['1','2','3','4','5','6','7','8','9','0'];
  for (let n = start; n <= end; n++) {
    const idx = n - start + 1;
    const d   = dataMap ? dataMap[idx] : null;
    const row = document.createElement('div');
    row.className = 'answer-row';

    const qnum = document.createElement('span');
    qnum.className = 'qnum';
    qnum.textContent = n + ')';
    row.appendChild(qnum);

    const numDiv = document.createElement('div');
    numDiv.className = 'num-opts';
    digits.forEach(dig => {
      const sp = document.createElement('span');
      sp.textContent = dig;
      if (d && d.angka && d.angka.includes(dig)) sp.className = d.benar ? 'opted-correct' : 'opted-wrong';
      numDiv.appendChild(sp);
    });
    row.appendChild(numDiv);

    if (d) {
      const mark = document.createElement('span');
      mark.className = 'ans-mark ' + (d.benar ? 'correct' : 'wrong');
      mark.textContent = d.benar ? '✓' : '✗';
      row.appendChild(mark);
    }
    container.appendChild(row);
  }
}

function makeDotRows(containerId, start, end, dataMap) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  for (let n = start; n <= end; n++) {
    const idx = n - start + 1;
    const d   = dataMap ? dataMap[idx] : null;
    const row = document.createElement('div');
    row.className = 'answer-row';

    const qnum = document.createElement('span');
    qnum.className = 'qnum';
    qnum.textContent = n + ')';
    row.appendChild(qnum);

    if (d) {
      const span = document.createElement('span');
      span.className = 'dot-filled ' + (d.benar ? 'correct' : 'wrong');
      span.textContent = d.teks;
      row.appendChild(span);

      const mark = document.createElement('span');
      mark.className = 'ans-mark ' + (d.benar ? 'correct' : 'wrong');
      mark.textContent = d.benar ? '✓' + ((d.skor !== undefined) ? d.skor : 1) : '✗';
      row.appendChild(mark);
    } else {
      const line = document.createElement('div');
      line.className = 'dot-line';
      row.appendChild(line);
    }
    container.appendChild(row);
  }
}

// ─── COUNT BENAR ─────────────────────────────────────────────
function countBenar(dataMap, from, to, useSkor) {
  let total = 0;
  for (let idx = from; idx <= to; idx++) {
    if (!dataMap[idx]) continue;
    total += useSkor ? (dataMap[idx].skor || 0) : (dataMap[idx].benar ? 1 : 0);
  }
  return total;
}

function setScoreBox(id, label, value, isEmpty) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = isEmpty ? '' :
    `<span class="box-label">${label}</span><span class="box-value">${value}</span>`;
}

// ─── RENDER GRAPH ─────────────────────────────────────────────
function renderGraph(swValues, isEmpty) {
  const svg = document.getElementById('graphSvg');
  svg.innerHTML = '';
  if (isEmpty) return;

  const subtesOrder = ['SE','WA','AN','GE','ME','RA','ZR','FA','WU'];
  const SW_MIN = 70, SW_MAX = 130;

  requestAnimationFrame(() => {
    const table = document.getElementById('graphTable');
    const tbody = document.getElementById('graphBody');
    if (!tbody.rows.length) return;

    const svgRect = svg.getBoundingClientRect();
    const points  = [];

    subtesOrder.forEach((key, colIdx) => {
      const sw = swValues[key];
      if (sw === undefined || sw === '') return;

      const th = table.querySelector('thead tr').cells[colIdx];
      const thRect = th.getBoundingClientRect();
      const x = (thRect.left + thRect.width / 2) - svgRect.left;

      const swClamped  = Math.max(SW_MIN, Math.min(SW_MAX, sw));
      const firstRect  = tbody.rows[0].getBoundingClientRect();
      const lastRect   = tbody.rows[tbody.rows.length - 1].getBoundingClientRect();
      const yTop       = firstRect.top  + firstRect.height  / 2 - svgRect.top;
      const yBottom    = lastRect.top   + lastRect.height   / 2 - svgRect.top;
      const y = yTop + (SW_MAX - swClamped) / (SW_MAX - SW_MIN) * (yBottom - yTop);

      points.push({ x, y });
    });

    if (!points.length) return;

    for (let i = 0; i < points.length - 1; i++) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', points[i].x);   line.setAttribute('y1', points[i].y);
      line.setAttribute('x2', points[i+1].x); line.setAttribute('y2', points[i+1].y);
      line.setAttribute('stroke', '#1a6ab5'); line.setAttribute('stroke-width', '1.5');
      svg.appendChild(line);
    }
    points.forEach(p => {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', '4');
      circle.setAttribute('fill', '#1a6ab5'); circle.setAttribute('stroke', '#fff');
      circle.setAttribute('stroke-width', '1');
      svg.appendChild(circle);
    });
  });
}

// ─── RENDER RW TABLE — menggunakan ISTEngine ─────────────────
function renderRW(scores, isEmpty, usia) {
  const keys = ['SE','WA','AN','GE','ME','RA','ZR','FA','WU'];
  const { usiaKey, swPerSubtes, jml, gesamtSW, iq } = ISTEngine.hitungIST(scores, usia);

  keys.forEach(k => {
    const elRw = document.getElementById('rw-' + k);
    const elSw = document.getElementById('sw-' + k);
    if (!elRw) return;
    if (isEmpty) {
      elRw.textContent = ''; elRw.style.cursor = ''; elRw.onclick = null;
      if (elSw) elSw.textContent = '';
    } else {
      const val = scores[k] !== undefined ? scores[k] : 0;
      elRw.textContent = val;
      if (elSw) elSw.textContent = swPerSubtes[k];
      if (k === 'GE') {
        elRw.style.cursor = 'pointer';
        elRw.title = 'Klik untuk lihat jumlah benar GE';
        elRw.style.textDecoration = 'underline dotted';
        elRw.onclick = () => showGEPopup(scores._GE_raw, val);
      }
    }
  });

  document.getElementById('rw-JML').textContent = isEmpty ? '' : jml;
  document.getElementById('sw-JML').textContent = isEmpty ? '' : gesamtSW;
  document.getElementById('iq-val').textContent = isEmpty ? '' : iq;

  // Grafik
  const swForGraph = {};
  if (!isEmpty) keys.forEach(k => {
    const sw = swPerSubtes[k];
    swForGraph[k] = sw !== '' ? parseInt(sw) : undefined;
  });
  renderGraph(swForGraph, isEmpty);
}

// ─── RENDER ALL ───────────────────────────────────────────────
function convertGE(jumlahBenar) {
  const GE_NORM = [
    { min:32, max:999, rw:20 }, { min:30, max:31,  rw:19 }, { min:29, max:29,  rw:18 },
    { min:28, max:28,  rw:17 }, { min:27, max:27,  rw:16 }, { min:25, max:26,  rw:15 },
    { min:23, max:24,  rw:14 }, { min:21, max:22,  rw:13 }, { min:19, max:20,  rw:12 },
    { min:17, max:18,  rw:11 }, { min:15, max:16,  rw:10 }, { min:13, max:14,  rw:9  },
    { min:11, max:12,  rw:8  }, { min:9,  max:10,  rw:7  }, { min:7,  max:8,   rw:6  },
    { min:5,  max:6,   rw:5  }, { min:4,  max:4,   rw:4  }, { min:3,  max:3,   rw:3  },
    { min:2,  max:2,   rw:2  }, { min:0,  max:1,   rw:1  },
  ];
  const entry = GE_NORM.find(r => jumlahBenar >= r.min && jumlahBenar <= r.max);
  return entry ? entry.rw : 1;
}

  clearErr();

// ─── UI HELPERS ──────────────────────────────────────────────
function showErr(msg) { const el = document.getElementById('errBox'); el.textContent = msg; el.classList.add('show'); }
function clearErr()   { document.getElementById('errBox').classList.remove('show'); }
function setBtn(loading) {
  const btn = document.getElementById('btnCari');
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner"></span> Mencari...' : 'Cari';
}

// ─── MAIN FETCH ──────────────────────────────────────────────
async function cariData() {
  const idVal = document.getElementById('inputId').value.trim();
  if (!idVal) { showErr('⚠ Masukkan id_x peserta terlebih dahulu.'); return; }

  clearErr(); setBtn(true);
  try {
    const res = await fetch(`${API_R}?table=${TBL}&id_x=${encodeURIComponent(idVal)}`,
      { headers: { 'X-Custom-Auth': AUTH } });
    const d = await res.json();

    if (!d.success || !d.data) { showErr('⚠ Tidak ada data ditemukan untuk ID: ' + idVal); return; }
    const row = Array.isArray(d.data) ? d.data[0] : d.data;
    if (!row) { showErr('⚠ Tidak ada data ditemukan untuk ID: ' + idVal); return; }

    renderBio(row.x_02 || '');
    let x08 = {};
    try { x08 = JSON.parse(row.x_08 || '{}'); } catch {}
    let bio = {};
    try { bio = JSON.parse(row.x_02 || '{}'); } catch {}
    renderAll(x08, parseInt(bio.usia) || 0);
  } catch (e) {
    showErr('⚠ Gagal mengambil data: ' + e.message);
  } finally {
    setBtn(false);
  }
}
