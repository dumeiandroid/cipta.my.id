<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Tes Temperamen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="karakter_engine.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        .content { padding: 40px; }

        /* Profile */
        .profile-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .profile-item { display: flex; flex-direction: column; }
        .profile-label {
            font-size: 0.85em;
            color: #667eea;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .profile-value { font-size: 1.1em; color: #2c3e50; }

        /* Result card */
        .result-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            border-left: 8px solid;
            text-align: center;
        }
        .result-card h2 { font-size: 2.5em; margin-bottom: 15px; }

        /* Temperament grid */
        .temperament-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .temp-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 3px solid;
            text-align: center;
            transition: transform 0.3s;
        }
        .temp-card.dominant {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .temp-icon { font-size: 3em; margin-bottom: 10px; }
        .temp-name { font-size: 1.3em; font-weight: bold; margin-bottom: 10px; }
        .temp-score { font-size: 2em; font-weight: bold; margin: 10px 0; }

        /* Chart */
        .chart-container { position: relative; height: 320px; margin: 30px 0; }

        /* Info sections */
        .info-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid #e9ecef;
        }
        .info-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info-section ul { list-style: none; padding-left: 0; }
        .info-section li {
            padding: 10px 0;
            padding-left: 30px;
            position: relative;
            line-height: 1.6;
            color: #555;
        }
        .info-section li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }

        /* Strength / Weakness */
        .strength-weakness {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .sw-box { background: #f8f9fa; padding: 20px; border-radius: 10px; }
        .sw-box h4 { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 3px solid; }
        .sw-box ul { list-style: none; padding: 0; }
        .sw-box li { padding: 8px 0; padding-left: 25px; position: relative; color: #444; }

        /* Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-download { background: #667eea; color: white; }
        .btn-download:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-print { background: #2c3e50; color: white; }
        .btn-print:hover { background: #1a252f; transform: translateY(-2px); }

        /* States */
        .error-msg { text-align: center; padding: 60px 40px; color: #e74c3c; }
        .loading    { text-align: center; padding: 60px 40px; color: #7f8c8d; }

        @media print {
            body { background: white; padding: 0; }
            .button-group { display: none; }
            .container { box-shadow: none; }
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.5em; }
            .result-card h2 { font-size: 1.8em; }
            .button-group { grid-template-columns: 1fr; }
            .temperament-grid { grid-template-columns: 1fr; }
            .strength-weakness { grid-template-columns: 1fr; }
            .content { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="loading">
        <div style="font-size:3em;margin-bottom:20px;">⏳</div>
        <h3>Memuat Hasil Tes Temperamen...</h3>
    </div>
</div>

<script>
KarakterEngine.load('04').then(result => {
    const { dataDiri, dominan, config, skor, persen, total, sortedSkor } = result;

    /* --- Kartu per temperamen (urut skor tertinggi) --- */
    const tempCardsHTML = sortedSkor.map(([key, score]) => {
        const t = KarakterEngine.data.TEMPERAMENTS[key];
        return `
        <div class="temp-card ${key === dominan ? 'dominant' : ''}" style="border-color:${t.color}">
            <div class="temp-icon">${t.icon}</div>
            <div class="temp-name" style="color:${t.color}">${t.name}</div>
            <div class="temp-score" style="color:${t.color}">${score}/${total}</div>
            <div style="color:#666;font-size:0.9em">${persen[key]}%</div>
        </div>`;
    }).join('');

    document.getElementById('mainContainer').innerHTML = `
        <div class="header">
            <h1>🎭 Hasil Tes Temperamen</h1>
            <p>Apa Temperamen yang Kita Miliki?</p>
        </div>
        <div class="content">

            <div class="profile-section">
                <h3 style="color:#2c3e50;margin-bottom:15px">📋 Informasi Peserta</h3>
                <div class="profile-grid">
                    <div class="profile-item">
                        <span class="profile-label">Nama Lengkap</span>
                        <span class="profile-value">${dataDiri.nama || '-'}</span>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">Usia</span>
                        <span class="profile-value">${dataDiri.usia || '-'} Tahun</span>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">Pendidikan</span>
                        <span class="profile-value">${dataDiri.pendidikan || '-'}</span>
                    </div>
                    <div class="profile-item">
                        <span class="profile-label">Tanggal Tes</span>
                        <span class="profile-value">${dataDiri.tgl_tes || '-'}</span>
                    </div>
                </div>
            </div>

            <div class="result-card" style="border-color:${config.color}">
                <h2 style="color:${config.color}">${config.icon} ${config.name}</h2>
                <p style="font-size:1.3em;font-weight:bold;color:#555;margin-bottom:10px">${config.tagline}</p>
                <p style="font-size:1.1em;color:#555">${config.description}</p>
            </div>

            <div class="temperament-grid">${tempCardsHTML}</div>

            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>

            <div class="info-section">
                <h3>🎯 Karakteristik Temperamen ${config.name}</h3>
                <ul>${config.characteristics.map(c => `<li>${c}</li>`).join('')}</ul>
            </div>

            <div class="strength-weakness">
                <div class="sw-box">
                    <h4 style="color:#27ae60;border-color:#27ae60">💪 Kekuatan</h4>
                    <ul>${config.strengths.map(s => `<li style="color:#27ae60">✓ ${s}</li>`).join('')}</ul>
                </div>
                <div class="sw-box">
                    <h4 style="color:#e74c3c;border-color:#e74c3c">⚠️ Kelemahan</h4>
                    <ul>${config.weaknesses.map(w => `<li style="color:#e74c3c">✗ ${w}</li>`).join('')}</ul>
                </div>
            </div>

            <div class="info-section">
                <h3>💼 Karir yang Cocok</h3>
                <p style="color:#555;line-height:1.8;font-size:1.1em">${config.careers.join(' • ')}</p>
            </div>

            <div class="info-section">
                <h3>💡 Saran Pengembangan Diri</h3>
                <ul>${config.tips.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>

            <div class="info-section">
                <h3>📚 Tentang Temperamen</h3>
                <p style="line-height:1.8;color:#555">
                    Teori temperamen berasal dari Hippocrates yang membagi kepribadian manusia menjadi 4 tipe dasar.
                    Setiap orang biasanya memiliki kombinasi dari keempat temperamen, namun satu atau dua akan lebih dominan.
                    Memahami temperamen membantu kita mengenali kekuatan dan kelemahan diri, serta cara berinteraksi
                    dengan orang lain yang memiliki temperamen berbeda.
                </p>
            </div>

            <div class="button-group">
                <button class="btn-download" onclick="downloadAsImage()">📥 Download JPG</button>
                <button class="btn-print"    onclick="window.print()">🖨️ Cetak PDF</button>
            </div>

        </div>
    `;

    /* --- Chart polar area --- */
    const T = KarakterEngine.data.TEMPERAMENTS;
    new Chart(document.getElementById('myChart').getContext('2d'), {
        type: 'polarArea',
        data: {
            labels: ['Sanguinis','Koleris','Melankolis','Phlegmatis'],
            datasets: [{
                data: [skor.A, skor.B, skor.C, skor.D],
                backgroundColor: [
                    'rgba(241,196,15,0.7)',
                    'rgba(230,126,34,0.7)',
                    'rgba(155,89,182,0.7)',
                    'rgba(52,152,219,0.7)'
                ],
                borderColor: [T.A.color, T.B.color, T.C.color, T.D.color],
                borderWidth: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position:'bottom', labels:{ padding:20, font:{size:14,weight:'bold'} } },
                tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.parsed.r}/${total}` } }
            },
            scales: { r: { beginAtZero:true, max:total, ticks:{ stepSize:5 } } }
        }
    });

}).catch(err => {
    document.getElementById('mainContainer').innerHTML = `
        <div class="error-msg">
            <div style="font-size:3em;margin-bottom:20px">❌</div>
            <h2>${err.error || 'Terjadi kesalahan.'}</h2>
        </div>`;
});

async function downloadAsImage() {
    const btn = event.target;
    btn.disabled = true; btn.textContent = '⏳ Memproses...';
    try {
        const canvas = await html2canvas(document.getElementById('mainContainer'), { scale:2, backgroundColor:'#ffffff', logging:false });
        const link = document.createElement('a');
        link.download = `Hasil-Temperamen-${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
        btn.disabled = false; btn.textContent = '✅ Berhasil!';
        setTimeout(() => btn.textContent = '📥 Download JPG', 2000);
    } catch {
        btn.disabled = false; btn.textContent = '❌ Gagal';
        setTimeout(() => btn.textContent = '📥 Download JPG', 2000);
    }
}
</script>
</body>
</html>
