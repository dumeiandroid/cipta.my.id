<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screener Saham Adaptif IDX</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background:#0f172a; color:#e2e8f0; padding:20px; margin:0;
    max-width: 1300px; margin: 0 auto;
  }
  h1 { color:#38bdf8; font-size: 22px; }
  .mode-badge { display:inline-block; padding:5px 12px; border-radius:20px;
                font-size:12px; font-weight:bold; margin-left:8px; vertical-align:middle; }
  .mode-premarket { background:#a16207; color:#fff; }
  .mode-preopening { background:#b45309; color:#fff; }
  .mode-opening { background:#15803d; color:#fff; }
  .mode-intraday { background:#0369a1; color:#fff; }
  button {
    background:#38bdf8; color:#0f172a; border:0; padding:12px 20px;
    border-radius:6px; font-weight:bold; cursor:pointer; margin:10px 6px 0 0;
    font-size: 13px;
  }
  button:hover:not(:disabled) { background:#7dd3fc; }
  button:disabled { opacity:0.5; cursor:wait; }
  button.secondary { background:#334155; color:#e2e8f0; }
  button.secondary:hover { background:#475569; }
  button.danger { background:#7f1d1d; color:#fecaca; }
  button.danger:hover { background:#991b1b; }
  button.small { padding: 6px 12px; font-size: 12px; }

  select {
    background:#1e293b; color:#e2e8f0; border:1px solid #475569;
    padding:8px 12px; border-radius:6px; font-size:13px; cursor:pointer;
    margin-left: 6px;
  }

  .progress-wrap { margin: 15px 0; }
  .progress-bar { height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg,#38bdf8,#4ade80);
                   width: 0%; transition: width 0.3s ease; }
  .progress-text { display: flex; justify-content: space-between;
                   font-size: 13px; color:#94a3b8; margin-top: 6px; }
  .progress-text b { color: #38bdf8; }

  #status { margin:15px 0; font-style:italic; color:#94a3b8; font-size: 13px; }
  #clock { font-family:monospace; font-size:14px; color:#38bdf8; }

  table { width:100%; border-collapse:collapse; margin-top:12px; font-size: 13px; }
  th, td { padding:9px 8px; text-align:left; border-bottom:1px solid #334155; }
  th { background:#1e293b; color:#38bdf8; font-weight:600; position: sticky; top: 0; }
  tr:hover { background:#1e293b; }
  tr.new-row { animation: highlight 1.2s ease; }
  @keyframes highlight {
    0% { background: #166534; }
    100% { background: transparent; }
  }

  .positive { color:#4ade80; font-weight:bold; }
  .negative { color:#f87171; font-weight:bold; }
  .score { color:#fbbf24; font-weight:bold; font-size: 14px; }
  .note { background:#1e293b; padding:15px; border-radius:8px; margin-top:20px;
          font-size:13px; line-height:1.7; }
  .warning { background:#7c2d12; padding:14px; border-radius:8px;
             margin:15px 0; border-left:4px solid #fb923c; line-height: 1.6; }
  .info { background:#0c4a6e; padding:14px; border-radius:8px;
          margin:15px 0; border-left:4px solid #38bdf8; line-height: 1.6; }
  .success { background:#14532d; padding:14px 16px; border-radius:8px;
             margin:15px 0; border-left:4px solid #4ade80; line-height: 1.6; }
  code { background:#334155; padding:2px 6px; border-radius:4px; font-size:12px; }

  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
              background: #4ade80; margin-right: 6px; animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.3); }
  }
  .live-badge { display: inline-block; background: #166534; color: #bbf7d0;
                padding: 3px 10px; border-radius: 12px; font-size: 11px;
                font-weight: bold; margin-left: 8px; }

  .history-item { background:#1e293b; padding:14px; border-radius:8px;
                  margin-bottom:10px; font-size:13px; cursor:pointer;
                  border-left:4px solid transparent; transition: all 0.2s; }
  .history-item:hover { background:#334155; border-left-color:#38bdf8; }
  .history-item b { color:#38bdf8; }
  .history-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  .filter-bar {
    background:#1e293b; padding:12px 16px; border-radius:8px;
    margin-top:12px; display:flex; align-items:center; flex-wrap:wrap;
    gap: 12px; font-size: 13px;
  }
  .filter-bar label { color:#94a3b8; }

  /* ============ TABS ============ */
  .tabs { display:flex; gap:6px; margin-top:22px; border-bottom:2px solid #1e293b; }
  .tab-btn {
    background:transparent; color:#94a3b8; border:0; margin:0;
    padding:11px 20px; border-radius:8px 8px 0 0; font-weight:bold;
    cursor:pointer; font-size:13px; border-bottom:3px solid transparent;
    transition: all .15s;
  }
  .tab-btn:hover { background:#1e293b; color:#e2e8f0; }
  .tab-btn.active { color:#38bdf8; border-bottom-color:#38bdf8; background:#1e293b; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* ============ SCORE TABLE ============ */
  .score-table-wrap { overflow-x:auto; margin-top:12px; border-radius:8px; }
  .score-table { border-collapse: separate; border-spacing:0; min-width:100%; }
  .score-table th, .score-table td { white-space:nowrap; text-align:center; }
  .score-table th.score-th { min-width: 96px; }
  .score-table th.score-th.newest { background:#0c4a6e; color:#7dd3fc; }
  .th-sub { font-size:10px; font-weight:normal; color:#94a3b8; }
  .score-table td.col-no, .score-table th.col-no {
    position: sticky; left: 0; z-index: 2; width: 52px; min-width: 52px;
    background:#0f172a; text-align:center;
  }
  .score-table th.col-no { background:#1e293b; z-index: 4; }
  .score-table td.col-kode, .score-table th.col-kode {
    position: sticky; left: 52px; z-index: 2; width: 92px; min-width: 92px;
    background:#0f172a; text-align:left;
  }
  .score-table th.col-kode { background:#1e293b; z-index: 4; }
  .score-table tr:hover td.col-no,
  .score-table tr:hover td.col-kode { background:#1e293b; }
  .score-table td.col-kode { border-right:2px solid #334155; }

  .score-click {
    display:inline-block; min-width: 46px; text-align:center;
    padding: 5px 10px; border-radius: 6px; font-weight: bold;
    cursor: pointer; border:1px solid transparent; transition: all .15s;
    font-size: 13px;
  }
  .score-click:hover { transform: translateY(-1px); border-color:#38bdf8; filter:brightness(1.2); }
  .sc-high { background:#14532d; color:#86efac; }
  .sc-mid  { background:#78350f; color:#fcd34d; }
  .sc-low  { background:#1e293b; color:#94a3b8; }
  .score-empty { color:#475569; text-align:center; }

  /* ============ MODAL ============ */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(2,6,23,0.78);
    display: flex; align-items: center; justify-content: center;
    z-index: 999; padding: 20px; backdrop-filter: blur(2px);
  }
  .modal-box {
    background:#1e293b; border:1px solid #334155; border-radius:14px;
    padding:24px; max-width:460px; width:100%; position:relative;
    box-shadow: 0 24px 70px rgba(0,0,0,.7);
    animation: modalIn .18s ease;
    max-height: 90vh; overflow-y:auto;
  }
  @keyframes modalIn { from { opacity:0; transform: translateY(12px) scale(.97); } }
  .modal-close {
    position:absolute; top:12px; right:12px; background:#334155; color:#e2e8f0;
    border:0; border-radius:8px; width:32px; height:32px; padding:0; margin:0;
    font-size:14px; cursor:pointer; line-height:32px;
  }
  .modal-close:hover { background:#475569; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-right:36px; }
  .modal-symbol { font-size:22px; font-weight:bold; color:#38bdf8; }
  .modal-score { font-size:26px; font-weight:bold; padding:4px 16px; border-radius:8px; }
  .modal-sub { color:#94a3b8; font-size:12px; margin-top:6px; }
  .detail-list { margin-top:18px; border-top:1px solid #334155; }
  .detail-row { display:flex; justify-content:space-between; padding:10px 0;
                border-bottom:1px solid #334155; font-size:13px; }
  .detail-label { color:#94a3b8; }
  .detail-val { font-weight:bold; }
  .modal-foot { margin-top:16px; font-size:11px; color:#64748b; line-height:1.6; font-style:italic; }
</style>
</head>
<body>

<h1>📈 Screener Saham Adaptif IDX <span id="modeBadge" class="mode-badge">—</span></h1>
<p style="color:#94a3b8; font-size:13px;">Waktu WIB: <span id="clock">--:--:--</span></p>

<div>
  <button id="scanBtn" onclick="scanStocks()">🔍 Scan Sekarang</button>
  <button class="secondary" onclick="showHistory()">📜 Riwayat Scan</button>
  <button class="secondary" onclick="loadLastSnapshot()">📂 Hasil Scan Terakhir</button>
  <button class="secondary" onclick="showCacheStatus()">📦 Status Cache</button>
  <button class="danger" onclick="clearAllCache()">🗑️ Hapus Semua</button>
</div>

<div id="status"></div>

<div id="progressWrap" class="progress-wrap" style="display:none;">
  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>
  <div class="progress-text">
    <span><span class="live-dot"></span>Memproses: <b id="progressSymbol">—</b></span>
    <span><b id="progressCount">0/0</b></span>
  </div>
</div>

<!-- ================= TABS ================= -->
<div class="tabs">
  <button class="tab-btn active" data-tab="live" onclick="switchTab('live')">📊 Hasil Scan</button>
  <button class="tab-btn" data-tab="score" onclick="switchTab('score')">🎯 Tabel Skor</button>
</div>

<div id="tab-live" class="tab-panel active">
  <div id="result"></div>
</div>

<div id="tab-score" class="tab-panel">
  <div id="scoreResult"></div>
</div>

<!-- ================= MODAL DETAIL ================= -->
<div id="detailModal" class="modal-overlay" style="display:none;"
     onclick="if(event.target===this) closeDetailModal()"></div>

<script>
// ============================================================
// WATCHLIST 100 SAHAM
// ============================================================
const WATCHLIST = [
  'BBCA.JK','BBRI.JK','BMRI.JK','BBNI.JK','BBTN.JK','BRIS.JK','ARTO.JK',
  'BNGA.JK','BDMN.JK','NISP.JK','PNLF.JK','BFIN.JK','ADMF.JK',
  'ADRO.JK','AADI.JK','ADMR.JK','PTBA.JK','ITMG.JK','HRUM.JK','INDY.JK',
  'MEDC.JK','PGAS.JK','PGEO.JK','ELSA.JK','ENRG.JK','PTRO.JK','RAJA.JK',
  'AKRA.JK','DEWA.JK','ESSA.JK','RATU.JK',
  'ANTM.JK','INCO.JK','MDKA.JK','MBMA.JK','NCKL.JK','AMMN.JK','BRMS.JK',
  'TINS.JK','PSAB.JK','HRTA.JK',
  'UNVR.JK','ICBP.JK','INDF.JK','MYOR.JK','CMRY.JK','GGRM.JK','HMSP.JK',
  'AMRT.JK','MAPI.JK','MAPA.JK','ERAA.JK','ACES.JK','JPFA.JK','CPIN.JK',
  'TLKM.JK','EXCL.JK','ISAT.JK','TOWR.JK','GOTO.JK','BUKA.JK','EMTK.JK',
  'MTEL.JK','WIFI.JK',
  'JSMR.JK','SMGR.JK','INTP.JK','UNTR.JK','ADHI.JK','WIKA.JK','PTPP.JK',
  'BSDE.JK','CTRA.JK','PWON.JK','SMRA.JK','KIJA.JK','KPIG.JK','BKSL.JK',
  'CBDK.JK','SSIA.JK','PANI.JK',
  'AALI.JK','LSIP.JK','TAPG.JK','DSNG.JK','SGRO.JK','TBLA.JK',
  'KLBF.JK','MIKA.JK','HEAL.JK','SIDO.JK','KAEF.JK',
  'ASII.JK','BRPT.JK','TPIA.JK','INKP.JK','SCMA.JK','CUAN.JK','BUMI.JK',
  'BNBR.JK','BREN.JK','SRTG.JK'
];

// ============================================================
// KONFIGURASI
// ============================================================
const CONFIG = {
  defaultDisplayLimit: 25,
  cacheTTLMinutes: 5,
  historyMaxEntries: 10,
  minDelayMs: 100,
  defaultScoreColumns: 5
};

const LS_KEYS = {
  cache: 'screener_cache_v3',
  history: 'screener_history_v3',
  lastSnapshot: 'screener_last_snapshot_v3'
};

// ============================================================
// STATE
// ============================================================
let liveState = {
  scored: [],
  isIntraday: false,
  mode: '',
  total: 0,
  done: 0,
  isRunning: false,
  isSnapshot: false
};

let displayLimit = CONFIG.defaultDisplayLimit;
let scoreColumnLimit = CONFIG.defaultScoreColumns;
let activeTab = 'live';

// ============================================================
// UTIL
// ============================================================
const pad2 = n => String(n).padStart(2, '0');

function fmtDateTime(ts) {
  const d = new Date(ts);
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtFull(ts) {
  return new Date(ts).toLocaleString('id-ID');
}
function fileStamp() {
  const d = getWIBTime();
  return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`;
}
function toNum(v) { const n = parseFloat(v); return isFinite(n) ? n : v; }
function r2(v) { return v == null ? '' : Math.round(v * 100) / 100; }

// ============================================================
// LOCALSTORAGE
// ============================================================
const LS = {
  get(key, fallback = null) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { console.warn('LS error:', e); return false; }
  },
  remove(key) { try { localStorage.removeItem(key); } catch (e) {} }
};

// ============================================================
// CACHE DATA MENTAH (per saham)
// ============================================================
function getCachedStock(symbol, dataType) {
  const cache = LS.get(LS_KEYS.cache, {});
  const entry = cache[`${symbol}__${dataType}`];
  if (!entry) return null;
  const ageMin = (Date.now() - entry.timestamp) / 60000;
  if (ageMin > CONFIG.cacheTTLMinutes) return null;
  return entry.data;
}

function setCachedStock(symbol, dataType, data) {
  const cache = LS.get(LS_KEYS.cache, {});
  cache[`${symbol}__${dataType}`] = { data, timestamp: Date.now() };
  LS.set(LS_KEYS.cache, cache);
}

function cleanExpiredCache() {
  const cache = LS.get(LS_KEYS.cache, {});
  const now = Date.now();
  const ttlMs = CONFIG.cacheTTLMinutes * 60000;
  let removed = 0;
  for (const key in cache) {
    if (now - cache[key].timestamp > ttlMs) { delete cache[key]; removed++; }
  }
  LS.set(LS_KEYS.cache, cache);
  return removed;
}

function showCacheStatus() {
  switchTab('live');
  const cache = LS.get(LS_KEYS.cache, {});
  const history = LS.get(LS_KEYS.history, []);
  const keys = Object.keys(cache);
  const result = document.getElementById('result');
  const status = document.getElementById('status');

  if (keys.length === 0 && history.length === 0) {
    status.textContent = '📦 Cache & riwayat kosong.';
    result.innerHTML = '';
    return;
  }

  const now = Date.now();
  const ttlMs = CONFIG.cacheTTLMinutes * 60000;
  let valid = 0, expired = 0;
  keys.forEach(k => {
    if (now - cache[k].timestamp <= ttlMs) valid++;
    else expired++;
  });

  const cacheSize = new Blob([JSON.stringify(cache)]).size;
  const historySize = new Blob([JSON.stringify(history)]).size;

  status.textContent = `📦 Cache: ${keys.length} entri, Riwayat: ${history.length} scan`;

  result.innerHTML = `<div class="info">
    <b>📦 Status Penyimpanan localStorage</b><br><br>
    <b>Cache data mentah:</b><br>
    • Entri: <b>${keys.length}</b> (valid ${valid}, kadaluarsa ${expired})<br>
    • Ukuran: <b>${(cacheSize/1024).toFixed(1)} KB</b><br>
    • TTL: ${CONFIG.cacheTTLMinutes} menit<br><br>
    <b>Riwayat snapshot:</b><br>
    • Jumlah scan tersimpan: <b>${history.length}</b> (maks ${CONFIG.historyMaxEntries})<br>
    • Ukuran: <b>${(historySize/1024).toFixed(1)} KB</b><br>
    • Total localStorage: <b>${((cacheSize+historySize)/1024).toFixed(1)} KB</b><br><br>
    <i>Kapasitas localStorage biasanya 5–10 MB per domain.</i>
  </div>`;
}

// ============================================================
// RIWAYAT — simpan snapshot lengkap
// ============================================================
function saveToHistory(mode, results, isIntraday) {
  if (results.length === 0) return;

  const history = LS.get(LS_KEYS.history, []);

  const snapshot = {
    timestamp: Date.now(),
    mode,
    isIntraday,
    count: results.length,
    results: results.map(r => ({
      symbol: r.symbol,
      score: r.score,
      displayPrice: r.displayPrice,
      displayChange: r.displayChange,
      displayMomentum: r.displayMomentum,
      displayGap: r.displayGap,
      displayIntraday: r.displayIntraday,
      displayVsPrev: r.displayVsPrev,
      volRatio: r.volRatio,
      rangePos: r.rangePos
    }))
  };

  history.unshift(snapshot);
  LS.set(LS_KEYS.history, history.slice(0, CONFIG.historyMaxEntries));
  LS.set(LS_KEYS.lastSnapshot, snapshot);
}

function showHistory() {
  switchTab('live');
  const history = LS.get(LS_KEYS.history, []);
  const result = document.getElementById('result');
  const status = document.getElementById('status');

  if (history.length === 0) {
    status.textContent = '📜 Belum ada riwayat.';
    result.innerHTML = `<div class="info">📜 Belum ada riwayat scan. Jalankan scan dulu.</div>`;
    return;
  }

  status.textContent = `📜 ${history.length} riwayat scan tersimpan. Klik salah satu untuk lihat tabel lengkap.`;

  const items = history.map((h, idx) => {
    const tgl = new Date(h.timestamp).toLocaleString('id-ID');
    const top5 = h.results.slice(0, 5).map(s =>
      `<span style="background:#0f172a;padding:2px 8px;border-radius:4px;margin-right:4px;">
        ${s.symbol} <b style="color:#fbbf24;">${s.score}</b>
      </span>`
    ).join('');

    return `<div class="history-item">
      <div onclick="loadHistorySnapshot(${idx})">
        <b>📅 ${tgl}</b> — Mode: ${h.mode} — <b>${h.count} saham</b><br>
        <div style="margin-top:6px;">Top 5: ${top5}</div>
      </div>
      <div class="history-actions">
        <button class="small secondary" onclick="event.stopPropagation();loadHistorySnapshot(${idx})">
          👁️ Tampilkan Tabel
        </button>
        <button class="small secondary" onclick="event.stopPropagation();exportHistoryItem(${idx})">
          ⬇️ Excel
        </button>
        <button class="small danger" onclick="event.stopPropagation();deleteHistory(${idx})">
          🗑️ Hapus
        </button>
      </div>
    </div>`;
  }).join('');

  result.innerHTML = `
    <div class="info" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <span><b>📜 Riwayat Scan</b> (${history.length} entri, klik untuk lihat detail)</span>
      <button class="small secondary" style="margin:0;" onclick="exportAllHistory()">⬇️ Download Semua Riwayat (Excel)</button>
    </div>
    ${items}`;
}

function loadHistorySnapshot(idx) {
  const history = LS.get(LS_KEYS.history, []);
  const snapshot = history[idx];
  if (!snapshot) return;

  switchTab('live');

  liveState = {
    scored: snapshot.results.map(r => ({ ...r })),
    isIntraday: snapshot.isIntraday,
    mode: snapshot.mode,
    total: snapshot.count,
    done: snapshot.count,
    isRunning: false,
    isSnapshot: true
  };

  document.getElementById('result').innerHTML = '';
  renderLiveTable();

  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });

  document.getElementById('status').textContent =
    `📜 Snapshot dari ${fmtFull(snapshot.timestamp)} — ${snapshot.count} saham, mode ${snapshot.mode}.`;
}

function deleteHistory(idx) {
  if (!confirm('Hapus riwayat ini?')) return;
  const history = LS.get(LS_KEYS.history, []);
  history.splice(idx, 1);
  LS.set(LS_KEYS.history, history);
  renderScoreTable();
  showHistory();
}

function loadLastSnapshot() {
  const snap = LS.get(LS_KEYS.lastSnapshot, null);
  if (!snap) {
    switchTab('live');
    document.getElementById('status').textContent = '📂 Belum ada snapshot scan terakhir.';
    document.getElementById('result').innerHTML = `<div class="info">📂 Belum ada hasil scan tersimpan. Jalankan scan dulu.</div>`;
    return;
  }

  switchTab('live');

  liveState = {
    scored: snap.results.map(r => ({ ...r })),
    isIntraday: snap.isIntraday,
    mode: snap.mode,
    total: snap.count,
    done: snap.count,
    isRunning: false,
    isSnapshot: true
  };

  document.getElementById('result').innerHTML = '';
  renderLiveTable();
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });

  document.getElementById('status').textContent = `📂 Snapshot terakhir dari ${fmtFull(snap.timestamp)}.`;
}

function clearAllCache() {
  if (!confirm('Hapus semua cache, riwayat, dan snapshot?')) return;
  LS.remove(LS_KEYS.cache);
  LS.remove(LS_KEYS.history);
  LS.remove(LS_KEYS.lastSnapshot);
  switchTab('live');
  document.getElementById('status').textContent = '🗑️ Semua data dihapus.';
  document.getElementById('result').innerHTML = '';
  document.getElementById('scoreResult').innerHTML =
    `<div class="info">🎯 Belum ada data skor. Jalankan <b>Scan Sekarang</b> dulu.</div>`;
}

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('tab-live').classList.toggle('active', tab === 'live');
  document.getElementById('tab-score').classList.toggle('active', tab === 'score');
  if (tab === 'score') renderScoreTable();
}

// ============================================================
// WAKTU WIB
// ============================================================
function getWIBTime() {
  const now = new Date();
  const wibMs = now.getTime() + (now.getTimezoneOffset() * 60000) + (7 * 3600000);
  return new Date(wibMs);
}

function getModeInfo() {
  const wib = getWIBTime();
  const totalMin = wib.getHours() * 60 + wib.getMinutes();
  const day = wib.getDay();

  if (day === 0 || day === 6)
    return { mode:'PRE-MARKET', label:'🌙 Weekend', css:'mode-premarket', desc:'Pasar tutup.' };
  if (totalMin < 8*60 + 45)
    return { mode:'PRE-MARKET', label:'🌅 Pre-Market', css:'mode-premarket', desc:'Sebelum pre-opening.' };
  if (totalMin < 9*60)
    return { mode:'PRE-OPENING', label:'⚠️ Pre-Opening', css:'mode-preopening', desc:'Pre-opening.' };
  if (totalMin < 9*60 + 15)
    return { mode:'OPENING', label:'🚀 Opening', css:'mode-opening', desc:'Candle 5 menit pertama.' };
  if (totalMin < 16*60)
    return { mode:'INTRADAY', label:'📊 Intraday', css:'mode-intraday', desc:'Tren penuh.' };
  return { mode:'PRE-MARKET', label:'🌆 Setelah Pasar', css:'mode-premarket', desc:'Analisis besok.' };
}

function updateClock() {
  const wib = getWIBTime();
  document.getElementById('clock').textContent = wib.toLocaleTimeString('id-ID');
  const info = getModeInfo();
  const badge = document.getElementById('modeBadge');

// ============================================================
const CORS_PROXIES = [
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://thingproxy.freeboard.io/fetch/${url}`
];

async function fetchWithFallback(url) {
  for (const makeProxy of CORS_PROXIES) {
    try {
      const res = await fetch(makeProxy(url));
      if (res.ok) return await res.json();
    } catch (e) {}
  }
  throw new Error('Semua proxy gagal');
}

async function getHistoricalData(symbol) {
  const cached = getCachedStock(symbol, 'historical');
  if (cached) return cached;

  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=5d`;
  const json = await fetchWithFallback(url);
  const r = json.chart.result?.[0];
  if (!r) return null;

  const q = r.indicators.quote[0];
  const closes = q.close.filter(v => v != null);
  const volumes = q.volume.filter(v => v != null);
  const highs = q.high.filter(v => v != null);
  const lows = q.low.filter(v => v != null);

  if (closes.length < 3) return null;

  const lastIdx = closes.length - 1;
  const last = closes[lastIdx];
  const prev = closes[lastIdx - 1];
  const dayChange = (last - prev) / prev * 100;
  const momentum3d = (last - closes[lastIdx - 2]) / closes[lastIdx - 2] * 100;

  const avgVol = volumes.slice(Math.max(0, lastIdx-3), lastIdx)
                         .reduce((a,b)=>a+b,0) / Math.min(3, lastIdx);
  const volRatio = avgVol > 0 ? volumes[lastIdx] / avgVol : 1;
  const rangePos = (last - lows[lastIdx]) / ((highs[lastIdx] - lows[lastIdx]) || 1);

  const result = {
    symbol: symbol.replace('.JK',''),
    last, prev, dayChange, momentum3d, volRatio, rangePos
  };

  setCachedStock(symbol, 'historical', result);
  return result;
}

async function getIntradayData(symbol) {
  const cached = getCachedStock(symbol, 'intraday');
  if (cached) return cached;

  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=5m&range=1d`;
  const json = await fetchWithFallback(url);
  const r = json.chart.result?.[0];
  if (!r) return null;

  const meta = r.meta;
  const quotes = r.indicators.quote[0];
  const closes = quotes.close.filter(v => v != null);
  const volumes = quotes.volume.filter(v => v != null);

  if (closes.length < 3) return null;

  const prevClose = meta.chartPreviousClose || meta.previousClose;
  const openPrice = closes[0];
  const lastPrice = closes[closes.length - 1];
  const highOfDay = Math.max(...closes);
  const lowOfDay  = Math.min(...closes);

  const volFirst = volumes[0] || 0;
  const volRest  = volumes.slice(1);
  const avgVolRest = volRest.reduce((a,b)=>a+b,0) / (volRest.length || 1);
  const volRatio = avgVolRest > 0 ? volFirst / avgVolRest : 1;

  const result = {
    symbol: symbol.replace('.JK',''),
    prevClose, openPrice, lastPrice, highOfDay, lowOfDay, volRatio,
    openingMomentum: closes.length >= 6 ? (closes[5] - closes[0]) / closes[0] * 100 : 0
  };

  setCachedStock(symbol, 'intraday', result);
  return result;
}

// SCORING
// ============================================================
function scoreHistorical(d) {
  if (!d) return null;
  let score = 0;
  if (d.momentum3d > 2) score += 25;
  else if (d.momentum3d > 0) score += 15;
  else if (d.momentum3d < -3) score -= 10;

  if (d.dayChange > 1) score += 20;
  else if (d.dayChange > 0) score += 10;
  else if (d.dayChange < -2) score -= 15;

  if (d.volRatio > 1.8) score += 20;
  else if (d.volRatio > 1.2) score += 10;

  if (d.rangePos > 0.7) score += 15;
  else if (d.rangePos < 0.3) score -= 5;

  return {
    ...d, score,
    displayChange: d.dayChange.toFixed(2),
    displayMomentum: d.momentum3d.toFixed(2),
    displayPrice: d.last
  };
}

function scoreIntraday(d) {
  if (!d || !d.prevClose) return null;
  let score = 0;

  const gapPct     = (d.openPrice - d.prevClose) / d.prevClose * 100;
  const intradayPct= (d.lastPrice - d.openPrice) / d.openPrice * 100;
  const vsPrevPct  = (d.lastPrice - d.prevClose) / d.prevClose * 100;
  const rangePos   = (d.lastPrice - d.lowOfDay) / ((d.highOfDay - d.lowOfDay) || 1);

  if (gapPct > 0.3 && gapPct < 3) score += 25;
  else if (gapPct >= 3 && gapPct < 5) score += 10;
  else if (gapPct > 5) score -= 5;
  else if (gapPct < -1) score -= 15;

  if (intradayPct > 0) score += 20;
  else if (intradayPct < -1) score -= 10;

  if (d.openingMomentum > 0.5) score += 20;
  else if (d.openingMomentum > 0) score += 10;

  if (d.volRatio > 2) score += 20;
  else if (d.volRatio > 1.3) score += 10;

  if (rangePos > 0.7) score += 15;
  else if (rangePos < 0.3) score -= 5;

  if (vsPrevPct > 1) score += 10;

  return {
    ...d, score, rangePos,
    displayGap: gapPct.toFixed(2),
    displayIntraday: intradayPct.toFixed(2),
    displayVsPrev: vsPrevPct.toFixed(2),
    displayPrice: d.lastPrice
  };
}

function buildScoreMatrix(snaps) {
  const map = new Map();   // symbol -> { [snapIndex]: result }

  snaps.forEach((snap, si) => {
    (snap.results || []).forEach(r => {
      if (!map.has(r.symbol)) map.set(r.symbol, {});
      const entry = map.get(r.symbol);
      // kalau duplikat dalam 1 snapshot, ambil skor tertinggi
      if (!entry[si] || r.score > entry[si].score) entry[si] = r;
    });
  });

  const rows = [];
  map.forEach((bySnap, symbol) => {
    const scores = snaps.map((_, i) => bySnap[i] ? bySnap[i].score : null);
    rows.push({ symbol, scores, bySnap });
  });

  // Urutkan: kolom terbaru (index 0) skor tertinggi dulu.
  // Baris yang gagal discan di snapshot terbaru (null) diletakkan di bawah,
  // lalu diurutkan lagi berdasarkan snapshot berikutnya.
  rows.sort((a, b) => {
    for (let i = 0; i < snaps.length; i++) {
      const av = a.scores[i], bv = b.scores[i];
      if (av == null && bv == null) continue;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (bv !== av) return bv - av;
    }
    return a.symbol.localeCompare(b.symbol);
  });

  return { rows };
}

// ============================================================
// EXPORT EXCEL (SpreadsheetML — mendukung banyak sheet)
// ============================================================
function xmlEsc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function sheetNameSafe(name) {
  const n = String(name).replace(/[\\\/\?\*\[\]:]/g, '-').trim();
  return (n || 'Sheet').slice(0, 31);
}

function buildWorksheet(name, rows) {
  const body = rows.map(row => {
    const cells = row.map(v => {
      if (v === null || v === undefined || v === '') return '<Cell/>';
      if (typeof v === 'number' && isFinite(v)) {
        return `<Cell><Data ss:Type="Number">${v}</Data></Cell>`;
      }
      return `<Cell><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`;
    }).join('');
    return `<Row>${cells}</Row>`;
  }).join('');
  return `<Worksheet ss:Name="${xmlEsc(sheetNameSafe(name))}"><Table>${body}</Table></Worksheet>`;
}

function downloadExcel(filename, sheets) {
  const xml =
    '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<?mso-application progid="Excel.Sheet"?>\n' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
    'xmlns:o="urn:schemas-microsoft-com:office:office" ' +
    'xmlns:x="urn:schemas-microsoft-com:office:excel" ' +
    'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" ' +
    'xmlns:html="http://www.w3.org/TR/REC-html40">' +
    sheets.map(s => buildWorksheet(s.name, s.rows)).join('') +
    '</Workbook>';

  const blob = new Blob([xml], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

  const info = [
    [],
    ['Keterangan', 'Kolom skor diurutkan dari scan TERBARU (paling kiri) ke terlama.'],
    ['Tanda kosong', 'Saham tidak berhasil discan pada snapshot tersebut.'],
    ['Jumlah kolom', snaps.length],
    ['Jumlah saham', rows.length],
    ['Diekspor', new Date().toLocaleString('id-ID')]
  ];

  downloadExcel(`screener-idx-tabel-skor-${fileStamp()}.xls`,
    [{ name: 'Tabel Skor', rows: [header, ...body, ...info] }]);
}

/* ---------- Export Riwayat (1 snapshot) ---------- */
function exportHistoryItem(idx) {
  const history = LS.get(LS_KEYS.history, []);
  const h = history[idx];
  if (!h) return;

  const header = h.isIntraday
    ? ['#','Kode','Skor','Gap %','Intraday %','vs Prev %','Vol Rasio','Posisi Range (%)','Harga']
    : ['#','Kode','Skor','3D Momentum %','Perubahan Hari Ini %','Vol Rasio','Posisi Range (%)','Harga'];

  const rows = [header];
  h.results.forEach((s, i) => {
    if (h.isIntraday) {
      rows.push([i+1, s.symbol, s.score, toNum(s.displayGap), toNum(s.displayIntraday),
                 toNum(s.displayVsPrev), r2(s.volRatio),
                 s.rangePos != null ? Math.round(s.rangePos*100) : '', s.displayPrice]);
    } else {
      rows.push([i+1, s.symbol, s.score, toNum(s.displayMomentum), toNum(s.displayChange),
                 r2(s.volRatio),
                 s.rangePos != null ? Math.round(s.rangePos*100) : '', s.displayPrice]);
    }
  });

  rows.push([]);
  rows.push(['Mode', h.mode]);
  rows.push(['Waktu scan', fmtFull(h.timestamp)]);
  rows.push(['Jumlah saham', h.count]);

  downloadExcel(`screener-idx-riwayat-${fileStamp()}.xls`,
    [{ name: `Riwayat ${fmtDateTime(h.timestamp)}`, rows }]);
}

/* ---------- Export Riwayat (semua, multi-sheet) ---------- */
function exportAllHistory() {
  const history = LS.get(LS_KEYS.history, []);
  if (!history.length) {
    alert('Belum ada riwayat untuk diekspor.');
    return;
  }

  // Sheet ringkasan
  const summaryRows = [
    ['#', 'Waktu Scan', 'Mode', 'Jumlah Saham', 'Skor Tertinggi', 'Kode Tertinggi', 'Rata-rata Skor']
  ];
  history.forEach((h, i) => {
    const sorted = [...h.results].sort((a,b) => b.score - a.score);
    const avg = h.results.length
      ? (h.results.reduce((a,b) => a + b.score, 0) / h.results.length).toFixed(1) : '-';
    summaryRows.push([
      i + 1,
      fmtFull(h.timestamp),
      h.mode,
      h.count,
      sorted[0] ? sorted[0].score : '',
      sorted[0] ? sorted[0].symbol : '',
      avg
    ]);
  });

  const sheets = [{ name: 'Ringkasan', rows: summaryRows }];

  history.forEach((h, i) => {
    const header = h.isIntraday
      ? ['#','Kode','Skor','Gap %','Intraday %','vs Prev %','Vol Rasio','Posisi Range (%)','Harga']
      : ['#','Kode','Skor','3D Momentum %','Perubahan Hari Ini %','Vol Rasio','Posisi Range (%)','Harga'];

    const rows = [header];
    const sorted = [...h.results].sort((a,b) => b.score - a.score);
    sorted.forEach((s, j) => {
      if (h.isIntraday) {
        rows.push([j+1, s.symbol, s.score, toNum(s.displayGap), toNum(s.displayIntraday),
                   toNum(s.displayVsPrev), r2(s.volRatio),
                   s.rangePos != null ? Math.round(s.rangePos*100) : '', s.displayPrice]);
      } else {
        rows.push([j+1, s.symbol, s.score, toNum(s.displayMomentum), toNum(s.displayChange),
                   r2(s.volRatio),
                   s.rangePos != null ? Math.round(s.rangePos*100) : '', s.displayPrice]);
      }
    });

    sheets.push({
      name: `${pad2(history.length - i)} ${fmtDateTime(h.timestamp)}`.replace(/[:]/g, '.'),
      rows
    });
  });

  downloadExcel(`screener-idx-semua-riwayat-${fileStamp()}.xls`, sheets);
}

// ============================================================
// SCAN UTAMA
// ============================================================
async function scanStocks() {
  if (liveState.isRunning) { alert('Scan sedang berjalan.'); return; }

  const btn = document.getElementById('scanBtn');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressCount = document.getElementById('progressCount');
  const progressSymbol = document.getElementById('progressSymbol');
  const modeInfo = getModeInfo();

  switchTab('live');

  btn.disabled = true;
  result.innerHTML = '';
  progressWrap.style.display = 'block';
  progressFill.style.width = '0%';
  progressCount.textContent = `0/${WATCHLIST.length}`;

  liveState = {
    scored: [],
    isIntraday: (modeInfo.mode === 'OPENING' || modeInfo.mode === 'INTRADAY'),
    mode: modeInfo.mode,
    total: WATCHLIST.length,
    done: 0,
    isRunning: true,
    isSnapshot: false
  };

  const removed = cleanExpiredCache();
  if (removed > 0) {
    result.innerHTML = `<div class="info">🧹 ${removed} entri cache kadaluarsa dibersihkan.</div>`;
  }

  const isIntraday = liveState.isIntraday;
  let failedCount = 0;

  for (let i = 0; i < WATCHLIST.length; i++) {
    const sym = WATCHLIST[i];
    progressSymbol.textContent = sym.replace('.JK','');

    try {
      const data = isIntraday
        ? await getIntradayData(sym)
        : await getHistoricalData(sym);

      const s = isIntraday ? scoreIntraday(data) : scoreHistorical(data);
      if (s) {
        s._isNew = true;
        liveState.scored.push(s);
      } else {
        failedCount++;
      }
    } catch (e) { failedCount++; }

    liveState.done = i + 1;
    const pct = (liveState.done / liveState.total) * 100;
    progressFill.style.width = pct + '%';
    progressCount.textContent = `${liveState.done}/${liveState.total} (berhasil: ${liveState.scored.length}, gagal: ${failedCount})`;

    if (liveState.scored.length > 0) renderLiveTable();

    if (i < WATCHLIST.length - 1) {
      await new Promise(r => setTimeout(r, CONFIG.minDelayMs));
    }
  }

  liveState.isRunning = false;
  liveState.isSnapshot = false;
  renderLiveTable();

  // Simpan snapshot ke riwayat & refresh tabel skor (tab 2)
  const sorted = [...liveState.scored].sort((a,b) => b.score - a.score);
  saveToHistory(modeInfo.mode, sorted, isIntraday);
  renderScoreTable();

  const wib = getWIBTime();
  status.textContent = `✅ Selesai. ${liveState.scored.length} berhasil, ${failedCount} gagal, dari ${WATCHLIST.length} saham. Waktu: ${wib.toLocaleTimeString('id-ID')} — cek tab 🎯 Tabel Skor untuk perbandingan antar scan.`;
  progressWrap.style.display = 'none';

  if (failedCount > 0) {
    const infoDiv = document.createElement('div');
    infoDiv.className = 'info';
    infoDiv.innerHTML = `
      <b>ℹ️ Kenapa ${failedCount} saham gagal?</b><br>
      • Proxy CORS timeout atau diblokir sementara<br>
      • Yahoo tidak punya data lengkap untuk saham itu<br>
      • Data candle kurang dari 3 baris (saham tidak aktif)<br><br>
      <i>Saham yang gagal otomatis dilewati. Di <b>Tabel Skor</b>, baris saham ini tetap muncul
      dengan tanda "–" pada kolom scan terbaru, sehingga riwayat skornya tidak hilang.</i>
    `;
    result.appendChild(infoDiv);
  }

  const noteDiv = document.createElement('div');
  noteDiv.className = 'note';
  noteDiv.innerHTML = `
    <b>📖 Panduan kolom:</b><br>
    • <b>Skor</b>: total bobot momentum + volume + posisi range.<br>
    • <b>3D Mom %</b>: perubahan harga dari 3 hari lalu.<br>
    • <b>Hari Ini %</b>: perubahan harga kemarin → terakhir.<br>
    • <b>Vol Rasio</b>: volume ÷ rata-rata 3 hari (>1.5x = minat besar).<br>
    • <b>Posisi Range</b>: posisi close di high-low (100% = di high).<br><br>
    <b>🎯 Tab Tabel Skor:</b> menampilkan matriks skor lintas scan. Kolom paling kiri adalah
    scan terbaru; klik angka skor untuk melihat detail lengkap saham tersebut.<br><br>
    <b>⚠️ Catatan:</b> Skor bukan jaminan profit. Pasang stop-loss 1–2%. Data Yahoo delay ±15 menit.
  `;
  result.appendChild(noteDiv);

  btn.disabled = false;
}
