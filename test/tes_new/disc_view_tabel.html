<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Tes DISC</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --D:#c0392b; --I:#e67e22; --S:#27ae60; --C:#2980b9;
            --dark:#1a1a2e; --mid:#2c2c54; --light:#f4f4f8; --white:#fff;
            --radius:16px; --shadow:0 8px 32px rgba(0,0,0,.10);
            --pos:#1e8449; --pos-light:#e8f8f0;
            --neg:#c0392b; --neg-light:#fdeaea;
            --tip:#5b2d8e; --tip-light:#f0eaff;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:var(--light);min-height:100vh;}

        /* LOADING */
        #loadingScreen{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s;}
        .spinner{width:56px;height:56px;border:4px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;}
        @keyframes spin{to{transform:rotate(360deg);}}
        #loadingScreen p{color:rgba(255,255,255,.7);font-size:.95em;letter-spacing:.05em;}

        /* LAYOUT */
        .page{max-width:900px;margin:0 auto;padding:32px 16px 60px;}

        /* HERO */
        .hero{background:var(--dark);border-radius:var(--radius);padding:48px 40px 40px;margin-bottom:24px;position:relative;overflow:hidden;color:white;}
        .hero::before{content:'DISC';position:absolute;right:-20px;top:-20px;font-family:'Playfair Display',serif;font-size:160px;font-weight:900;color:rgba(255,255,255,.04);line-height:1;pointer-events:none;}
        .hero-label{font-size:.75em;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px;}
        .hero h1{font-family:'Playfair Display',serif;font-size:2.2em;line-height:1.1;margin-bottom:6px;}
        .hero-sub{color:rgba(255,255,255,.6);font-size:.95em;}

        /* PROFILE CARD */
        .profile-card{background:var(--white);border-radius:var(--radius);padding:28px 32px;margin-bottom:24px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;}
        .profile-item .lbl{font-size:.72em;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#aaa;margin-bottom:4px;}
        .profile-item .val{font-size:1.05em;font-weight:500;color:var(--dark);}

        /* OUTER TABS */
        .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
        .tab-btn{padding:9px 22px;border:2px solid #e0e0e0;background:white;border-radius:99px;font-family:'DM Sans',sans-serif;font-size:.88em;font-weight:600;cursor:pointer;transition:.2s;color:#888;}
        .tab-btn.active{background:var(--dark);border-color:var(--dark);color:white;}

        /* DISC PANEL */
        .disc-panel{background:var(--white);border-radius:var(--radius);padding:32px;margin-bottom:24px;box-shadow:var(--shadow);display:none;}
        .disc-panel.active{display:block;}
        .panel-title{font-family:'Playfair Display',serif;font-size:1.4em;color:var(--dark);margin-bottom:8px;display:flex;align-items:center;gap:10px;}
        .panel-title .badge{font-size:.55em;background:var(--light);border-radius:99px;padding:4px 14px;color:#888;font-family:'DM Sans',sans-serif;font-weight:600;letter-spacing:.05em;text-transform:uppercase;}
        .panel-sub{color:#888;font-size:.88em;margin-bottom:20px;}

        /* INNER TABS */
        .inner-tabs{display:flex;gap:8px;margin-bottom:20px;}
        .inner-tab-btn{padding:7px 18px;border:2px solid #e0e0e0;background:white;border-radius:99px;font-family:'DM Sans',sans-serif;font-size:.83em;font-weight:600;cursor:pointer;transition:.2s;color:#888;}
        .inner-tab-btn.pos-active{background:var(--pos-light);border-color:var(--pos);color:var(--pos);}
        .inner-tab-btn.neg-active{background:var(--neg-light);border-color:var(--neg);color:var(--neg);}
        .inner-panel{display:none;}
        .inner-panel.active{display:block;}

        /* DISC BARS */
        .disc-bars{display:flex;flex-direction:column;gap:24px;}
        .disc-row{display:flex;flex-direction:column;gap:6px;}
        .disc-row-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
        .disc-name{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95em;color:var(--dark);}
        .disc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
        .disc-score-badge{font-size:.78em;font-weight:700;padding:3px 12px;border-radius:99px;letter-spacing:.03em;white-space:nowrap;}
        .score-pos{background:#e8f8f0;color:#1e8449;}
        .score-neg{background:#fdeaea;color:#c0392b;}
        .score-neu{background:#f0f0f0;color:#888;}
        .bar-track{height:12px;background:#f0f0f0;border-radius:99px;overflow:hidden;}
        .bar-fill{height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(.4,0,.2,1);}
        .disc-desc{font-size:.83em;color:#666;line-height:1.6;margin-top:2px;font-style:italic;}

        /* DETAIL CARD */
        .detail-card{border-radius:12px;padding:20px 22px;margin-top:12px;border-left:4px solid;animation:fadeIn .3s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
        .detail-card-title{font-size:.75em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:6px;}

        /* POSITIVE CARD: kelebihan full width, saran below */
        .detail-section-label{font-size:.73em;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
        .detail-list{list-style:none;margin-bottom:14px;}
        .detail-list li{font-size:.83em;color:#333;padding:5px 0 5px 18px;position:relative;border-bottom:1px solid rgba(0,0,0,.05);line-height:1.55;}
        .detail-list li:last-child{border-bottom:none;}
        .detail-list li::before{content:'•';position:absolute;left:4px;font-weight:900;}
        .detail-list.neg-list li{color:#7b1a1a;}
        .detail-list.neg-list li::before{color:#c0392b;}

        .tip-box{background:var(--tip-light);border-radius:9px;padding:14px 16px;margin-top:4px;}
        .tip-box .detail-section-label{color:var(--tip);}
        .tip-list{list-style:none;}
        .tip-list li{font-size:.83em;color:#3d1a6e;padding:5px 0 5px 20px;position:relative;border-bottom:1px solid rgba(91,45,142,.08);line-height:1.55;}
        .tip-list li:last-child{border-bottom:none;}
        .tip-list li::before{content:'✦';position:absolute;left:2px;font-size:.68em;color:var(--tip);top:6px;}

        /* NEUTRAL */
        .neutral-notice{background:#f8f8f8;border-radius:12px;padding:16px 18px;border-left:4px solid #ccc;font-size:.85em;color:#888;line-height:1.6;margin-bottom:10px;}

        /* EMPTY */
        .empty-state{text-align:center;padding:32px 20px;background:#f9f9f9;border-radius:12px;color:#aaa;font-size:.88em;}
        .empty-state .emoji{font-size:2em;margin-bottom:8px;}

        /* RADAR */
        .chart-wrap{background:var(--white);border-radius:var(--radius);padding:32px;margin-bottom:24px;box-shadow:var(--shadow);}
        .chart-wrap h2{font-family:'Playfair Display',serif;font-size:1.3em;color:var(--dark);margin-bottom:20px;}
        .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .chart-box{position:relative;height:220px;}
        .chart-label{text-align:center;font-size:.8em;color:#888;font-weight:600;margin-top:6px;text-transform:uppercase;letter-spacing:.05em;}

        /* SUMMARY */
        .summary-wrap{background:var(--dark);border-radius:var(--radius);padding:32px;margin-bottom:24px;box-shadow:var(--shadow);color:white;}
        .summary-wrap h2{font-family:'Playfair Display',serif;font-size:1.3em;margin-bottom:20px;opacity:.9;}
        .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
        .summary-col{background:rgba(255,255,255,.07);border-radius:12px;padding:18px;}
        .summary-col h3{font-size:.75em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;opacity:.6;}
        .summary-col ul{list-style:none;}
        .summary-col li{font-size:.83em;padding:5px 0 5px 18px;position:relative;border-bottom:1px solid rgba(255,255,255,.06);line-height:1.5;opacity:.85;}
        .summary-col li:last-child{border-bottom:none;}
        .summary-col li::before{content:'→';position:absolute;left:0;opacity:.5;}

        /* BUTTONS */
        .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;}
        .btn{padding:14px 24px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.95em;font-weight:600;cursor:pointer;transition:.2s;}
        .btn-dark{background:var(--dark);color:white;}
        .btn-dark:hover{background:var(--mid);transform:translateY(-2px);}
        .btn-outline{background:white;color:var(--dark);border:2px solid var(--dark);}
        .btn-outline:hover{background:var(--dark);color:white;transform:translateY(-2px);}

        /* ERROR */
        .error-box{text-align:center;padding:80px 40px;background:white;border-radius:var(--radius);box-shadow:var(--shadow);}
        .error-box h2{font-family:'Playfair Display',serif;font-size:1.8em;color:#c0392b;margin-bottom:10px;}
        .error-box p{color:#888;}

        /* DISC SUMMARY TABLE */
        .disc-table-wrap{background:var(--white);border-radius:var(--radius);padding:28px 32px;margin-bottom:24px;box-shadow:var(--shadow);overflow-x:auto;}
        .disc-table-wrap h2{font-family:'Playfair Display',serif;font-size:1.3em;color:var(--dark);margin-bottom:6px;}
        .disc-table-wrap .sub{font-size:.82em;color:#999;margin-bottom:18px;}
        .disc-tbl{width:100%;border-collapse:collapse;min-width:560px;}
        .disc-tbl th,.disc-tbl td{text-align:center;padding:0;font-size:.8em;}
        /* section header rows */
        .disc-tbl .sec-hdr td{background:var(--dark);color:white;font-family:'Playfair Display',serif;font-size:.88em;font-weight:700;letter-spacing:.05em;padding:8px 12px;text-align:left;}
        /* scale header */
        .disc-tbl .scale-hdr th{background:#f0f0f4;color:#888;font-size:.72em;font-weight:700;letter-spacing:.06em;padding:6px 4px;border-bottom:2px solid #e0e0e0;}
        .disc-tbl .scale-hdr th.label-col{text-align:left;padding-left:12px;min-width:90px;}
        .disc-tbl .scale-hdr th.neg-col{color:#c0392b;}
        .disc-tbl .scale-hdr th.pos-col{color:#1e8449;}
        .disc-tbl .scale-hdr th.mid-col{background:#e8e8ef;}
        /* data rows */
        .disc-tbl .disc-data-row td{border-bottom:1px solid #f0f0f0;height:36px;padding:0 4px;}
        .disc-tbl .disc-data-row:last-child td{border-bottom:none;}
        .disc-tbl .disc-data-row .label-col{text-align:left;padding-left:12px;font-weight:700;font-size:.83em;}
        /* cells */
        .disc-cell{width:42px;min-width:36px;position:relative;}
        .disc-cell-inner{width:28px;height:28px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78em;}
        .disc-cell-active{color:white;}
        .disc-cell-empty{background:#f5f5f5;color:#ccc;font-size:.7em;}
        /* zero line */
        .zero-col{background:#f7f7fb;border-left:2px solid #c8c8e0;border-right:2px solid #c8c8e0;}
        /* section spacer */
        .disc-tbl .sec-spacer td{height:8px;background:var(--light);}

        @media print{body{background:white;}.btn-row{display:none;}#loadingScreen{display:none;}}
        @media(max-width:600px){
            .hero{padding:32px 24px;}.hero h1{font-size:1.6em;}
            .chart-grid{grid-template-columns:1fr;}
            .btn-row{grid-template-columns:1fr;}
            .profile-card{padding:20px;}
            .disc-panel{padding:20px 16px;}
        }
    </style>
</head>
<body>
<div id="loadingScreen"><div class="spinner"></div><p>Memuat hasil analisis DISC...</p></div>
<div class="page" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════
// TABEL WARNA
// ═══════════════════════════════════════════════════════
const TABEL=[
    [1,'A','KUNING','KUNING'],[1,'B','HIJAU','HIJAU'],[1,'C','PUTIH','MERAH'],[1,'D','BIRU','BIRU'],
    [2,'A','MERAH','MERAH'],[2,'B','BIRU','BIRU'],[2,'C','PUTIH','HIJAU'],[2,'D','PUTIH','KUNING'],
    [3,'A','PUTIH','BIRU'],[3,'B','MERAH','MERAH'],[3,'C','KUNING','KUNING'],[3,'D','HIJAU','PUTIH'],
    [4,'A','BIRU','PUTIH'],[4,'B','MERAH','MERAH'],[4,'C','PUTIH','HIJAU'],[4,'D','KUNING','KUNING'],
    [5,'A','PUTIH','BIRU'],[5,'B','MERAH','MERAH'],[5,'C','KUNING','KUNING'],[5,'D','HIJAU','PUTIH'],
    [6,'A','MERAH','MERAH'],[6,'B','PUTIH','HIJAU'],[6,'C','PUTIH','KUNING'],[6,'D','BIRU','PUTIH'],
    [7,'A','HIJAU','HIJAU'],[7,'B','PUTIH','BIRU'],[7,'C','PUTIH','KUNING'],[7,'D','MERAH','PUTIH'],
    [8,'A','KUNING','PUTIH'],[8,'B','PUTIH','HIJAU'],[8,'C','MERAH','MERAH'],[8,'D','BIRU','BIRU'],
    [9,'A','MERAH','MERAH'],[9,'B','KUNING','PUTIH'],[9,'C','HIJAU','HIJAU'],[9,'D','PUTIH','BIRU'],
    [10,'A','BIRU','BIRU'],[10,'B','KUNING','KUNING'],[10,'C','PUTIH','HIJAU'],[10,'D','MERAH','MERAH'],
    [11,'A','PUTIH','KUNING'],[11,'B','BIRU','PUTIH'],[11,'C','HIJAU','HIJAU'],[11,'D','MERAH','MERAH'],
    [12,'A','MERAH','PUTIH'],[12,'B','KUNING','KUNING'],[12,'C','HIJAU','HIJAU'],[12,'D','BIRU','PUTIH'],
    [13,'A','HIJAU','PUTIH'],[13,'B','MERAH','MERAH'],[13,'C','KUNING','KUNING'],[13,'D','PUTIH','BIRU'],
    [14,'A','MERAH','MERAH'],[14,'B','KUNING','PUTIH'],[14,'C','HIJAU','PUTIH'],[14,'D','PUTIH','BIRU'],
    [15,'A','KUNING','KUNING'],[15,'B','MERAH','MERAH'],[15,'C','HIJAU','HIJAU'],[15,'D','PUTIH','PUTIH'],
    [16,'A','BIRU','PUTIH'],[16,'B','MERAH','MERAH'],[16,'C','HIJAU','HIJAU'],[16,'D','KUNING','KUNING'],
    [17,'A','BIRU','BIRU'],[17,'B','HIJAU','HIJAU'],[17,'C','KUNING','PUTIH'],[17,'D','MERAH','MERAH'],
    [18,'A','KUNING','KUNING'],[18,'B','PUTIH','HIJAU'],[18,'C','MERAH','MERAH'],[18,'D','BIRU','BIRU'],
    [19,'A','KUNING','PUTIH'],[19,'B','HIJAU','HIJAU'],[19,'C','PUTIH','BIRU'],[19,'D','PUTIH','MERAH'],
    [20,'A','KUNING','KUNING'],[20,'B','BIRU','PUTIH'],[20,'C','HIJAU','HIJAU'],[20,'D','MERAH','MERAH'],
    [21,'A','PUTIH','MERAH'],[21,'B','HIJAU','PUTIH'],[21,'C','KUNING','KUNING'],[21,'D','PUTIH','BIRU'],
    [22,'A','HIJAU','HIJAU'],[22,'B','KUNING','KUNING'],[22,'C','BIRU','BIRU'],[22,'D','MERAH','MERAH'],
    [23,'A','PUTIH','MERAH'],[23,'B','BIRU','PUTIH'],[23,'C','HIJAU','HIJAU'],[23,'D','KUNING','KUNING'],
    [24,'A','PUTIH','KUNING'],[24,'B','HIJAU','HIJAU'],[24,'C','MERAH','PUTIH'],[24,'D','BIRU','PUTIH'],
];

// ═══════════════════════════════════════════════════════
// KALKULASI
// ═══════════════════════════════════════════════════════
function hitungWarna(arr){const c={MERAH:0,HIJAU:0,KUNING:0,BIRU:0,PUTIH:0};arr.forEach(w=>{if(c[w]!==undefined)c[w]++;});return c;}
function skorD1(v){if(v>=15&&v<=21)return 8;if(v>=13&&v<=14)return 6;if(v>=9&&v<=12)return 4;if(v>=7&&v<=8)return 2;if(v==3)return -4;if(v>=1&&v<=2)return -6;return -8;}
function skorI1(v){if(v>=9&&v<=19)return 8;if(v>=7&&v<=8)return 6;if(v>=5&&v<=6)return 4;if(v==4)return 2;if(v==3)return -2;if(v==2)return -4;if(v==1)return -6;return -8;}
function skorS1(v){if(v>=14&&v<=20)return 8;if(v>=10&&v<=12)return 6;if(v>=7&&v<=9)return 4;if(v>=5&&v<=6)return 2;if(v>=3&&v<=4)return -2;if(v==2)return -4;if(v>=0&&v<=1)return -6;return -8;}
function skorC1(v){if(v>=11&&v<=17)return 8;if(v>=7&&v<=9)return 6;if(v>=5&&v<=6)return 4;if(v==4)return 2;if(v==3)return -2;if(v==2)return -4;if(v==1)return -6;return -8;}
function skorD2(v){if(v>=0&&v<=1)return 8;if(v==2)return 6;if(v==3)return 4;if(v>=4&&v<=5)return 2;if(v>=6&&v<=8)return -2;if(v>=9&&v<=11)return -4;if(v>=12&&v<=14)return -6;return -8;}
function skorI2(v){if(v==0)return 8;if(v==1)return 6;if(v>=2&&v<=3)return 4;if(v==4)return 2;if(v==5)return -2;if(v>=6&&v<=7)return -4;if(v>=8&&v<=9)return -6;return -8;}
function skorS2(v){if(v>=0&&v<=1)return 8;if(v==2)return 6;if(v>=3&&v<=4)return 4;if(v>=5&&v<=6)return 2;if(v==7)return -2;if(v>=8&&v<=9)return -4;if(v>=10&&v<=11)return -6;return -8;}
function skorC2(v){if(v>=0&&v<=1)return 8;if(v==2)return 6;if(v>=3&&v<=4)return 4;if(v>=5&&v<=6)return 2;if(v>=7&&v<=8)return -2;if(v>=9&&v<=10)return -4;if(v>=11&&v<=12)return -6;return -8;}
function skorD3(v){if(v>=15&&v<=21)return 8;if(v>=10&&v<=14)return 6;if(v>=7&&v<=9)return 4;if(v>=1&&v<=5)return 2;if(v>=-4&&v<=0)return -2;if(v>=-9&&v<=-6)return -4;if(v>=-12&&v<=-10)return -6;return -8;}
function skorI3(v){if(v>=8&&v<=18)return 8;if(v>=5&&v<=7)return 6;if(v>=3&&v<=4)return 4;if(v>=0&&v<=2)return 2;if(v>=-2&&v<=-1)return -2;if(v>=-5&&v<=-3)return -4;if(v>=-8&&v<=-6)return -6;return -8;}
function skorS3(v){if(v>=11&&v<=20)return 8;if(v>=7&&v<=10)return 6;if(v>=3&&v<=6)return 4;if(v>=0&&v<=2)return 2;if(v>=-4&&v<=-1)return -2;if(v>=-7&&v<=-5)return -4;if(v==-8)return -6;return -8;}
function skorC3(v){if(v>=6&&v<=17)return 8;if(v>=3&&v<=5)return 6;if(v>=1&&v<=2)return 4;if(v>=-2&&v<=0)return 2;if(v>=-4&&v<=-3)return -2;if(v>=-7&&v<=-5)return -4;if(v>=-10&&v<=-8)return -6;return -8;}

function hitungDISC(jawabanStr){
    const discStr='_;'+jawabanStr;
    const parts=discStr.split(';').map(s=>s.trim());
    const jawaban=parts.map(p=>p.split('_').map(s=>s.trim()));
    const hasilA=[],hasilB=[];
    for(let i=1;i<jawaban.length;i++){
        const soal=i,jwA=jawaban[i][0],jwB=jawaban[i][1];
        if(!jwA||!jwB) continue;
        const rowA=TABEL.find(r=>r[0]===soal&&r[1]===jwA);
        const rowB=TABEL.find(r=>r[0]===soal&&r[1]===jwB);
        if(rowA) hasilA.push(rowA[2]);
        if(rowB) hasilB.push(rowB[3]);
    }
    const cA=hitungWarna(hasilA),cB=hitungWarna(hasilB);
    const selisih={MERAH:cA.MERAH-cB.MERAH,HIJAU:cA.HIJAU-cB.HIJAU,KUNING:cA.KUNING-cB.KUNING,BIRU:cA.BIRU-cB.BIRU};
    return{
        public: {D:skorD1(cA.MERAH),I:skorI1(cA.HIJAU),S:skorS1(cA.KUNING),C:skorC1(cA.BIRU)},
        private:{D:skorD2(cB.MERAH),I:skorI2(cB.HIJAU),S:skorS2(cB.KUNING),C:skorC2(cB.BIRU)},
        perceived:{D:skorD3(selisih.MERAH),I:skorI3(selisih.HIJAU),S:skorS3(selisih.KUNING),C:skorC3(selisih.BIRU)},
        raw:{cA,cB,selisih}
    };
}

// ═══════════════════════════════════════════════════════
// META
// ═══════════════════════════════════════════════════════
const DISC_META={
    D:{name:'Dominance',label:'D — Dominance',color:'#c0392b',light:'#fdeaea',icon:'⚡',desc:'Berorientasi hasil, pengambil keputusan cepat, penuh percaya diri.'},
    I:{name:'Influence', label:'I — Influence', color:'#e67e22',light:'#fef5ec',icon:'🌟',desc:'Komunikatif, antusias, mampu mempengaruhi orang lain secara positif.'},
    S:{name:'Steadiness',label:'S — Steadiness',color:'#27ae60',light:'#eafaf1',icon:'🌿',desc:'Sabar, konsisten, penyeimbang dalam tim.'},

let charts=[];

function getScaleData(k,v){
    const entry=DISC_SCALE[k][v];
    if(!entry) return null;
    return entry;
}

function renderDetailCardPos(k,v){
    const m=DISC_META[k];
    const d=getScaleData(k,v);
    if(!d) return '';
    const kelebihan=d.kelebihan||[];
    const saran=d.saran||[];
    return `
    <div class="detail-card" style="background:${m.light};border-left-color:${m.color}">
        <div class="detail-card-title" style="color:${m.color}">💪 Kelebihan pada skala +${v}</div>
        <div class="detail-section-label" style="color:#1e8449">✅ Kelebihan</div>
        <ul class="detail-list">${kelebihan.map(x=>`<li>${x}</li>`).join('')}</ul>
        <div class="tip-box">
            <div class="detail-section-label">🚀 Saran Pengembangan Diri</div>
            <ul class="tip-list">${saran.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>
    </div>`;
}

function renderDetailCardNeg(k,v){
    const m=DISC_META[k];
    const d=getScaleData(k,v);
    if(!d) return '';
    const perhatian=d.perhatian||[];
    const saran=d.saran||[];
    return `
    <div class="detail-card" style="background:#fff8f8;border-left-color:#e74c3c">
        <div class="detail-card-title" style="color:#c0392b">⚠️ Area Perhatian pada skala ${v}</div>
        <div class="detail-section-label" style="color:#c0392b">⚡ Hal-hal yang perlu diperhatikan</div>

        <div class="tip-box">
            <div class="detail-section-label">🚀 Saran Pengembangan Diri</div>
            <ul class="tip-list">${saran.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>
    </div>`;
}

function renderBarPanel(scores,panelId){
    const keys=['D','I','S','C'];
    const maxAbs=8;
    const posKeys=keys.filter(k=>scores[k]>0);
    const negKeys=keys.filter(k=>scores[k]<0);
    const neuKeys=keys.filter(k=>scores[k]===0);

    function barRow(k,isPos){
        const v=scores[k],m=DISC_META[k];
        const pct=Math.abs(v)/maxAbs*100;
        const badgeCls=v>0?'score-pos':v<0?'score-neg':'score-neu';
        const label=v>0?`+${v}`:v<0?`${v}`:'Netral';
        const card=isPos?renderDetailCardPos(k,v):renderDetailCardNeg(k,v);
        return `
        <div class="disc-row">
            <div class="disc-row-head">
                <span class="disc-name">
                    <span class="disc-dot" style="background:${m.color}"></span>
                    ${m.label}
                </span>
                <span class="disc-score-badge ${badgeCls}">Skala ${label}</span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${m.color}"></div></div>
            <div class="disc-desc">${DESC[k][String(v)]||''}</div>
            ${card}
        </div>`;
    }

    const posHtml=posKeys.length>0
        ?`<div class="disc-bars">${posKeys.map(k=>barRow(k,true)).join('')}</div>`
        :`<div class="empty-state"><div class="emoji">🔍</div><p>Tidak ada dimensi positif yang menonjol pada panel ini.</p></div>`;

    const negHtml=negKeys.length>0
        ?`<div class="disc-bars">${negKeys.map(k=>barRow(k,false)).join('')}</div>`
        :`<div class="empty-state"><div class="emoji">✨</div><p>Tidak ada dimensi negatif — semua dimensi berada di rentang positif atau netral.</p></div>`;

    const neuHtml=neuKeys.length>0
        ?`<div class="neutral-notice">📋 Dimensi <b>${neuKeys.join(', ')}</b> berada pada posisi <b>Netral (0)</b> — keseimbangan antara kecenderungan positif dan negatif pada aspek ini.</div>`
        :'';

    return `
    <div class="inner-tabs">
        <button class="inner-tab-btn pos-active" id="btn-pos-${panelId}" onclick="switchInner('${panelId}','pos')">🟢 Positif (${posKeys.length})</button>
        <button class="inner-tab-btn" id="btn-neg-${panelId}" onclick="switchInner('${panelId}','neg')">🔴 Negatif (${negKeys.length})</button>
    </div>
    ${neuHtml}
    <div class="inner-panel active" id="inner-pos-${panelId}">${posHtml}</div>
    <div class="inner-panel" id="inner-neg-${panelId}">${negHtml}</div>`;
}

function switchInner(panelId,which){
    const posBtn=document.getElementById(`btn-pos-${panelId}`);
    const negBtn=document.getElementById(`btn-neg-${panelId}`);
    const posPanel=document.getElementById(`inner-pos-${panelId}`);
    const negPanel=document.getElementById(`inner-neg-${panelId}`);
    if(which==='pos'){
        posBtn.classList.add('pos-active');negBtn.classList.remove('neg-active');
        posPanel.classList.add('active');negPanel.classList.remove('active');
    }else{
        negBtn.classList.add('neg-active');posBtn.classList.remove('pos-active');
        negPanel.classList.add('active');posPanel.classList.remove('active');
    }
}

function renderCharts(result){
    charts.forEach(c=>c.destroy());charts=[];
    [{id:'chartPublic',scores:result.public},{id:'chartPrivate',scores:result.private}].forEach(({id,scores})=>{
        const el=document.getElementById(id);if(!el)return;
        charts.push(new Chart(el.getContext('2d'),{
            type:'radar',
            data:{labels:['D','I','S','C'],datasets:[{data:['D','I','S','C'].map(k=>Math.max(scores[k],0)),backgroundColor:'rgba(26,26,46,0.1)',borderColor:'#1a1a2e',borderWidth:2,pointBackgroundColor:['#c0392b','#e67e22','#27ae60','#2980b9'],pointRadius:5}]},
            options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:0,max:8,ticks:{stepSize:2,display:false},grid:{color:'rgba(0,0,0,.08)'},pointLabels:{font:{size:14,weight:'bold'},color:'#333'}}},plugins:{legend:{display:false}}}
        }));
    });
}

function switchTab(tab){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    document.querySelectorAll('.disc-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));
}

function dominanLabel(scores){
    const pos=Object.entries(scores).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
    if(!pos.length) return 'Seimbang';
    return pos.slice(0,2).map(([k])=>DISC_META[k].name).join(' / ');
}

function buildDiscTable(result){
    const scales=[-8,-6,-4,-2,2,4,6,8];
    const sections=[
        {key:'public',   label:'🌐 Public Self',    badge:'Tampak ke Orang Lain'},
        {key:'private',  label:'🔒 Private Self',   badge:'Diri Sebenarnya'},
        {key:'perceived',label:'🔮 Perceived Self', badge:'Persepsi Diri Total'},
    ];
    const COLORS={D:'#c0392b',I:'#e67e22',S:'#27ae60',C:'#2980b9'};

    function scaleHeader(){
        const cols=scales.map(s=>{
            const cls=s<0?'neg-col':'pos-col';
            const mid=(s===-2||s===2)?'mid-col':'';
            return `<th class="disc-cell ${cls} ${mid}">${s>0?'+'+s:s}</th>`;
        }).join('');
        return `<tr class="scale-hdr"><th class="label-col">Dimensi</th>${cols}</tr>`;
    }

    function dataRow(dimKey,scores){
        const val=scores[dimKey];
        const color=COLORS[dimKey];
        const meta=DISC_META[dimKey];
        const cells=scales.map(s=>{
            const mid=(s===-2||s===2)?'zero-col':'';
            // filled if between 0 and val (exclusive 0, inclusive val)
            const filled = val>0 ? (s>0 && s<=val) : val<0 ? (s<0 && s>=val) : false;
            const isEnd = s===val;
            if(filled){
                const label = isEnd ? (s>0?'+'+s:String(s)) : '';
                return `<td class="disc-cell ${mid}"><div class="disc-cell-inner disc-cell-active" style="background:${color}">${label}</div></td>`;
            }
            return `<td class="disc-cell ${mid}"><div class="disc-cell-inner disc-cell-empty">·</div></td>`;
        }).join('');
        return `<tr class="disc-data-row">
            <td class="label-col"><span style="color:${color}">${meta.icon} ${dimKey}</span> <span style="font-size:.7em;color:#aaa;font-weight:400">${meta.name}</span></td>
            ${cells}
        </tr>`;
    }

    let html=`
    <div class="disc-table-wrap">
        <h2>📊 Ringkasan Skor DISC</h2>
        <p class="sub">Nilai aktif ditampilkan dalam lingkaran berwarna · Negatif = area perhatian · Positif = kekuatan</p>
        <table class="disc-tbl">`;

    sections.forEach((sec,idx)=>{
        if(idx>0) html+=`<tr class="sec-spacer"><td colspan="9"></td></tr>`;
        html+=`<tr class="sec-hdr"><td colspan="9">${sec.label} <span style="font-size:.75em;opacity:.6;font-family:'DM Sans',sans-serif;font-weight:400">— ${sec.badge}</span></td></tr>`;
        html+=scaleHeader();
        ['D','I','S','C'].forEach(k=>{ html+=dataRow(k,result[sec.key]); });
    });

    html+=`</table></div>`;
    return html;
}

function buildSummary(result){
    const panels=['public','private','perceived'];
    const strengths=new Set(),challenges=new Set(),tips=new Set();
    panels.forEach(p=>{
        ['D','I','S','C'].forEach(k=>{
            const v=result[p][k];
            const d=getScaleData(k,v);
            if(!d) return;
            if(v>0){
                (d.kelebihan||[]).slice(0,2).forEach(s=>strengths.add(s));
                (d.saran||[]).slice(0,1).forEach(s=>tips.add(s));
            }else if(v<0){
                (d.perhatian||[]).slice(0,2).forEach(s=>challenges.add(s));
                (d.saran||[]).slice(0,1).forEach(s=>tips.add(s));
            }
        });
    });
    const sl=[...strengths].slice(0,5).map(s=>`<li>${s}</li>`).join('');
    const cl=[...challenges].slice(0,5).map(s=>`<li>${s}</li>`).join('');
    const tl=[...tips].slice(0,5).map(s=>`<li>${s}</li>`).join('');
    return `
    <div class="summary-wrap">
        <h2>📋 Ringkasan Profil Keseluruhan</h2>
        <div class="summary-grid">
            <div class="summary-col"><h3>💪 Kekuatan Utama</h3><ul>${sl||'<li>—</li>'}</ul></div>
            <div class="summary-col"><h3>⚠️ Area Pengembangan</h3><ul>${cl||'<li>Semua dimensi tampak positif</li>'}</ul></div>
            <div class="summary-col"><h3>🚀 Prioritas Pengembangan</h3><ul>${tl||'<li>Pertahankan keseimbangan yang ada</li>'}</ul></div>
        </div>
    </div>`;
}

    const discKey=x07['who_disc']!==undefined?'who_disc':(Object.keys(x07).find(k=>k.includes('disc'))||'');
    const jawabanStr=discKey?x07[discKey]:'';
    if(!jawabanStr||!jawabanStr.trim().includes('_')){
        document.getElementById('app').innerHTML=`<div class="error-box"><h2>⚠️ Data Belum Tersedia</h2><p>Peserta ini belum menyelesaikan Tes Kepribadian DISC.</p></div>`;
        return;
    }
    const result=hitungDISC(jawabanStr);
    const domPub=dominanLabel(result.public);
    const domPri=dominanLabel(result.private);
    const domPer=dominanLabel(result.perceived);

    document.getElementById('app').innerHTML=`

        <h1>Tes Kepribadian DISC</h1>
        <p class="hero-sub">Analisis gaya perilaku berdasarkan metode DISC — lengkap dengan kelebihan, area perhatian, dan saran pengembangan diri per skala</p>

    <div class="profile-card">
        <div class="profile-item"><div class="lbl">Nama</div><div class="val">${bio.nama||'—'}</div></div>

        <div class="profile-item"><div class="lbl">Pendidikan</div><div class="val">${bio.pendidikan||'—'}</div></div>
        <div class="profile-item"><div class="lbl">Tanggal Tes</div><div class="val">${bio.tgl_tes||'—'}</div></div>
    </div>
    ${buildDiscTable(result)}
    <div class="tabs">
        <button class="tab-btn active" data-tab="public"    onclick="switchTab('public')">🌐 Public Self</button>
        <button class="tab-btn"        data-tab="private"   onclick="switchTab('private')">🔒 Private Self</button>
        <button class="tab-btn"        data-tab="perceived" onclick="switchTab('perceived')">🔮 Perceived Self</button>
    </div>
    <div class="disc-panel active" id="panel-public">
        <div class="panel-title">Public Self <span class="badge">Tampak ke Orang Lain</span></div>
        <p class="panel-sub">Tipe dominan: <b style="color:var(--dark)">${domPub}</b> &nbsp;·&nbsp; Bagaimana orang lain melihat perilaku Anda sehari-hari</p>
        ${renderBarPanel(result.public,'public')}
    </div>
    <div class="disc-panel" id="panel-private">
        <div class="panel-title">Private Self <span class="badge">Diri Sebenarnya</span></div>
        <p class="panel-sub">Tipe dominan: <b style="color:var(--dark)">${domPri}</b> &nbsp;·&nbsp; Kepribadian Anda yang sesungguhnya di balik penampilan luar</p>
        ${renderBarPanel(result.private,'private')}
    </div>
    <div class="disc-panel" id="panel-perceived">
        <div class="panel-title">Perceived Self <span class="badge">Persepsi Diri Total</span></div>
        <p class="panel-sub">Tipe dominan: <b style="color:var(--dark)">${domPer}</b> &nbsp;·&nbsp; Kesenjangan antara bagaimana Anda tampak dan siapa Anda sebenarnya</p>
        ${renderBarPanel(result.perceived,'perceived')}
    </div>
    <div class="chart-wrap">
        <h2>📊 Perbandingan Public vs Private Self</h2>
        <div class="chart-grid">
            <div><div class="chart-box"><canvas id="chartPublic"></canvas></div><div class="chart-label">Public Self</div></div>
            <div><div class="chart-box"><canvas id="chartPrivate"></canvas></div><div class="chart-label">Private Self</div></div>
        </div>
    </div>
    ${buildSummary(result)}
    <div class="btn-row">
        <button class="btn btn-dark" onclick="downloadImg()">📥 Download JPG</button>
        <button class="btn btn-outline" onclick="window.print()">🖨️ Cetak PDF</button>
    </div>`;

    renderCharts(result);
}

// LOAD DATA
// ═══════════════════════════════════════════════════════
async function loadData(){
    const params=new URLSearchParams(window.location.search);
    const token=params.get('token')||params.get('x_01');
    const app=document.getElementById('app');
    if(!token){hide();app.innerHTML=`<div class="error-box"><h2>❌ Token Tidak Ditemukan</h2><p>Tambahkan ?token=xxx pada URL.</p></div>`;return;}
    try{
        const res=await fetch(`https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6?table=nilai1_json&x_01_eq=${token}`,{headers:{'X-Custom-Auth':'admin'}});
        const json=await res.json();
        hide();
        if(json.success&&json.count>0){renderResult(json.data[0]);}
        else{app.innerHTML=`<div class="error-box"><h2>❌ Data Tidak Ditemukan</h2><p>Token tidak valid atau belum ada data.</p></div>`;}
    }catch(e){hide();app.innerHTML=`<div class="error-box"><h2>❌ Koneksi Gagal</h2><p>Tidak dapat terhubung ke server.</p></div>`;}
}
function hide(){const s=document.getElementById('loadingScreen');s.style.opacity='0';setTimeout(()=>s.style.display='none',500);}
async function downloadImg(){
    const btn=event.target;btn.disabled=true;btn.textContent='⏳ Memproses...';
    try{
        const canvas=await html2canvas(document.getElementById('app'),{scale:2,backgroundColor:'#f4f4f8'});
        const a=document.createElement('a');a.download=`Hasil-DISC-${Date.now()}.jpg`;a.href=canvas.toDataURL('image/jpeg',.95);a.click();
        btn.textContent='✅ Berhasil!';
    }catch{btn.textContent='❌ Gagal';}
    setTimeout(()=>{btn.disabled=false;btn.textContent='📥 Download JPG';},2000);
}
loadData();
</script>
