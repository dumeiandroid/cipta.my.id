<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saya Termasuk Pemimpin yang Seperti Apa?</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #434343 0%, #000000 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 950px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #434343, #000000);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .profile-section {
            background: var(--bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .profile-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-item strong {
            color: var(--text-dark);
            font-size: 13px;
        }

        .profile-item span {
            color: var(--text-light);
            font-size: 14px;
        }

        .dominant-display {
            text-align: center;
            margin: 30px 0;
            padding: 30px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
        }

        .dominant-label {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .dominant-text {
            font-size: 36px;
            font-weight: bold;
        }

        .chart-section {
            margin: 30px 0;
        }

        .chart-wrapper {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .result-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 30px;
            border-radius: 15px;
            border-left: 6px solid;
            margin: 25px 0;
        }

        .result-card h2 {
            font-size: 26px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-card .description {
            color: var(--text-dark);
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .style-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .style-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border-top: 4px solid;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .style-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .style-card .score-info {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 15px;
        }

        .style-card .characteristics {
            margin-top: 15px;
        }

        .style-card .characteristics strong {
            font-size: 14px;
            color: var(--text-dark);
            display: block;
            margin-bottom: 10px;
        }

        .style-card .characteristics ul {
            list-style: none;
            padding: 0;
        }

        .style-card .characteristics li {
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
            font-size: 13px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .style-card .characteristics li:before {
            content: "•";
            position: absolute;
            left: 5px;
            font-weight: bold;
        }

        .strengths-weaknesses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .sw-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .sw-card.strengths {
            border-left: 4px solid #4caf50;
        }

        .sw-card.weaknesses {
            border-left: 4px solid #f44336;
        }

        .sw-card h3 {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sw-card ul {
            list-style: none;
            padding: 0;
        }

        .sw-card ul li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
            color: var(--text-dark);
            line-height: 1.6;
        }

        .sw-card.strengths li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4caf50;
            font-weight: bold;
        }

        .sw-card.weaknesses li:before {
            content: "⚠";
            position: absolute;
            left: 0;
            color: #f44336;
        }

        .suggestions {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .suggestions h3 {
            color: #1565c0;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestions ul {
            list-style: none;
            padding: 0;
        }

        .suggestions li {
            padding: 10px 0;
            padding-left: 25px;
            position: relative;
            color: #1565c0;
            line-height: 1.6;
        }

        .suggestions li:before {
            content: "💡";
            position: absolute;
            left: 0;
        }

        .note-box {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .note-box p {
            color: #e65100;
            line-height: 1.6;
            font-size: 14px;
            font-style: italic;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #434343, #000000);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #434343;
            border: 2px solid #434343;
        }

        .btn-secondary:hover {
            background: #434343;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-light);
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
        }

        @media print {
            body {
                background: white;
            }
            .action-buttons {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }
            
            .dominant-text {
                font-size: 28px;
            }

            .content {
                padding: 20px;
            }

            .style-details,
            .strengths-weaknesses {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">
            <h2>⏳ Menganalisis gaya kepemimpinan Anda...</h2>
            <p>Mohon tunggu sebentar</p>
        </div>
    </div>

    <script>
        const styles = [
            { 
                id: 'demo', 
                name: 'Demokratis', 
                color: '#2ecc71',
                icon: '🤝',
                desc: 'Anda adalah pemimpin yang menghargai potensi setiap individu dan mengutamakan koordinasi serta bimbingan tim. Keputusan dibuat bersama-sama dengan melibatkan masukan dari anggota tim.',
                characteristics: [
                    'Mendengarkan dan menghargai pendapat semua anggota tim',
                    'Mendorong partisipasi aktif dalam pengambilan keputusan',
                    'Membangun konsensus sebelum mengambil keputusan penting',
                    'Memberikan kebebasan berpendapat tanpa takut dikritik',
                    'Fokus pada pengembangan potensi setiap individu'
                ],
                strengths: [
                    'Meningkatkan motivasi dan kepuasan tim',
                    'Keputusan lebih berkualitas karena berbagai perspektif',
                    'Membangun rasa memiliki dan tanggung jawab bersama',
                    'Mengembangkan kemampuan problem-solving tim',
                    'Menciptakan lingkungan kerja yang positif dan inklusif'
                ],
                weaknesses: [
                    'Proses pengambilan keputusan bisa lambat',
                    'Kesulitan saat harus membuat keputusan cepat',
                    'Bisa terjadi konflik jika pendapat sangat beragam',
                    'Membutuhkan tim yang mature dan bertanggung jawab',
                    'Risiko kehilangan kontrol jika tidak dikelola baik'
                ]
            },
            { 
                id: 'oto', 
                name: 'Otokratis', 
                color: '#e74c3c',
                icon: '👊',
                desc: 'Keputusan mutlak ada di tangan Anda. Anda fokus pada kepatuhan dan aturan yang Anda rancang sendiri. Kontrol penuh terhadap proses kerja adalah prioritas Anda.',
                characteristics: [
                    'Membuat keputusan sendiri tanpa banyak konsultasi',
                    'Mengharapkan kepatuhan penuh terhadap instruksi',
                    'Kontrol ketat terhadap semua aspek pekerjaan',
                    'Komunikasi satu arah dari atasan ke bawahan',
                    'Standar tinggi dengan pengawasan ketat'
                ],
                strengths: [
                    'Pengambilan keputusan sangat cepat dan efisien',
                    'Efektif dalam situasi krisis atau emergency',
                    'Kontrol penuh memastikan konsistensi output',
                    'Jelas dan tidak ambigu dalam ekspektasi',
                    'Cocok untuk tim yang kurang berpengalaman'
                ],
                weaknesses: [
                    'Mengurangi kreativitas dan inisiatif tim',
                    'Demotivasi karena kurangnya keterlibatan',
                    'Ketergantungan tinggi pada satu pemimpin',
                    'Bisa menciptakan lingkungan yang stressful',
                    'Potensi turnover karyawan yang tinggi'
                ]
            },
            { 
                id: 'lais', 
                name: 'Laissez Faire', 
                color: '#95a5a6',
                icon: '🎯',
                desc: 'Anda memberikan kebebasan penuh kepada anggota tim untuk mengatur pekerjaan mereka sendiri. Sebagai pemimpin, Anda lebih banyak berperan sebagai fasilitator daripada pengatur.',
                characteristics: [
                    'Memberikan otonomi penuh kepada tim',
                    'Intervensi minimal dalam pekerjaan sehari-hari',
                    'Menyediakan resources yang dibutuhkan tim',
                    'Percaya penuh pada kemampuan anggota tim',
                    'Fokus pada hasil, bukan pada proses'
                ],
                strengths: [
                    'Mendorong kreativitas dan inovasi maksimal',
                    'Cocok untuk tim expert dan self-motivated',
                    'Mengembangkan kemandirian anggota tim',
                    'Fleksibilitas tinggi dalam cara kerja',
                    'Mengurangi micromanagement yang kontraproduktif'
                ],
                weaknesses: [
                    'Bisa menyebabkan kebingungan tanpa arahan jelas',
                    'Risiko inkonsistensi dalam output',
                    'Tidak cocok untuk tim yang butuh bimbingan',
                    'Potensi konflik antar anggota tanpa mediasi',
                    'Bisa dianggap kurang peduli atau tidak terlibat'
                ]
            },
            { 
                id: 'pat', 
                name: 'Paternalistis', 
                color: '#e67e22',
                icon: '🛡️',
                desc: 'Anda cenderung melindungi anggota tim dan menganggap mereka perlu bimbingan penuh, layaknya hubungan orang tua dengan anak. Anda memberikan arahan yang jelas dan peduli terhadap kesejahteraan tim.',
                characteristics: [
                    'Memberikan perlindungan dan perhatian personal',
                    'Membuat keputusan "untuk kebaikan" anggota tim',
                    'Hubungan yang lebih personal dengan tim',
                    'Mengharapkan loyalitas sebagai balasan',
                    'Memberikan arahan detail dan bimbingan konstan'
                ],
                strengths: [
                    'Menciptakan rasa aman dan kekeluargaan',
                    'Loyalitas tim yang tinggi',
                    'Peduli pada kesejahteraan holistik tim',
                    'Hubungan interpersonal yang kuat',
                    'Cocok untuk budaya kolektif'
                ],
                weaknesses: [
                    'Menghambat kemandirian dan pertumbuhan tim',
                    'Dependensi berlebihan pada pemimpin',
                    'Bisa dianggap condescending atau meremehkan',
                    'Keputusan tidak selalu objektif',
                    'Sulit memisahkan hubungan personal dan profesional'
                ]
            }
        ];

        async function loadData() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showError('Token tidak ditemukan. Silakan kembali dan isi form terlebih dahulu.');
                return;
            }

            try {
                const response = await fetch(
                    `https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6?table=tes&x_04_eq=${token}`,
                    { headers: { 'X-Custom-Auth': 'admin' } }
                );
                
                const res = await response.json();
                
                if (res.success && res.count > 0) {
                    renderUI(res.data[0]);
                } else {
                    showError('Data tidak ditemukan. Pastikan Anda telah mengisi form dengan benar.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Terjadi kesalahan sistem. Silakan coba lagi nanti.');
            }
        }

        function showError(message) {
            document.getElementById('app').innerHTML = `
                <div class="error">
                    <h2>❌ Oops!</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        function renderUI(data) {
            const dataDiri = JSON.parse(data.x_02);
            const jawaban = JSON.parse(data.x_03);
            
            const scores = styles.map(s => jawaban[s.id] ? jawaban[s.id].length : 0);
            const maxScore = Math.max(...scores);
            const maxIdx = scores.indexOf(maxScore);
            const dominan = styles[maxIdx];

            let combined = styles.map((s, i) => ({ ...s, score: scores[i] }));
            combined.sort((a, b) => b.score - a.score);
            
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <h1>🎭 Saya Termasuk Pemimpin yang Seperti Apa?</h1>
                    <p>Analisis Gaya Kepemimpinan Berdasarkan 4 Tipe Utama</p>
                </div>

                <div class="content" id="downloadContent">
                    <div class="profile-section">
                        <div class="profile-item">
                            <strong>👤 Nama:</strong>
                            <span>${dataDiri.nama}</span>
                        </div>
                        <div class="profile-item">
                            <strong>🎂 Usia:</strong>
                            <span>${dataDiri.usia} Tahun</span>
                        </div>
                        <div class="profile-item">
                            <strong>💼 Jabatan:</strong>
                            <span>${dataDiri.jabatan}</span>
                        </div>
                        <div class="profile-item">
                            <strong>📅 Tanggal Tes:</strong>
                            <span>${data.x_05}</span>
                        </div>
                    </div>

                    <div class="dominant-display">
                        <div class="dominant-label">Gaya Kepemimpinan Dominan Anda</div>
                        <div class="dominant-text" style="color: ${dominan.color}">
                            ${dominan.icon} ${dominan.name}
                        </div>
                    </div>

                    <div class="chart-section">
                        <div class="chart-wrapper">
                            <canvas id="styleChart"></canvas>
                        </div>
                    </div>

                    <div class="result-card" style="border-color: ${dominan.color}">
                        <h2 style="color: ${dominan.color}">
                            ${dominan.icon} Tipe Kepemimpinan: ${dominan.name}
                        </h2>
                        <div class="description">
                            ${dominan.desc}
                        </div>
                        <div style="font-size: 14px; color: ${dominan.color}; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
                            <strong>Rincian Skor:</strong> 
                            ${combined.map(s => `${s.name}: ${s.score}/7`).join(' | ')}
                        </div>
                    </div>

                    <div class="style-details">
                        <div class="style-card" style="border-color: ${dominan.color}">
                            <h3 style="color: ${dominan.color}">📋 Karakteristik Utama</h3>
                            <div class="score-info">Skor Anda: ${dominan.score}/7</div>
                            <div class="characteristics">
                                <ul>
                                    ${dominan.characteristics.map(char => `<li>${char}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="strengths-weaknesses">
                        <div class="sw-card strengths">
                            <h3>💪 Kekuatan Gaya Ini</h3>
                            <ul>
                                ${dominan.strengths.map(str => `<li>${str}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="sw-card weaknesses">
                            <h3>⚠️ Kelemahan yang Perlu Diwaspadai</h3>
                            <ul>
                                ${dominan.weaknesses.map(weak => `<li>${weak}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="suggestions">
                        <h3>💡 Saran Pengembangan Kepemimpinan</h3>
                        <ul>
                            ${getSuggestions(dominan.id).map(sug => `<li>${sug}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="note-box">
                        <p><strong>Catatan Penting:</strong> Tidak ada gaya kepemimpinan yang mutlak benar atau salah. Efektivitas kepemimpinan sangat bergantung pada situasi, konteks organisasi, dan karakteristik tim yang Anda pimpin. Pemimpin terbaik adalah yang adaptif - mampu menyesuaikan gaya kepemimpinan sesuai kebutuhan. Pertimbangkan untuk mengembangkan fleksibilitas dalam gaya kepemimpinan Anda.</p>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="downloadAsImage()">
                            📥 Download Hasil (JPG)
                        </button>
                        <button class="btn btn-secondary" onclick="window.print()">
                            🖨️ Cetak Laporan
                        </button>
                    </div>
                </div>
            `;

            drawChart(scores);
        }

        function getSuggestions(styleId) {
            const suggestions = {
                'demo': [
                    'Pertahankan inklusivitas dalam pengambilan keputusan, tetapi tetapkan batasan waktu untuk menghindari analysis paralysis',
                    'Kembangkan skill fasilitasi untuk mengelola diskusi tim yang produktif',
                    'Latih kemampuan untuk membuat keputusan cepat saat situasi mendesak',
                    'Pastikan ada follow-through yang jelas setelah keputusan dibuat bersama',
                    'Bangun sistem feedback yang konstruktif untuk terus meningkatkan proses kolaborasi'
                ],
                'oto': [
                    'Praktikkan mendengarkan aktif - beri kesempatan tim untuk berbicara',
                    'Mulai delegasi tugas-tugas tertentu untuk mengembangkan tim',
                    'Coba libatkan tim dalam keputusan yang tidak kritis untuk membangun kepercayaan',
                    'Kembangkan empati dan emotional intelligence untuk memahami kebutuhan tim',
                    'Balance antara kontrol dan memberi ruang untuk pertumbuhan tim'
                ],
                'lais': [
                    'Tetapkan ekspektasi dan guidelines yang jelas meski memberikan kebebasan',
                    'Lakukan check-in rutin untuk memastikan tim tidak kehilangan arah',
                    'Berikan feedback lebih sering, jangan hanya saat ada masalah',
                    'Kenali kapan tim membutuhkan arahan lebih dari Anda',
                    'Bangun struktur minimal untuk mencegah chaos sambil tetap memberi kebebasan'
                ],
                'pat': [
                    'Dorong kemandirian tim dengan memberikan tantangan yang terukur',
                    'Pisahkan hubungan personal dan profesional dalam pengambilan keputusan',
                    'Praktikkan empowerment - biarkan tim membuat keputusan sendiri kadang-kadang',
                    'Fokus pada pengembangan jangka panjang, bukan hanya proteksi jangka pendek',
                    'Terima bahwa tim perlu belajar dari kesalahan mereka sendiri'
                ]
            };
            return suggestions[styleId] || [];
        }

        function drawChart(scores) {
            const ctx = document.getElementById('styleChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: styles.map(s => s.name),
                    datasets: [{
                        label: 'Skor',
                        data: scores,
                        backgroundColor: styles.map(s => s.color),
                        borderRadius: 8,
                        barThickness: 60
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 7,
                            ticks: {
                                stepSize: 1
                            },
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            grid: {
                                display: false
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `Skor: ${context.parsed.x}/7`;
                                }
                            }
                        }
                    }
                }
            });
        }

        async function downloadAsImage() {
            const button = event.target;
            button.disabled = true;
            button.textContent = '⏳ Memproses...';

            try {
                const content = document.getElementById('downloadContent');
                const canvas = await html2canvas(content, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    windowWidth: content.scrollWidth,
                    windowHeight: content.scrollHeight
                });

                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    const date = new Date().toISOString().split('T')[0];
                    link.download = `Hasil-Gaya-Kepemimpinan-${date}.jpg`;
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);

                    button.disabled = false;
                    button.textContent = '✅ Berhasil! Download Lagi?';
                    setTimeout(() => {
                        button.innerHTML = '📥 Download Hasil (JPG)';
                    }, 3000);
                }, 'image/jpeg', 0.95);

            } catch (error) {
                console.error('Error:', error);
                button.disabled = false;
                button.textContent = '❌ Gagal. Coba Lagi';
                setTimeout(() => {
                    button.innerHTML = '📥 Download Hasil (JPG)';
                }, 3000);
            }
        }

        loadData();
    </script>
</body>
</html>
