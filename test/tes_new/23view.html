<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivasi Kepemimpinan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --high: #27ae60;
            --mid: #f1c40f;
            --low: #e67e22;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 850px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .profile-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .profile-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-item strong {
            color: var(--text-dark);
            font-size: 13px;
        }

        .profile-item span {
            color: var(--text-light);
            font-size: 14px;
        }

        .score-display {
            text-align: center;
            margin: 30px 0;
            padding: 30px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
        }

        .score-number {
            font-size: 56px;
            font-weight: bold;
        }

        .score-label {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 5px;
        }

        .score-bar {
            margin-top: 15px;
            height: 8px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease;
        }

        .chart-section {
            margin: 30px 0;
        }

        .chart-wrapper {
            max-width: 350px;
            margin: 0 auto;
            position: relative;
        }

        .chart-center-text {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .chart-center-text .big-number {
            font-size: 36px;
            font-weight: bold;
        }

        .chart-center-text .small-text {
            font-size: 12px;
            color: var(--text-light);
        }

        .result-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 30px;
            border-radius: 15px;
            border-left: 6px solid;
            margin: 25px 0;
        }

        .result-card h2 {
            font-size: 26px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-card .description {
            color: var(--text-dark);
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .motivation-factors {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .motivation-factors h3 {
            color: var(--text-dark);
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .factor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .factor-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid;
        }

        .factor-item .icon {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .factor-item .text {
            font-size: 14px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .suggestions {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .suggestions h3 {
            color: #2e7d32;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestions ul {
            list-style: none;
            padding: 0;
        }

        .suggestions li {
            padding: 10px 0;
            padding-left: 25px;
            position: relative;
            color: #2e7d32;
            line-height: 1.6;
        }

        .suggestions li:before {
            content: "💡";
            position: absolute;
            left: 0;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #f5576c;
            border: 2px solid #f5576c;
        }

        .btn-secondary:hover {
            background: #f5576c;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-light);
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
        }

        @media print {
            body {
                background: white;
            }
            .action-buttons {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }
            
            .score-number {
                font-size: 42px;
            }

            .content {
                padding: 20px;
            }

            .factor-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">
            <h2>⏳ Menganalisis motivasi kepemimpinan Anda...</h2>
            <p>Mohon tunggu sebentar</p>
        </div>
    </div>

    <script>
        async function loadData() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showError('Token tidak ditemukan. Silakan kembali dan isi form terlebih dahulu.');
                return;
            }

            try {
                const response = await fetch(
                    `https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6?table=tes&x_04_eq=${token}`,
                    { headers: { 'X-Custom-Auth': 'admin' } }
                );
                
                const res = await response.json();
                
                if (res.success && res.count > 0) {
                    renderUI(res.data[0]);
                } else {
                    showError('Data tidak ditemukan. Pastikan Anda telah mengisi form dengan benar.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Terjadi kesalahan sistem. Silakan coba lagi nanti.');
            }
        }

        function showError(message) {
            document.getElementById('app').innerHTML = `
                <div class="error">
                    <h2>❌ Oops!</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        function renderUI(data) {
            const dataDiri = JSON.parse(data.x_02);
            const jawaban = JSON.parse(data.x_03);
            
            let total = 0;
            Object.values(jawaban).forEach(v => total += parseInt(v));

            const result = getResult(total);
            const percentage = (total / 70 * 100).toFixed(1);
            
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <h1>🔥 Motivasi Kepemimpinan</h1>
                    <p>Mengukur Keinginan dan Dorongan untuk Memimpin</p>
                </div>

                <div class="content" id="downloadContent">
                    <div class="profile-section">
                        <div class="profile-item">
                            <strong>👤 Nama:</strong>
                            <span>${dataDiri.nama}</span>
                        </div>
                        <div class="profile-item">
                            <strong>🎂 Usia:</strong>
                            <span>${dataDiri.usia} Tahun</span>
                        </div>
                        <div class="profile-item">
                            <strong>🎓 Pendidikan:</strong>
                            <span>${dataDiri.pendidikan}</span>
                        </div>
                        <div class="profile-item">
                            <strong>📅 Tanggal Tes:</strong>
                            <span>${data.x_05}</span>
                        </div>
                    </div>

                    <div class="score-display">
                        <div class="score-number" style="color: ${result.color}">${total}</div>
                        <div class="score-label">dari 70 poin (${percentage}%)</div>
                        <div class="score-bar">
                            <div class="score-bar-fill" style="width: ${percentage}%; background: ${result.color}"></div>
                        </div>
                    </div>

                    <div class="chart-section">
                        <div class="chart-wrapper">
                            <canvas id="gaugeChart"></canvas>
                            <div class="chart-center-text">
                                <div class="big-number" style="color: ${result.color}">${total}</div>
                                <div class="small-text">dari 70</div>
                            </div>
                        </div>
                    </div>

                    <div class="result-card" style="border-color: ${result.color}">
                        <h2 style="color: ${result.color}">
                            ${result.icon} ${result.title}
                        </h2>
                        <div class="description">
                            ${result.description}
                        </div>

                        <div class="motivation-factors">
                            <h3>📊 Faktor Motivasi Kepemimpinan</h3>
                            <div class="factor-grid">
                                ${result.factors.map(factor => `
                                    <div class="factor-item" style="border-color: ${result.color}">
                                        <div class="icon">${factor.icon}</div>
                                        <div class="text">${factor.text}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="suggestions">
                            <h3>💡 Rekomendasi Pengembangan</h3>
                            <ul>
                                ${result.suggestions.map(sug => `<li>${sug}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="downloadAsImage()">
                            📥 Download Hasil (JPG)
                        </button>
                        <button class="btn btn-secondary" onclick="window.print()">
                            🖨️ Cetak Laporan
                        </button>
                    </div>
                </div>
            `;

            drawGauge(total, result.color);
        }

        function getResult(total) {
            if (total >= 56) {
                return {
                    title: 'Motivasi Kepemimpinan Sangat Kuat',
                    color: '#27ae60',
                    icon: '🔥',
                    description: 'Luar biasa! Anda memiliki motivasi yang sangat kuat untuk menjadi pemimpin. Anda menunjukkan sikap ideal yang diperlukan untuk memimpin dan mengorganisasikan orang lain. Anda memiliki bakat natural sebagai pemimpin yang dapat menginspirasi dan mempengaruhi orang lain.',
                    factors: [
                        { icon: '⭐', text: 'Drive dan ambisi yang tinggi untuk memimpin' },
                        { icon: '🎯', text: 'Kepercayaan diri dalam mengambil tanggung jawab' },
                        { icon: '💪', text: 'Inisiatif kuat untuk mengorganisir dan mengarahkan' },
                        { icon: '🚀', text: 'Antusiasme tinggi dalam posisi kepemimpinan' },
                        { icon: '👥', text: 'Keinginan natural untuk mempengaruhi orang lain' },
                        { icon: '🏆', text: 'Orientasi pencapaian yang sangat tinggi' }
                    ],
                    suggestions: [
                        'Manfaatkan motivasi tinggi Anda dengan mengambil posisi kepemimpinan yang menantang',
                        'Kembangkan skill kepemimpinan melalui training formal dan mentoring',
                        'Cari peluang untuk memimpin project atau tim yang lebih besar dan kompleks',
                        'Bangun network dengan pemimpin lain untuk saling belajar dan berkembang',
                        'Jaga keseimbangan antara ambisi dan empati terhadap tim',
                        'Tetap humble - motivasi tinggi harus diimbangi dengan kesediaan terus belajar',
                        'Pertimbangkan untuk menjadi mentor bagi calon pemimpin lainnya',
                        'Investasi dalam pengembangan emotional intelligence untuk menjadi pemimpin yang lebih efektif'
                    ]
                };
            } else if (total >= 28) {
                return {
                    title: 'Motivasi Kepemimpinan Moderat',
                    color: '#f1c40f',
                    icon: '⚖️',
                    description: 'Anda menunjukkan keragu-raguan dalam motivasi kepemimpinan. Di satu sisi Anda tertarik untuk memimpin, namun di sisi lain masih ada keraguan dan ketidakpastian. Anda perlu lebih tegas, mandiri, dan berani mengambil tanggung jawab yang lebih besar.',
                    factors: [
                        { icon: '🤔', text: 'Minat kepemimpinan ada namun tidak konsisten' },
                        { icon: '⚡', text: 'Kepercayaan diri yang masih fluktuatif' },
                        { icon: '📊', text: 'Keberanian mengambil risiko masih terbatas' },
                        { icon: '👤', text: 'Preferensi kadang lebih nyaman sebagai follower' },
                        { icon: '🎭', text: 'Ambivalensi antara ingin memimpin dan nyaman di posisi saat ini' },
                        { icon: '💭', text: 'Perlu validasi eksternal untuk mengambil peran kepemimpinan' }
                    ],
                    suggestions: [
                        'Identifikasi sumber keragu-raguan Anda - apakah dari kurang percaya diri, pengalaman buruk, atau faktor lain',
                        'Mulai dengan memimpin project kecil untuk membangun kepercayaan diri secara bertahap',
                        'Cari mentor yang bisa memberikan guidance dan dukungan dalam perjalanan kepemimpinan',
                        'Ikuti training assertiveness dan decision-making untuk meningkatkan ketegasan',
                        'Praktikkan mengambil keputusan sendiri dalam situasi low-risk terlebih dahulu',
                        'Kembangkan growth mindset - percaya bahwa kepemimpinan bisa dipelajari dan ditingkatkan',
                        'Keluar dari comfort zone secara bertahap - ambil tanggung jawab yang sedikit lebih besar dari biasanya',
                        'Refleksikan pengalaman kepemimpinan masa lalu - apa yang berhasil dan apa yang perlu diperbaiki',
                        'Bangun support system dengan orang-orang yang mendukung perkembangan Anda',
                        'Jangan terlalu keras pada diri sendiri - setiap pemimpin besar pernah meragukan diri mereka'
                    ]
                };
            } else {
                return {
                    title: 'Motivasi Kepemimpinan Rendah',
                    color: '#e67e22',
                    icon: '🌱',
                    description: 'Saat ini Anda menunjukkan motivasi yang rendah untuk menjadi pemimpin. Anda cenderung lebih nyaman sebagai pelaksana daripada pemimpin. Perlu mengembangkan karakteristik dan mindset kepemimpinan agar tidak hanya puas menjadi pelaksana tugas biasa.',
                    factors: [
                        { icon: '😰', text: 'Kurang nyaman dalam posisi kepemimpinan' },
                        { icon: '🚫', text: 'Menghindari tanggung jawab kepemimpinan' },
                        { icon: '👥', text: 'Lebih prefer bekerja sebagai kontributor individual' },
                        { icon: '😟', text: 'Kurang percaya diri untuk memimpin orang lain' },
                        { icon: '📉', text: 'Motivasi rendah untuk mengambil inisiatif memimpin' },
                        { icon: '🎯', text: 'Belum melihat value atau manfaat dari peran kepemimpinan' }
                    ],
                    suggestions: [
                        'Pahami bahwa tidak semua orang harus menjadi pemimpin - identifikasi apakah ini memang bukan passion Anda atau hanya karena kurang pengalaman',
                        'Jika ingin mengembangkan kepemimpinan, mulai dari memimpin diri sendiri - discipline, goal-setting, self-management',
                        'Cari tahu role model pemimpin yang Anda kagumi dan pelajari apa yang membuat mereka menarik',
                        'Ikuti workshop atau seminar tentang leadership untuk mendapat exposure dan inspirasi',
                        'Mulai dari volunteer untuk koordinasi kegiatan kecil dalam tim atau komunitas',
                        'Bangun kepercayaan diri dengan mengidentifikasi dan mengembangkan kekuatan personal Anda',
                        'Cari mentor atau coach yang bisa membimbing perjalanan pengembangan kepemimpinan Anda',
                        'Pahami bahwa kepemimpinan bukan tentang kekuasaan, tapi tentang service dan impact positif',
                        'Baca buku atau biografi pemimpin inspiratif untuk mendapat perspektif baru',
                        'Evaluasi apakah Anda lebih cocok sebagai individual contributor expert atau perlu mengembangkan jalur kepemimpinan',
                        'Jika memutuskan tidak ingin menjadi pemimpin, itu juga pilihan yang valid - fokus menjadi expert di bidang Anda',
                        'Namun tetap kembangkan leadership skills dasar karena berguna dalam berbagai aspek kehidupan'
                    ]
                };
            }
        }

        function drawGauge(total, color) {
            const ctx = document.getElementById('gaugeChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [total, 70 - total],
                        backgroundColor: [color, '#eee'],
                        borderWidth: 0,
                        circumference: 180,
                        rotation: 270,
                        cutout: '85%'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            enabled: false
                        }
                    }
                }
            });
        }

        async function downloadAsImage() {
            const button = event.target;
            button.disabled = true;
            button.textContent = '⏳ Memproses...';

            try {
                const content = document.getElementById('downloadContent');
                const canvas = await html2canvas(content, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    windowWidth: content.scrollWidth,
                    windowHeight: content.scrollHeight
                });

                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    const date = new Date().toISOString().split('T')[0];
                    link.download = `Hasil-Motivasi-Kepemimpinan-${date}.jpg`;
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);

                    button.disabled = false;
                    button.textContent = '✅ Berhasil! Download Lagi?';
                    setTimeout(() => {
                        button.innerHTML = '📥 Download Hasil (JPG)';
                    }, 3000);
                }, 'image/jpeg', 0.95);

            } catch (error) {
                console.error('Error:', error);
                button.disabled = false;
                button.textContent = '❌ Gagal. Coba Lagi';
                setTimeout(() => {
                    button.innerHTML = '📥 Download Hasil (JPG)';
                }, 3000);
            }
        }

        loadData();
    </script>
</body>
</html>
