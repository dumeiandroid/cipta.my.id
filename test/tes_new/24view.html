<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Waktu</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --perfect: #8e44ad;
            --excel: #27ae60;
            --good: #2980b9;
            --low: #e67e22;
            --liar: #c0392b;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 850px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .profile-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .profile-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-item strong {
            color: var(--text-dark);
            font-size: 13px;
        }

        .profile-item span {
            color: var(--text-light);
            font-size: 14px;
        }

        .score-display {
            text-align: center;
            margin: 30px 0;
            padding: 30px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
        }

        .score-number {
            font-size: 56px;
            font-weight: bold;
        }

        .score-label {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 5px;
        }

        .chart-section {
            margin: 30px 0;
        }

        .chart-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .result-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 30px;
            border-radius: 15px;
            border-left: 6px solid;
            margin: 25px 0;
        }

        .result-card h2 {
            font-size: 26px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-card .description {
            color: var(--text-dark);
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .time-management-tips {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .time-management-tips h3 {
            color: var(--text-dark);
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .tip-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid;
        }

        .tip-item .icon {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .tip-item .text {
            font-size: 14px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .warning-box h4 {
            color: #856404;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .warning-box p {
            color: #856404;
            line-height: 1.6;
            font-size: 14px;
        }

        .suggestions {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .suggestions h3 {
            color: #2e7d32;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestions ul {
            list-style: none;
            padding: 0;
        }

        .suggestions li {
            padding: 10px 0;
            padding-left: 25px;
            position: relative;
            color: #2e7d32;
            line-height: 1.6;
        }

        .suggestions li:before {
            content: "⏰";
            position: absolute;
            left: 0;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-light);
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
        }

        @media print {
            body {
                background: white;
            }
            .action-buttons {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }
            
            .score-number {
                font-size: 42px;
            }

            .content {
                padding: 20px;
            }

            .tips-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">
            <h2>⏳ Menganalisis kemampuan manajemen waktu Anda...</h2>
            <p>Mohon tunggu sebentar</p>
        </div>
    </div>

    <script>
        async function loadData() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showError('Token tidak ditemukan. Silakan kembali dan isi form terlebih dahulu.');
                return;
            }

            try {
                const response = await fetch(
                    `https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6?table=tes&x_04_eq=${token}`,
                    { headers: { 'X-Custom-Auth': 'admin' } }
                );
                
                const res = await response.json();
                
                if (res.success && res.count > 0) {
                    renderUI(res.data[0]);
                } else {
                    showError('Data tidak ditemukan. Pastikan Anda telah mengisi form dengan benar.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Terjadi kesalahan sistem. Silakan coba lagi nanti.');
            }
        }

        function showError(message) {
            document.getElementById('app').innerHTML = `
                <div class="error">
                    <h2>❌ Oops!</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        function renderUI(data) {
            const dataDiri = JSON.parse(data.x_02);
            const jawaban = JSON.parse(data.x_03);
            
            let total = 0;
            Object.values(jawaban).forEach(v => total += parseInt(v));

            const result = getResult(total);
            
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <h1>⏰ Profil Manajemen Waktu</h1>
                    <p>Evaluasi Kemampuan Mengelola dan Menggunakan Waktu Secara Efektif</p>
                </div>

                <div class="content" id="downloadContent">
                    <div class="profile-section">
                        <div class="profile-item">
                            <strong>👤 Nama:</strong>
                            <span>${dataDiri.nama}</span>
                        </div>
                        <div class="profile-item">
                            <strong>🎂 Usia:</strong>
                            <span>${dataDiri.usia} Tahun</span>
                        </div>
                        <div class="profile-item">
                            <strong>🎓 Pendidikan:</strong>
                            <span>${dataDiri.pendidikan}</span>
                        </div>
                        <div class="profile-item">
                            <strong>📅 Tanggal Tes:</strong>
                            <span>${data.x_05}</span>
                        </div>
                    </div>

                    <div class="score-display">
                        <div class="score-number" style="color: ${result.color}">${total}</div>
                        <div class="score-label">dari 30 poin maksimal</div>
                    </div>

                    <div class="chart-section">
                        <div class="chart-wrapper">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>

                    <div class="result-card" style="border-color: ${result.color}">
                        <h2 style="color: ${result.color}">
                            ${result.icon} ${result.title}
                        </h2>
                        <div class="description">
                            ${result.description}
                        </div>

                        ${result.warning ? `
                            <div class="warning-box">
                                <h4>⚠️ Perhatian</h4>
                                <p>${result.warning}</p>
                            </div>
                        ` : ''}

                        <div class="time-management-tips">
                            <h3>⏱️ Aspek Manajemen Waktu</h3>
                            <div class="tips-grid">
                                ${result.aspects.map(aspect => `
                                    <div class="tip-item" style="border-color: ${result.color}">
                                        <div class="icon">${aspect.icon}</div>
                                        <div class="text">${aspect.text}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="suggestions">
                            <h3>💡 Saran Peningkatan</h3>
                            <ul>
                                ${result.suggestions.map(sug => `<li>${sug}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="downloadAsImage()">
                            📥 Download Hasil (JPG)
                        </button>
                        <button class="btn btn-secondary" onclick="window.print()">
                            🖨️ Cetak Laporan
                        </button>
                    </div>
                </div>
            `;

            drawChart(total, result.color);
        }

        function getResult(total) {
            if (total >= 28) {
                return {
                    title: 'Hasil Tidak Valid - Kemungkinan Tidak Jujur',
                    color: '#c0392b',
                    icon: '⚠️',
                    description: 'Hasil tes menunjukkan skor yang terlalu sempurna dan tidak realistis. Kemungkinan besar jawaban yang Anda berikan tidak mencerminkan kebiasaan sehari-hari yang sebenarnya. Untuk mendapatkan hasil yang bermakna, cobalah lebih jujur dalam menilai kebiasaan manajemen waktu Anda.',
                    warning: 'Manajemen waktu yang sempurna sangat jarang terjadi dalam praktik. Setiap orang pasti memiliki area yang perlu diperbaiki. Kejujuran dalam self-assessment adalah langkah pertama untuk perbaikan yang nyata.',
                    aspects: [
                        { icon: '🎭', text: 'Kemungkinan memberikan jawaban yang diinginkan daripada kenyataan' },
                        { icon: '📊', text: 'Skor tidak mencerminkan kondisi aktual' },
                        { icon: '🔍', text: 'Perlu introspeksi yang lebih mendalam dan jujur' },
                        { icon: '💭', text: 'Mungkin ada kecenderungan perfeksionisme dalam self-image' }
                    ],
                    suggestions: [
                        'Ulangi tes dengan menjawab berdasarkan kebiasaan aktual Anda, bukan idealisme',
                        'Ingat bahwa tidak ada yang sempurna - semua orang punya area untuk berkembang',
                        'Mintalah feedback dari orang terdekat tentang bagaimana Anda benar-benar mengelola waktu',
                        'Gunakan tes ini sebagai refleksi diri yang jujur, bukan untuk terlihat baik',
                        'Catat kegiatan Anda selama seminggu untuk melihat pola penggunaan waktu yang sebenarnya'
                    ]
                };
            } else if (total >= 26) {
                return {
                    title: 'Unggul & Luar Biasa Prima',
                    color: '#8e44ad',
                    icon: '🌟',
                    description: 'Luar biasa! Anda adalah pengelola waktu yang sangat efektif dan produktif. Anda benar-benar menguasai seni manajemen waktu dan mampu mengoptimalkan setiap menit dalam hari Anda. Kemampuan Anda dalam memprioritaskan, merencanakan, dan melaksanakan tugas patut diacungi jempol.',
                    warning: null,
                    aspects: [
                        { icon: '🎯', text: 'Prioritas sangat jelas dan terstruktur' },
                        { icon: '📅', text: 'Perencanaan sistematis dan detail' },
                        { icon: '⚡', text: 'Eksekusi cepat dan efisien' },
                        { icon: '🔄', text: 'Disiplin tinggi dalam follow-through' },
                        { icon: '💼', text: 'Balance yang baik antara berbagai aspek kehidupan' },
                        { icon: '🎓', text: 'Continuous improvement mindset' }
                    ],
                    suggestions: [
                        'Pertahankan sistem dan kebiasaan baik yang sudah Anda bangun',
                        'Jadilah mentor bagi orang lain - bagikan strategi manajemen waktu Anda',
                        'Terus evaluasi dan optimize sistem Anda seiring perubahan prioritas',
                        'Jangan lupa untuk tetap fleksibel - tidak semua hal bisa direncanakan',
                        'Pastikan efisiensi tidak mengorbankan wellbeing dan relationships',
                        'Dokumentasikan best practices Anda untuk referensi di masa depan',
                        'Eksplorasi tools dan teknologi baru untuk meningkatkan produktivitas',
                        'Ingat untuk schedule downtime dan self-care dalam agenda Anda'
                    ]
                };
            } else if (total >= 21) {
                return {
                    title: 'Manajemen Waktu Sangat Baik',
                    color: '#27ae60',
                    icon: '✅',
                    description: 'Bagus sekali! Anda mampu membuat skala prioritas dengan baik dan bijaksana dalam mengelola waktu. Anda memiliki sistem yang efektif untuk mengorganisir tugas dan tanggung jawab. Dengan sedikit penyempurnaan, Anda bisa mencapai level excellence.',
                    warning: null,
                    aspects: [
                        { icon: '✓', text: 'Prioritas yang jelas dalam pekerjaan' },
                        { icon: '📋', text: 'Perencanaan yang terstruktur' },
                        { icon: '⏱️', text: 'Cukup disiplin dengan jadwal' },
                        { icon: '🎯', text: 'Fokus yang baik pada tugas penting' },
                        { icon: '📊', text: 'Mampu tracking progress dengan baik' },
                        { icon: '🔧', text: 'Ada ruang untuk improvement' }
                    ],
                    suggestions: [
                        'Identifikasi time-wasters terbesar Anda dan cari cara untuk mengeliminasinya',
                        'Gunakan teknik time-blocking untuk mengalokasikan waktu untuk deep work',
                        'Praktikkan "eat the frog" - kerjakan tugas tersulit di pagi hari',
                        'Terapkan aturan 2-menit: jika tugas bisa diselesaikan dalam 2 menit, lakukan sekarang',
                        'Review dan adjust sistem manajemen waktu Anda setiap bulan',
                        'Delegate tugas yang bisa dikerjakan orang lain',
                        'Gunakan teknologi untuk automasi tugas rutin',
                        'Set boundaries yang jelas untuk melindungi waktu produktif Anda',
                        'Praktikkan saying no pada komitmen yang tidak align dengan prioritas',
                        'Batch similar tasks untuk meningkatkan efisiensi'
                    ]
                };
            } else if (total >= 11) {
                return {
                    title: 'Manajemen Waktu Cukup Baik - Perlu Peningkatan',
                    color: '#2980b9',
                    icon: '📈',
                    description: 'Anda sudah memiliki dasar yang baik dalam manajemen waktu, tetapi masih ada beberapa hal yang perlu diperbaiki. Anda kadang kesulitan dengan prioritas atau terganggu oleh distraksi. Dengan perbaikan yang konsisten, Anda bisa meningkatkan produktivitas secara signifikan.',
                    warning: null,
                    aspects: [
                        { icon: '~', text: 'Prioritas kadang masih blur' },
                        { icon: '📱', text: 'Distraksi masih sering mengganggu' },
                        { icon: '⏰', text: 'Deadline kadang terlewat' },
                        { icon: '🔀', text: 'Multitasking yang belum efektif' },
                        { icon: '📝', text: 'Perencanaan belum konsisten' },
                        { icon: '💪', text: 'Ada motivasi untuk improve' }
                    ],
                    suggestions: [
                        'Mulai gunakan to-do list atau task management app untuk tracking tugas',
                        'Praktikkan Eisenhower Matrix untuk kategorisasi urgent vs important',
                        'Set timer untuk focused work session (teknik Pomodoro - 25 menit fokus, 5 menit break)',
                        'Identifikasi peak productivity hours Anda dan schedule tugas penting di waktu tersebut',
                        'Kurangi multitasking - fokus pada satu tugas sampai selesai atau mencapai milestone',
                        'Buat morning routine yang konsisten untuk memulai hari dengan produktif',
                        'Review hari Anda setiap malam - apa yang berhasil dan apa yang perlu diperbaiki',
                        'Matikan notifikasi yang tidak penting saat bekerja',
                        'Alokasikan buffer time antara meetings atau tugas untuk transisi',
                        'Belajar estimasi waktu yang lebih akurat untuk setiap tugas',
                        'Cari accountability partner untuk saling support dalam habit building',
                        'Mulai dengan satu habit improvement, jangan overwhelm diri dengan perubahan besar sekaligus'
                    ]
                };
            } else {
                return {
                    title: 'Perlu Belajar Mengelola Waktu',
                    color: '#e67e22',
                    icon: '⏳',
                    description: 'Anda perlu segera mulai memperbaiki cara mengelola waktu. Saat ini waktu Anda banyak terbuang percuma dan produktivitas masih sangat rendah. Namun kabar baiknya, manajemen waktu adalah skill yang bisa dipelajari dan ditingkatkan dengan praktek yang konsisten.',
                    warning: null,
                    aspects: [
                        { icon: '❌', text: 'Prioritas tidak jelas' },
                        { icon: '😰', text: 'Sering terburu-buru last minute' },
                        { icon: '🎲', text: 'Reaktif daripada proaktif' },
                        { icon: '📵', text: 'Mudah terdistraksi' },
                        { icon: '⏰', text: 'Sering miss deadline' },
                        { icon: '😓', text: 'Merasa overwhelmed dengan tugas' }
                    ],
                    suggestions: [
                        'Mulai dari yang sederhana: buat list 3 tugas penting yang harus diselesaikan setiap hari',
                        'Gunakan calendar untuk blocking waktu - treat appointments dengan diri sendiri sama penting dengan meeting',
                        'Identifikasi 3 time-waster terbesar Anda (social media, TV, dll) dan set batasan waktu',
                        'Bangun habit planning: spend 10 menit setiap malam untuk plan besok',
                        'Start small: fokus perbaiki satu aspek dulu, misalnya bangun di jam yang sama setiap hari',
                        'Belajar saying no - Anda tidak harus menerima setiap request',
                        'Eliminate decision fatigue dengan membuat routine untuk aktivitas rutin',
                        'Cari mentor atau ikuti course tentang time management',
                        'Track waktu Anda selama 1 minggu untuk awareness kemana waktu benar-benar terpakai',
                        'Set realistic goals - jangan overcommit',
                        'Celebrate small wins untuk build momentum',
                        'Remember: perfect is the enemy of done. Selesaikan dulu, sempurnakan kemudian',
                        'Cari accountability - share goals dengan teman atau keluarga',
                        'Invest in tools yang membantu: planner, apps, timer, dll'
                    ]
                };
            }
        }

        function drawChart(total, color) {
            const ctx = document.getElementById('barChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Skor Anda'],
                    datasets: [{
                        label: 'Skor Manajemen Waktu',
                        data: [total],
                        backgroundColor: color,
                        borderRadius: 10,
                        barThickness: 60
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 30,
                            ticks: {
                                stepSize: 5
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            }
                        },
                        y: {
                            display: false
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `Skor: ${context.parsed.x}/30`;
                                }
                            }
                        }
                    }
                }
            });
        }

        async function downloadAsImage() {
            const button = event.target;
            button.disabled = true;
            button.textContent = '⏳ Memproses...';

            try {
                const content = document.getElementById('downloadContent');
                const canvas = await html2canvas(content, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    windowWidth: content.scrollWidth,
                    windowHeight: content.scrollHeight
                });

                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    const date = new Date().toISOString().split('T')[0];
                    link.download = `Hasil-Manajemen-Waktu-${date}.jpg`;
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);

                    button.disabled = false;
                    button.textContent = '✅ Berhasil! Download Lagi?';
                    setTimeout(() => {
                        button.innerHTML = '📥 Download Hasil (JPG)';
                    }, 3000);
                }, 'image/jpeg', 0.95);

            } catch (error) {
                console.error('Error:', error);
                button.disabled = false;
                button.textContent = '❌ Gagal. Coba Lagi';
                setTimeout(() => {
                    button.innerHTML = '📥 Download Hasil (JPG)';
                }, 3000);
            }
        }

        loadData();
    </script>
</body>
</html>
