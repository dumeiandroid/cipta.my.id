<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stres Kerja</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --danger: #e74c3c;
            --safe: #2ecc71;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 850px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .profile-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .profile-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-item strong {
            color: var(--text-dark);
            font-size: 13px;
        }

        .profile-item span {
            color: var(--text-light);
            font-size: 14px;
        }

        .score-display {
            text-align: center;
            margin: 30px 0;
            padding: 30px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 15px;
        }

        .score-number {
            font-size: 56px;
            font-weight: bold;
        }

        .score-label {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 5px;
        }

        .chart-section {
            margin: 30px 0;
        }

        .chart-wrapper {
            max-width: 300px;
            margin: 0 auto;
            position: relative;
        }

        .chart-center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .chart-center-text .big-number {
            font-size: 42px;
            font-weight: bold;
        }

        .chart-center-text .small-text {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 5px;
        }

        .result-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 30px;
            border-radius: 15px;
            border-left: 6px solid;
            margin: 25px 0;
        }

        .result-card h2 {
            font-size: 26px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-card .description {
            color: var(--text-dark);
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .stress-indicators {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .stress-indicators h3 {
            color: var(--text-dark);
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .indicator-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid;
        }

        .indicator-item.positive {
            border-color: #2ecc71;
        }

        .indicator-item.negative {
            border-color: #e74c3c;
        }

        .indicator-item .icon {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .indicator-item .text {
            font-size: 14px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .warning-box {
            background: #ffebee;
            border-left: 4px solid #e74c3c;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .warning-box h4 {
            color: #c62828;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .warning-box p {
            color: #c62828;
            line-height: 1.6;
            font-size: 14px;
        }

        .suggestions {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .suggestions h3 {
            color: #2e7d32;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestions ul {
            list-style: none;
            padding: 0;
        }

        .suggestions li {
            padding: 10px 0;
            padding-left: 25px;
            position: relative;
            color: #2e7d32;
            line-height: 1.6;
        }

        .suggestions li:before {
            content: "🧘";
            position: absolute;
            left: 0;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 166, 255, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #66a6ff;
            border: 2px solid #66a6ff;
        }

        .btn-secondary:hover {
            background: #66a6ff;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-light);
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
        }

        @media print {
            body {
                background: white;
            }
            .action-buttons {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }
            
            .score-number {
                font-size: 42px;
            }

            .content {
                padding: 20px;
            }

            .indicators-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">
            <h2>⏳ Menganalisis tingkat stres kerja Anda...</h2>
            <p>Mohon tunggu sebentar</p>
        </div>
    </div>

    <script>
        async function loadData() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showError('Token tidak ditemukan. Silakan kembali dan isi form terlebih dahulu.');
                return;
            }

            try {
                const response = await fetch(
                    `https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6?table=tes&x_04_eq=${token}`,
                    { headers: { 'X-Custom-Auth': 'admin' } }
                );
                
                const res = await response.json();
                
                if (res.success && res.count > 0) {
                    renderUI(res.data[0]);
                } else {
                    showError('Data tidak ditemukan. Pastikan Anda telah mengisi form dengan benar.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Terjadi kesalahan sistem. Silakan coba lagi nanti.');
            }
        }

        function showError(message) {
            document.getElementById('app').innerHTML = `
                <div class="error">
                    <h2>❌ Oops!</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        function renderUI(data) {
            const dataDiri = JSON.parse(data.x_02);
            const jawaban = JSON.parse(data.x_03);
            
            let skor = 0;
            for (let i = 1; i <= 12; i++) {
                const val = jawaban[`q${i}`];
                if (i <= 9 && val === 'Y') skor++;
                if (i >= 10 && val === 'T') skor++;
            }

            const result = getResult(skor);
            
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <h1>😰 Analisis Stres Kerja</h1>
                    <p>Evaluasi Kondisi Psikologis dalam Lingkungan Kerja</p>
                </div>

                <div class="content" id="downloadContent">
                    <div class="profile-section">
                        <div class="profile-item">
                            <strong>👤 Nama:</strong>
                            <span>${dataDiri.nama}</span>
                        </div>
                        <div class="profile-item">
                            <strong>🎂 Usia:</strong>
                            <span>${dataDiri.usia} Tahun</span>
                        </div>
                        <div class="profile-item">
                            <strong>🎓 Pendidikan:</strong>
                            <span>${dataDiri.pendidikan}</span>
                        </div>
                        <div class="profile-item">
                            <strong>📅 Tanggal Tes:</strong>
                            <span>${data.x_05}</span>
                        </div>
                    </div>

                    <div class="score-display">
                        <div class="score-number" style="color: ${result.color}">${skor}</div>
                        <div class="score-label">Skor Beban Stres dari 12</div>
                    </div>

                    <div class="chart-section">
                        <div class="chart-wrapper">
                            <canvas id="stressChart"></canvas>
                            <div class="chart-center-text">
                                <div class="big-number" style="color: ${result.color}">${skor}</div>
                                <div class="small-text">dari 12</div>
                            </div>
                        </div>
                    </div>

                    <div class="result-card" style="border-color: ${result.color}">
                        <h2 style="color: ${result.color}">
                            ${result.icon} ${result.title}
                        </h2>
                        <div class="description">
                            ${result.description}
                        </div>

                        ${result.warning ? `
                            <div class="warning-box">
                                <h4>⚠️ Perhatian Serius</h4>
                                <p>${result.warning}</p>
                            </div>
                        ` : ''}

                        <div class="stress-indicators">
                            <h3>📊 Indikator Kondisi Anda</h3>
                            <div class="indicators-grid">
                                ${result.indicators.map(ind => `
                                    <div class="indicator-item ${ind.type}">
                                        <div class="icon">${ind.icon}</div>
                                        <div class="text">${ind.text}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="suggestions">
                            <h3>💡 Rekomendasi untuk Anda</h3>
                            <ul>
                                ${result.suggestions.map(sug => `<li>${sug}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="downloadAsImage()">
                            📥 Download Hasil (JPG)
                        </button>
                        <button class="btn btn-secondary" onclick="window.print()">
                            🖨️ Cetak Laporan
                        </button>
                    </div>
                </div>
            `;

            drawChart(skor, result.color);
        }

        function getResult(skor) {
            if (skor >= 4) {
                return {
                    title: 'Waspada: Stres Negatif Terdeteksi',
                    color: '#e74c3c',
                    icon: '🚨',
                    description: 'Hasil tes menunjukkan bahwa Anda sedang mengalami stres negatif yang cukup signifikan. Kondisi ini tidak boleh diabaikan karena dapat berdampak pada kesehatan fisik dan mental Anda dalam jangka panjang. Anda perlu segera mengambil langkah-langkah untuk mengelola dan mengurangi stres.',
                    warning: 'Stres yang berkelanjutan dapat menyebabkan burnout, masalah kesehatan fisik (hipertensi, gangguan pencernaan, insomnia), dan masalah mental (anxiety, depresi). Jika gejala berlanjut atau memburuk, sangat disarankan untuk berkonsultasi dengan profesional kesehatan mental.',
                    indicators: [
                        { icon: '😰', text: 'Mengalami gejala stres yang mengganggu', type: 'negative' },
                        { icon: '😴', text: 'Kemungkinan gangguan tidur atau kelelahan kronis', type: 'negative' },
                        { icon: '😤', text: 'Mudah marah atau frustrasi', type: 'negative' },
                        { icon: '🎯', text: 'Kesulitan fokus dan konsentrasi', type: 'negative' },
                        { icon: '💔', text: 'Motivasi dan semangat kerja menurun', type: 'negative' },
                        { icon: '🏥', text: 'Berisiko mengalami dampak kesehatan', type: 'negative' }
                    ],
                    suggestions: [
                        'PRIORITAS UTAMA: Temukan sumber stres utama Anda dan buat rencana konkret untuk mengatasinya',
                        'Praktikkan teknik relaksasi setiap hari: deep breathing, meditasi, atau progressive muscle relaxation',
                        'Atur boundaries yang jelas antara pekerjaan dan kehidupan pribadi - hindari membawa pekerjaan pulang',
                        'Lakukan aktivitas fisik minimal 30 menit sehari - olahraga efektif mengurangi hormon stres',
                        'Prioritaskan tidur yang cukup dan berkualitas (7-9 jam per malam)',
                        'Kurangi konsumsi kafein dan hindari self-medication dengan alkohol',
                        'Berbicara dengan orang yang dipercaya tentang apa yang Anda rasakan',
                        'Jika workload berlebihan, bicarakan dengan atasan tentang prioritas atau delegasi',
                        'Ambil cuti atau leave jika diperlukan untuk recharge',
                        'Lakukan aktivitas yang Anda nikmati di luar pekerjaan untuk restore energy',
                        'Pertimbangkan konseling profesional atau Employee Assistance Program (EAP) jika tersedia',
                        'Evaluasi apakah pekerjaan saat ini sustainable untuk jangka panjang',
                        'Jangan ragu mencari bantuan profesional - kesehatan mental sama pentingnya dengan kesehatan fisik'
                    ]
                };
            } else {
                return {
                    title: 'Kondisi Aman - Stres Terkendali',
                    color: '#2ecc71',
                    icon: '✅',
                    description: 'Selamat! Anda masih berada dalam kondisi yang aman dalam mengelola stres di tempat kerja. Anda memiliki coping mechanism yang cukup baik dan mampu menjaga keseimbangan antara tuntutan pekerjaan dengan wellbeing pribadi. Pertahankan kondisi ini dengan terus merawat kesehatan mental Anda.',
                    warning: null,
                    indicators: [
                        { icon: '😊', text: 'Kondisi psikologis yang stabil', type: 'positive' },
                        { icon: '⚖️', text: 'Balance yang baik antara kerja dan kehidupan pribadi', type: 'positive' },
                        { icon: '💪', text: 'Coping mechanism yang efektif', type: 'positive' },
                        { icon: '🎯', text: 'Mampu fokus dan produktif', type: 'positive' },
                        { icon: '😴', text: 'Kualitas tidur yang cukup baik', type: 'positive' },
                        { icon: '🌟', text: 'Motivasi kerja yang terjaga', type: 'positive' }
                    ],
                    suggestions: [
                        'Pertahankan work-life balance yang sudah baik - jangan sampai tergoda untuk overwork',
                        'Tetap praktikkan self-care routine secara konsisten meski merasa "baik-baik saja"',
                        'Lanjutkan aktivitas atau hobi yang membuat Anda happy dan relaxed',
                        'Jaga kualitas hubungan dengan keluarga dan teman - support system penting untuk resilience',
                        'Tetap monitor kondisi Anda - stres bisa bertambah secara gradual tanpa disadari',
                        'Bangun resilience dengan terus belajar coping strategies baru',
                        'Praktikkan gratitude - fokus pada hal positif dapat meningkatkan wellbeing',
                        'Maintain healthy lifestyle: olahraga teratur, makan sehat, tidur cukup',
                        'Jangan ragu untuk set boundaries saat diperlukan',
                        'Tetap aware terhadap tanda-tanda stres agar bisa intervensi sejak dini',
                        'Share strategi coping Anda dengan rekan kerja yang mungkin membutuhkan',
                        'Sesekali lakukan refreshing atau vacation untuk recharge energy',
                        'Terus kembangkan skill manajemen waktu dan prioritas untuk mencegah overwhelm di masa depan'
                    ]
                };
            }
        }

        function drawChart(skor, color) {
            const ctx = document.getElementById('stressChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [skor, 12 - skor],
                        backgroundColor: [color, '#f1f1f1'],
                        borderWidth: 0,
                        cutout: '80%'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            enabled: false
                        }
                    }
                }
            });
        }

        async function downloadAsImage() {
            const button = event.target;
            button.disabled = true;
            button.textContent = '⏳ Memproses...';

            try {
                const content = document.getElementById('downloadContent');
                const canvas = await html2canvas(content, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    windowWidth: content.scrollWidth,
                    windowHeight: content.scrollHeight
                });

                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    const date = new Date().toISOString().split('T')[0];
                    link.download = `Hasil-Analisis-Stres-Kerja-${date}.jpg`;
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);

                    button.disabled = false;
                    button.textContent = '✅ Berhasil! Download Lagi?';
                    setTimeout(() => {
                        button.innerHTML = '📥 Download Hasil (JPG)';
                    }, 3000);
                }, 'image/jpeg', 0.95);

            } catch (error) {
                console.error('Error:', error);
                button.disabled = false;
                button.textContent = '❌ Gagal. Coba Lagi';
                setTimeout(() => {
                    button.innerHTML = '📥 Download Hasil (JPG)';
                }, 3000);
            }
        }

        loadData();
    </script>
</body>
</html>
