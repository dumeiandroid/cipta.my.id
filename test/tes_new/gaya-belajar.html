<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Gaya Belajar VAK</title>
    <style>
        :root { 
            --primary: #4a90e2; 
            --bg: #f4f7f6; 
            --accent-color: #3498db;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        
        .section-title { font-weight: bold; margin-top: 20px; border-bottom: 2px solid #eee; padding-bottom: 5px; color: var(--primary); }
        .input-group { margin: 15px 0; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #555; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        /* Styling Tombol Jawaban */
        .answer-row { display: flex; align-items: center; padding: 15px 5px; border-bottom: 1px solid #eee; }
        .num { width: 40px; font-weight: bold; color: #777; }
        .options { display: flex; flex-grow: 1; gap: 10px; }
        
        .option-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--accent-color);
            background: white;
            color: var(--accent-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .option-btn:hover { background: #f0f7ff; }

        /* Style saat tombol dipilih */
        .option-btn.selected {
            background: var(--accent-color);
            color: white;
        }
        
        /* Styling Button Submit & Loading */
        #btn-submit { 
            width: 100%; padding: 15px; background: #333; color: white; border: none; 
            border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 25px; font-size: 16px; 
        }
        #btn-submit:hover { background: #000; }
        #btn-submit:disabled { background: #999; cursor: not-allowed; }

        .loading-box {
            display: none;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tes Gaya Belajar (VAK)</h2>
    
    <form id="vakForm">
        <div class="section-title">Data Diri</div>
        <div class="input-group">
            <label>Nama Lengkap</label>
            <input type="text" id="nama" name="nama" required placeholder="Masukkan nama...">
        </div>
        <div class="input-group">
            <label>Usia</label>
            <input type="number" id="usia" name="usia" required placeholder="Contoh: 17">
        </div>
        <div class="input-group">
            <label>Pendidikan Terakhir</label>
            <select id="pendidikan" name="pendidikan" required>
                <option value="">Pilih Pendidikan...</option>
                <option value="SD">SD</option>
                <option value="SMP">SMP</option>
                <option value="SMA/SMK">SMA/SMK</option>
                <option value="Diploma/S1">Diploma/S1</option>
                <option value="S2/S3">S2/S3</option>
            </select>
        </div>

        <div class="section-title">Lembar Jawaban</div>
        <div id="rowsContainer"></div>
        
        <button type="button" id="btn-submit" onclick="submitData()">Simpan & Lihat Hasil</button>
        <div id="loading-text" class="loading-box">⏳ Sedang memproses data...</div>
    </form>
</div>

<script>
    // ✅ Tabel: nilai1_json
    const API_URL = "https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6?table=nilai1_json";
    const totalQuestions = 15;
    let jawabanData = {};

    // Ambil nama tes dari <title>, huruf kecil, spasi → tanda hubung
    function getNamaTestKey() {
        return document.title.trim().toLowerCase().replace(/\s+/g, '-');
    }

    // Generate baris soal dengan tombol
    const container = document.getElementById('rowsContainer');
    for (let i = 1; i <= totalQuestions; i++) {
        container.innerHTML += `
            <div class="answer-row">
                <div class="num">${i}</div>
                <div class="options" id="group-r${i}">
                    <div class="option-btn" onclick="selectOption(${i}, 'A')">A</div>
                    <div class="option-btn" onclick="selectOption(${i}, 'B')">B</div>
                    <div class="option-btn" onclick="selectOption(${i}, 'C')">C</div>
                </div>
            </div>`;
    }

    // Fungsi saat tombol jawaban diklik
    function selectOption(questionNum, val) {
        jawabanData[`r${questionNum}`] = val;

        const buttons = document.querySelectorAll(`#group-r${questionNum} .option-btn`);
        buttons.forEach(btn => btn.classList.remove('selected'));

        const selectedBtn = Array.from(buttons).find(btn => btn.innerText === val);
        if (selectedBtn) selectedBtn.classList.add('selected');
    }

    async function submitData() {
        const nama = document.getElementById('nama').value;
        const usia = document.getElementById('usia').value;
        const pendidikan = document.getElementById('pendidikan').value;

        if (!nama || !usia || !pendidikan) return alert("Mohon lengkapi data diri!");
        
        if (Object.keys(jawabanData).length < totalQuestions) {
            return alert("Mohon isi semua jawaban nomor 1 sampai 15!");
        }

        const tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        // ✅ tgl_tes masuk ke dalam x_02 bersama data diri
        const dataDiri = { nama, usia, pendidikan, tgl_tes: tgl };

        const btnSubmit = document.getElementById('btn-submit');
        const loadingText = document.getElementById('loading-text');
        btnSubmit.classList.add('hidden');
        loadingText.style.display = 'block';

        // ✅ Token masuk ke x_01
        const token = Math.random().toString(36).substring(2, 10) + Date.now().toString(36);

        // ✅ Format jawaban: "A;B;C;..." dengan titik koma di akhir
        const namaKey = getNamaTestKey();
        const jawabanStr = Array.from({ length: totalQuestions }, (_, i) => jawabanData[`r${i + 1}`]).join(';') + ';';

        // ✅ Simpan ke x_07 sebagai JSON dengan key = nama tes
        const x07 = {};
        x07[namaKey] = jawabanStr;

        const payload = {
            x_01: token,
            x_02: JSON.stringify(dataDiri),  // ✅ berisi nama, usia, pendidikan, tgl_tes
            x_07: JSON.stringify(x07)
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-Custom-Auth': 'admin' 
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (result.success) {
                window.location.href = `01view.html?token=${token}`;
            } else {
                alert("Gagal menyimpan data.");
                resetButton();
            }
        } catch (e) {
            alert("Kesalahan koneksi ke server.");
            resetButton();
        }
    }

    function resetButton() {
        document.getElementById('btn-submit').classList.remove('hidden');
        document.getElementById('loading-text').style.display = 'none';
    }
</script>
</body>
</html>
