<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Tes Kecerdasan Majemuk</title>
    <style>
        :root { 
            --primary: #27ae60; 
            --bg: #f4f4f9; 
            --dark: #2c3e50;
            --accent: #2ecc71;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--dark); }
        
        .section-title { font-weight: bold; margin-top: 25px; border-bottom: 2px solid #eee; padding-bottom: 5px; color: var(--primary); }
        .input-group { margin: 15px 0; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #555; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        .answer-row { display: flex; align-items: center; padding: 12px 5px; border-bottom: 1px solid #eee; gap: 15px; }
        .num { width: 35px; font-weight: bold; color: #777; }
        
        .options { display: flex; flex-grow: 1; gap: 10px; }
        .option-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .option-btn:hover { background: #f0fdf4; }
        .option-btn.selected {
            background: var(--primary);
            color: white;
        }

        #btn-submit { 
            width: 100%; padding: 15px; background: var(--dark); color: white; border: none; 
            border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 30px; font-size: 16px; 
        }
        #btn-submit:hover { background: #1a252f; }
        
        .loading-box {
            display: none;
            text-align: center;
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            color: var(--primary);
            font-weight: bold;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tes Kecerdasan Majemuk</h2>
    <form id="intelForm">
        <div class="section-title">Data Diri</div>
        <div class="input-group">
            <label>Nama Lengkap</label>
            <input type="text" id="nama" required placeholder="Nama Anda...">
        </div>
        <div class="input-group">
            <label>Usia</label>
            <input type="number" id="usia" required placeholder="Usia...">
        </div>
        <div class="input-group">
            <label>Pendidikan</label>
            <select id="pendidikan" required>
                <option value="">Pilih...</option>
                <option value="SD">SD</option>
                <option value="SMP">SMP</option>
                <option value="SMA/SMK">SMA/SMK</option>
                <option value="Diploma/S1">Diploma/S1</option>
            </select>
        </div>

        <div class="section-title">Lembar Jawaban</div>
        <div id="quizContainer"></div>
        
        <button type="button" id="btn-submit" onclick="submitData()">Simpan & Lihat Hasil</button>
        <div id="loading-status" class="loading-box">⌛ Sedang memproses skor kecerdasan...</div>
    </form>
</div>

<script>
    const groups = [
        { id: 'A', name: 'Linguistik' }, { id: 'B', name: 'Matematika Logis' },
        { id: 'C', name: 'Spasial' }, { id: 'D', name: 'Kinestetik' },
        { id: 'E', name: 'Musikal' }, { id: 'F', name: 'Interpersonal' },
        { id: 'G', name: 'Intrapersonal' }, { id: 'H', name: 'Naturalis' }
    ];

    let jawabanDataRaw = {}; // Menyimpan pilihan 'Sesuai'

    function initQuiz() {
        const container = document.getElementById('quizContainer');
        let globalNum = 1;

        groups.forEach(g => {
            for (let i = 1; i <= 10; i++) {
                const key = `${g.id}_${i}`;
                container.innerHTML += `
                    <div class="answer-row">
                        <div class="num">${globalNum}</div>
                        <div class="options" id="group-${key}">
                            <div class="option-btn" onclick="selectOption('${g.id}', ${i}, 'Sesuai')">A</div>
                            <div class="option-btn" onclick="selectOption('${g.id}', ${i}, 'Tidak')">B</div>
                        </div>
                    </div>`;
                globalNum++;
            }
        });
    }
    
    initQuiz();

    function selectOption(groupId, num, type) {
        const key = `${groupId}_${num}`;
        
        if (type === 'Sesuai') {
            jawabanDataRaw[key] = true;
        } else {
            delete jawabanDataRaw[key];
        }

        const buttons = document.querySelectorAll(`#group-${key} .option-btn`);
        buttons.forEach(btn => btn.classList.remove('selected'));
        const selectedIndex = type === 'Sesuai' ? 0 : 1;
        buttons[selectedIndex].classList.add('selected');
    }

    async function submitData() {
        const nama = document.getElementById('nama').value;
        const usia = document.getElementById('usia').value;
        const pendidikan = document.getElementById('pendidikan').value;

        if(!nama || !usia || !pendidikan) return alert("Lengkapi data diri!");

        const btnSubmit = document.getElementById('btn-submit');
        const loadingBox = document.getElementById('loading-status');
        btnSubmit.classList.add('hidden');
        loadingBox.style.display = 'block';

        // Hitung total poin per kategori untuk dikirim ke view
        const jawabanFinal = {};
        groups.forEach(g => {
            const count = Object.keys(jawabanDataRaw).filter(k => k.startsWith(g.id)).length;
            jawabanFinal[g.name] = count;
        });

        const tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        const dataDiriObj = { nama, usia, pendidikan, tgl_tes: tgl };
        const token = "INTEL-" + Math.random().toString(36).substring(2, 10);
        const namaKey = document.title.trim().toLowerCase().replace(/\s+/g, '-');
        const groupIds = ['A','B','C','D','E','F','G','H'];
        let jawabanArr = [];
        groupIds.forEach(gId => {
            for(let i=1; i<=10; i++) jawabanArr.push(jawabanDataRaw[`${gId}_${i}`] ? 'A' : 'B');
        });
        const jawabanStr = jawabanArr.join(';') + ';';
        const x07 = {}; x07[namaKey] = jawabanStr;
        const payload = {
            x_01: token,
            x_02: JSON.stringify(dataDiriObj),
            x_07: JSON.stringify(x07)
        };

        try {
            const res = await fetch("https://lidan-co-id.pages.dev/api/contacts_filter_dinamis6?table=nilai1_json", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Custom-Auth': 'admin' },
                body: JSON.stringify(payload)
            });
            
            if((await res.json()).success) {
                window.location.href = `03view.html?token=${token}`;
            } else {
                alert("Gagal menyimpan.");
                resetUI();
            }
        } catch (e) { 
            alert("Gagal koneksi."); 
            resetUI();
        }
    }

    function resetUI() {
        document.getElementById('btn-submit').classList.remove('hidden');
        document.getElementById('loading-status').style.display = 'none';
    }
</script>
</body>
</html>
